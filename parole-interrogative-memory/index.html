<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Da Capo | Abbina le parole interrogative</title>
<style>
:root{--green:#0b4f35;--green2:#2b6951;--cream:#fbf7ec;--gold:#d7b353;--ink:#17362b;--muted:#748078}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;background:radial-gradient(circle at 8% 2%,#e5efe5,transparent 28%),var(--cream);font-family:Arial,sans-serif;color:var(--ink)}
.app{max-width:820px;margin:auto}.brand{text-align:center;color:var(--green)}.tree{font-size:35px}.brand h1{font:700 32px Georgia,serif;margin:0}.brand small{font-size:10px;letter-spacing:1.6px}
h2{text-align:center;font:700 27px Georgia,serif;color:var(--green);margin:14px 0 4px}.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:13px}
.panel{background:#fffdf8;border:1px solid #dce5dc;border-radius:24px;padding:17px;box-shadow:0 12px 30px #17362b12}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;font-weight:900}.pill{background:#edf5ee;color:var(--green);padding:7px 10px;border-radius:99px}
.bar{height:7px;background:#e9eee8;border-radius:10px;overflow:hidden;margin:12px 0 15px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--gold));transition:.35s}
.note{background:#f8f2df;border:1px solid #ead9a3;border-radius:16px;padding:10px 12px;text-align:center;font-size:11px;color:#6e5a20;margin-bottom:14px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:13px}.coltitle{text-align:center;font:700 15px Georgia,serif;color:var(--green);margin-bottom:8px}
.column{display:flex;flex-direction:column;gap:8px}
.card{width:100%;min-height:58px;border-radius:15px;border:1px solid #cad9cd;padding:9px 10px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;touch-action:manipulation}
.it{background:#edf5ee;color:var(--green);font-family:Georgia,serif;font-size:16px}.az{background:#fff;color:#42554b;font-size:12px}.card.sel{outline:3px solid var(--gold);transform:scale(1.015)}.card.wrong{background:#fae7e4!important;border-color:#d98f87;animation:shake .28s}.card.done{opacity:0;transform:scale(.82);pointer-events:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{text-align:center;min-height:34px;padding-top:10px;font-size:12px;font-weight:900}.ok{color:#28794e}.bad{color:#aa4e46}
.legend{margin-top:8px;text-align:center;color:var(--muted);font-size:11px}
.finish{text-align:center;padding:20px 8px}.pct{font:700 52px Georgia,serif;color:var(--green);margin:8px}.restart,.audio{border:0;background:var(--green);color:#fff;border-radius:12px;padding:10px 15px;font-weight:900;cursor:pointer}.audio{padding:6px 9px;margin-left:7px;font-size:11px}
@media(max-width:560px){body{padding:6px}.panel{padding:12px}.board{gap:8px}.card{min-height:61px;padding:7px;font-size:11px}.it{font-size:14px}.note{font-size:10px}}
</style>
</head>
<body>
<main class="app">
<div class="brand"><div class="tree">🌳</div><h1>Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></div>
<h2>Abbina le parole interrogative ❓🇮🇹</h2>
<div class="sub">Sual sözləri ilə tanış ol və uyğun mənanı tap.</div>
<section class="panel">
<div class="top"><span class="pill">MEMORY · ABBINA</span><span id="score">0 / 11</span></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div class="note"><b>QUANTO dəyişir:</b> QUANTO ♂ tək · QUANTA ♀ tək · QUANTI ♂ cəm · QUANTE ♀ cəm</div>
<div id="game"></div>
</section>
</main>
<script>
(()=>{
const pairs=[
["👤 CHI?","KİM?","Chi"],
["❓ CHE?","NƏ? / HANSI?","Che"],
["❓ COSA?","NƏ?","Cosa"],
["📍 DOVE?","HARADA? / HARAYA?","Dove"],
["🏠 DI DOVE?","HARADAN? / HARALI?","Di dove"],
["⏰ QUANDO?","NƏ VAXT?","Quando"],
["💬 COME?","NECƏ?","Come"],
["♂️ QUANTO?","NƏ QƏDƏR? · kişi cinsi, tək","Quanto"],
["♀️ QUANTA?","NƏ QƏDƏR? · qadın cinsi, tək","Quanta"],
["♂️👥 QUANTI?","NEÇƏ? · kişi cinsi, cəm","Quanti"],
["♀️👥 QUANTE?","NEÇƏ? · qadın cinsi, cəm","Quante"]
];
const sh=a=>[...a].sort(()=>Math.random()-.5);
let left=[],right=[],selL=null,selR=null,matched=0,attempts=0,firstWrong=new Set();
const game=document.getElementById("game"),fill=document.getElementById("fill"),score=document.getElementById("score");
function speak(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.78;const v=speechSynthesis.getVoices().find(x=>/^it(-|_)/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function start(){left=sh(pairs.map((p,i)=>({i,t:p[0]})));right=sh(pairs.map((p,i)=>({i,t:p[1]})));selL=selR=null;matched=attempts=0;firstWrong.clear();render()}
function render(){
 score.textContent=matched+" / 11";fill.style.width=(matched/11*100)+"%";
 game.innerHTML=`<div class="board"><div><div class="coltitle">🇮🇹 İtalyanca</div><div class="column" id="L">${left.map(x=>`<button class="card it" data-i="${x.i}">${x.t}</button>`).join("")}</div></div><div><div class="coltitle">🇦🇿 Azərbaycanca</div><div class="column" id="R">${right.map(x=>`<button class="card az" data-i="${x.i}">${x.t}</button>`).join("")}</div></div></div><div id="fb" class="feedback">Bir italyanca və bir Azərbaycanca kart seç.</div><div class="legend">Düzgün cüt tapıldıqda kartlar yox olacaq və italyanca söz səslənəcək. 🔊</div>`;
 document.querySelectorAll("#L .card").forEach(b=>b.onclick=()=>select("L",b));
 document.querySelectorAll("#R .card").forEach(b=>b.onclick=()=>select("R",b));
}
function select(side,b){
 const old=document.querySelector(`#${side} .sel`);if(old)old.classList.remove("sel");
 b.classList.add("sel");if(side==="L")selL=b;else selR=b;
 if(selL&&selR)check();
}
function check(){
 attempts++;
 const a=+selL.dataset.i,b=+selR.dataset.i,fb=document.getElementById("fb");
 if(a===b){
   const l=selL,r=selR;matched++;score.textContent=matched+" / 11";fill.style.width=(matched/11*100)+"%";
   fb.innerHTML=`✅ Düzdür! <b>${pairs[a][0].replace(/^[^A-ZÇĞİÖŞÜ]*/,"")}</b><button class="audio" id="aud">🔊 Dinlə</button>`;fb.className="feedback ok";
   speak(pairs[a][2]);document.getElementById("aud").onclick=()=>speak(pairs[a][2]);
   l.classList.add("done");r.classList.add("done");selL=selR=null;
   setTimeout(()=>{if(matched===pairs.length)finish()},500);
 }else{
   firstWrong.add(a+"-"+b);fb.textContent="🔄 Bu cüt uyğun deyil. Yenidən yoxla.";fb.className="feedback bad";
   selL.classList.add("wrong");selR.classList.add("wrong");const l=selL,r=selR;selL=selR=null;
   setTimeout(()=>{l.classList.remove("wrong","sel");r.classList.remove("wrong","sel")},430);
 }
}
function finish(){
 const accuracy=Math.round(11/Math.max(11,attempts)*100);
 game.innerHTML=`<div class="finish"><div style="font-size:45px">🌱🏆</div><div style="font:700 23px Georgia;color:var(--green)">Bravissimo!</div><div class="pct">${accuracy}%</div><div>${matched} sual sözünün hamısını uyğunlaşdırdın.</div><div style="font-size:12px;color:var(--muted);margin:7px 0 15px">Cəhd sayı: ${attempts}</div><button class="restart" id="again">↻ Yenidən qarışdır</button></div>`;
 document.getElementById("again").onclick=start;
}
start();
})();
</script>
</body></html>
