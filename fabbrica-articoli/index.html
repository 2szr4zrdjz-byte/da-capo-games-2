<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo | La Fabbrica degli Articoli</title>
<style>
:root{--g:#123f32;--c:#fbf6e8;--gold:#d1ae4b}*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--c);font-family:Arial;color:#263b32}.app{max-width:820px;margin:auto}.brand{text-align:center;color:var(--g)}h1,h2{font-family:Georgia}.panel,.card{background:#fff;border:1px solid #dce5dd;border-radius:20px;padding:15px}.panel{box-shadow:0 12px 30px #0001}.title{text-align:center;font:700 28px Georgia;color:var(--g)}.sub,.az{font-size:11px;color:#748078;text-align:center}.bar{height:8px;background:#e5ebe5;border-radius:9px;margin:12px 0;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2f6d54,var(--gold))}.route{display:flex;justify-content:center;gap:7px;margin:12px}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid #d6ded7}.dot.on{border-color:var(--gold);background:#fff3cf}.dot.done{background:var(--g);color:#fff}.head{text-align:center;background:#f2f6ee;border-radius:15px;padding:10px}.q{font:700 18px Georgia;color:var(--g);margin:8px 0;text-align:center}.visual{font-size:58px;line-height:1;text-align:center;margin:10px 0 3px}.visual.sm{font-size:34px}.word{text-align:center;font:700 25px Georgia;color:var(--g);margin:12px}.choices,.pool,.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.btn,.token{border:1px solid #c7d4c9;background:#fff;border-radius:11px;padding:10px 13px;font-weight:800;color:var(--g);touch-action:none;user-select:none}.sel{outline:3px solid #e1c362}.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.bin{min-height:125px;border:2px dashed #bdcbbf;border-radius:13px;padding:8px;text-align:center}.inside{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:7px}.bin .token{font-size:11px;padding:7px}.check,.next{width:100%;border:0;border-radius:11px;padding:12px;margin-top:9px;font-weight:900}.check{background:var(--g);color:#fff}.next{display:none;background:var(--gold)}.next.show{display:block}.fb{font-size:12px;line-height:1.5;margin-top:8px}.fb.show{background:#eef5ef;padding:10px;border-radius:10px}.slot{min-height:55px;min-width:90px;border:2px dashed #bdcbbf;border-radius:11px;padding:6px}.answerInput{width:100%;font-size:18px;line-height:1.35;padding:14px 15px;border:2px solid #bdcbbf;border-radius:12px;color:var(--g);background:#fff;outline:none;margin:12px 0}.answerInput:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d1ae4b22}.answerInput.bad{border-color:#c85b50;background:#fff7f5}.answerInput.ok{border-color:#3c805d;background:#f3fbf5}.hintline{font-size:11px;color:#748078;text-align:center;margin-top:-5px}.score{text-align:center;font:700 48px Georgia;color:var(--g)}@media(max-width:560px){.bins{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><div class="brand">🌳<h1 style="margin:0">Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></div><section class="panel"><div class="title">La Fabbrica degli Articoli 🏭🇮🇹</div><div class="sub">IL · I · LA · LE — artiklı seç, çeşidlə, cəmi qur və cümləni tamamla.</div><div class="bar"><div id="prog" class="fill"></div></div><div id="route" class="route"></div><div id="stage"></div></section></main>
<script>
const nounVisual={"giardino":"🌳","montagna":"⛰️","panini":"🥪","camicie":"👕","mercato":"🛒","bottiglie":"🍾","limone":"🍋","pomodori":"🍅","banana":"🍌","carote":"🥕","telefono":"📱","bicchieri":"🥛","penna":"🖊️","finestre":"🪟","cavallo":"🐴","conigli":"🐰","farfalla":"🦋","pecore":"🐑","vestito":"👗","calzini":"🧦","giacca":"🧥","scarpe":"👟","fiume":"🏞️","boschi":"🌲","spiaggia":"🏖️","foreste":"🌲","muro":"🧱","collina":"🌄","cappello":"🎩","torta":"🎂","panino":"🥪","balcone":"🏠","strada":"🛣️","cappelli":"🎩","piatti":"🍽️","cucina":"🍳","biscotti":"🍪","nuvole":"☁️","giardini":"🌳","muri":"🧱","colline":"🌄"};
function vis(w){return nounVisual[w]||"🖼️"}
const levels=[
{name:"Etichetta giusta",ico:"🏷️",type:"pick",data:[["giardino","bağ","il"],["montagna","dağ","la"],["panini","sendviçlər","i"],["camicie","köynəklər","le"],["mercato","bazar","il"],["bottiglie","butulkalar","le"]]},
{name:"Quattro scatole",ico:"📦",type:"bins",data:[
[["limone","limon","il"],["pomodori","pomidorlar","i"],["banana","banan","la"],["carote","yerkökülər","le"]],
[["telefono","telefon","il"],["bicchieri","stəkanlar","i"],["penna","qələm","la"],["finestre","pəncərələr","le"]],
[["cavallo","at","il"],["conigli","dovşanlar","i"],["farfalla","kəpənək","la"],["pecore","qoyunlar","le"]],
[["vestito","paltar","il"],["calzini","corablar","i"],["giacca","gödəkçə","la"],["scarpe","ayaqqabılar","le"]],
[["fiume","çay","il"],["boschi","meşələr","i"],["spiaggia","çimərlik","la"],["foreste","meşələr","le"]]]},
{name:"Macchina del plurale",ico:"🔄",type:"plural",data:[["il muro","divar","i muri","divarlar"],["la collina","təpə","le colline","təpələr"],["il cappello","papaq","i cappelli","papaqlar"],["la torta","tort","le torte","tortlar"],["il panino","sendviç","i panini","sendviçlər"]]},
{name:"L'intruso",ico:"🕵️",type:"intr",data:[
[["il balcone","la strada","i cappelli","le piatti"],"le piatti","i piatti","eyvan · küçə · papaqlar · boşqablar"],
[["la cucina","i biscotti","il mercato","i nuvole"],"i nuvole","le nuvole","mətbəx · peçenyelər · bazar · buludlar"],
[["le bottiglie","il panino","la montagna","le giardini"],"le giardini","i giardini","butulkalar · sendviç · dağ · bağlar"],
[["i muri","la torta","le camicie","la cappello"],"la cappello","il cappello","divarlar · tort · köynəklər · papaq"]]},
{name:"Boss Finale",ico:"👑",type:"boss",data:[
[["buona","è","la","torta"],["la","torta","è","buona"],"torta + buono","yaxşı / dadlı tort","La torta è buona. — Tort dadlıdır."],
[["neri","sono","cappelli","i"],["i","cappelli","sono","neri"],"cappelli + nero","qara papaqlar","I cappelli sono neri. — Papaqlar qaradır."],
[["alta","montagna","la","è"],["la","montagna","è","alta"],"montagna + alto","hündür dağ","La montagna è alta. — Dağ hündürdür."],
[["piccoli","i","sono","panini"],["i","panini","sono","piccoli"],"panini + piccolo","kiçik sendviçlər","I panini sono piccoli. — Sendviçlər kiçikdir."],
[["bianche","camicie","sono","le"],["le","camicie","sono","bianche"],"camicie + bianco","ağ köynəklər","Le camicie sono bianche. — Köynəklər ağdır."]]}];
function makeUtterance(txt){const u=new SpeechSynthesisUtterance(txt);u.lang="it-IT";u.rate=.78;u.pitch=1;const vs=speechSynthesis.getVoices();const it=vs.find(v=>/^it(-|_)/i.test(v.lang))||vs.find(v=>/ital/i.test(v.name));if(it)u.voice=it;return u}
function speakIt(txt){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();speechSynthesis.speak(makeUtterance(txt))}
function speakThenAdvance(txt){if(!("speechSynthesis" in window)){advanceAuto();return}speechSynthesis.cancel();const u=makeUtterance(txt);let moved=false;const go=()=>{if(moved)return;moved=true;advanceAuto()};u.onend=go;u.onerror=go;speechSynthesis.speak(u);setTimeout(go,7000)}
let l=0,t=0,score=0,first=true;const total=levels.reduce((a,x)=>a+x.data.length,0),st=document.querySelector("#stage");
function nav(){route.innerHTML=levels.map((x,i)=>`<div class="dot ${i<l?"done":i==l?"on":""}">${i<l?"✓":x.ico}</div>`).join("");let n=levels.slice(0,l).reduce((a,x)=>a+x.data.length,0)+t;prog.style.width=n/total*100+"%"}
function head(){let x=levels[l];return `<div class="head"><div style="font-size:35px">${x.ico}</div><h2 style="margin:3px;color:var(--g)">${x.name}</h2></div>`}
function intro(){nav();st.innerHTML=head()+`<div class="card"><div class="q">Mərhələyə hazırsan?</div><div class="az">🇦🇿 Yeni söz və cümlələrin mənası hər tapşırıqda kiçik qeyd kimi verilir.</div><button id="go" class="check">Başla →</button></div>`;go.onclick=render}
function shell(x){st.innerHTML=head()+`<div class="card">${x}<div id="fb" class="fb"></div></div>`}
function advanceAuto(){setTimeout(()=>{if(++t>=levels[l].data.length){l++;t=0;l<levels.length?intro():result()}else render()},650)}
function done(ok,msg){if(ok){if(first)score++;fb.className="fb show";fb.innerHTML="✅ <b>Corretto!</b> "+msg;advanceAuto()}else{first=false;fb.className="fb show";fb.innerHTML="⚠️ <b>Səhvdir.</b> Düzəlt və yenidən cəhd et."}}
function choose(answer,msg){document.querySelectorAll(".btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".btn").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");done(b.dataset.v===answer,msg)})}
function bind(){let s=null;document.querySelectorAll(".token").forEach(x=>{x.draggable=true;x.onclick=()=>{document.querySelectorAll(".token").forEach(z=>z.classList.remove("sel"));s=x;x.classList.add("sel")};x.ondragstart=e=>e.dataTransfer.setData("text/plain",x.dataset.v)});document.querySelectorAll("[data-drop]").forEach(d=>{d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();let v=e.dataTransfer.getData("text/plain"),x=[...document.querySelectorAll(".token")].find(z=>z.dataset.v===v);if(x)(d.querySelector(".inside")||d).appendChild(x)};d.onclick=e=>{if(s&&!e.target.classList.contains("token")){(d.querySelector(".inside")||d).appendChild(s);s.classList.remove("sel");s=null}}})}
function autoSpeakCurrent(x,d){setTimeout(()=>{if(x.type==="pick")speakIt(d[0]);else if(x.type==="bins"){}else if(x.type==="plural")speakIt(d[0]);else if(x.type==="intr")speakIt(d[0].join(". "));else if(x.type==="boss")speakIt(d[2].split(" + ")[0])},320)}
function render(){nav();first=true;let x=levels[l],d=x.data[t];setTimeout(()=>autoSpeakCurrent(x,d),40);
if(x.type==="pick"){shell(`<div class="q">Düzgün müəyyən artiklı seç.</div><div class="visual">${vis(d[0])}</div><div class="word">${d[0]}</div><div class="az">🇦🇿 ${d[1]}</div><div class="choices">${["il","i","la","le"].map(a=>`<button class="btn" data-v="${a}">${a.toUpperCase()}</button>`).join("")}</div>`);choose(d[2],`<b>${d[2]} ${d[0]}</b> — ${d[1]}.`)}
if(x.type==="bins"){shell(`<div class="q">Sözləri IL · I · LA · LE qutularına yerləşdir.</div><div class="az">🇦🇿 Hər keçiddə yeni 4 söz gəlir — hər artikl üçün bir söz.</div><div class="pool" data-drop="pool"><div class="inside">${d.map(a=>`<button class="token" data-v="${a[0]}"><span style="display:block;font-size:28px">${vis(a[0])}</span>${a[0]}<small style="display:block;color:#748078">🇦🇿 ${a[1]}</small></button>`).sort(()=>Math.random()-.5).join("")}</div></div><div class="bins">${["il","i","la","le"].map(a=>`<div class="bin" data-drop="${a}"><b>${a.toUpperCase()}</b><div class="inside"></div></div>`).join("")}</div>`);bind();const binState={};const evalPlacedWord=()=>{let anyWrong=false;d.forEach(a=>{const el=document.querySelector(`[data-v="${a[0]}"]`);const box=el?.closest(".bin");if(!box)return;const correct=box.dataset.drop===a[2];if(correct){if(!binState[a[0]]){binState[a[0]]=true;speakIt(a[0])}el.style.background="#e8f5eb"}else{anyWrong=true;binState[a[0]]=false;el.style.background="#fae8e5"}});if(anyWrong){if(first)first=false;fb.className="fb show";fb.innerHTML="⚠️ <b>Səhv qutu.</b> Qırmızı sözü düzgün artikl qutusuna keçir.";return}fb.className="fb";fb.innerHTML="";const all=d.every(a=>binState[a[0]]===true);if(all){if(first)score++;fb.className="fb show";fb.innerHTML="✅ <b>Corretto!</b> Bütün sözlər düzgün yerləşdirildi.";advanceAuto()}};document.querySelectorAll(".bin").forEach(z=>{z.addEventListener("drop",()=>setTimeout(evalPlacedWord,100));z.addEventListener("click",()=>setTimeout(evalPlacedWord,100))})}
if(x.type==="plural"){let opts=[d[2],d[2].replace(/^i /,"le "),d[2].replace(/^le /,"i "),d[2].replace(/.$/,"")].filter((v,i,a)=>a.indexOf(v)==i).sort(()=>Math.random()-.5);shell(`<div class="q">Tək formanı cəmə çevir.</div><div class="visual">${vis(d[0].replace(/^(il|la) /,""))}</div><div class="word">${d[0]}</div><div class="az">🇦🇿 ${d[1]} → ${d[3]}</div><div class="choices">${opts.map(a=>`<button class="btn" data-v="${a}">${a}</button>`).join("")}</div>`);choose(d[2],`<b>${d[0]} → ${d[2]}</b> — ${d[1]} → ${d[3]}.`)}
if(x.type==="intr"){shell(`<div class="q">Artiklı səhv olan kartı tap.</div><div class="az">🇦🇿 ${d[3]}</div><div class="choices">${d[0].map(a=>{let n=a.replace(/^(il|i|la|le) /,"");return `<span class="visual sm">${vis(n)}</span>`}).join("")}</div><div class="choices">${d[0].map(a=>`<button class="btn" data-v="${a}">${a}</button>`).join("")}</div>`);choose(d[1],`Səhv: <b>${d[1]}</b>. Düzgün forma: <b>${d[2]}</b>.`)}
if(x.type==="boss"){shell(`<div class="q">Cümləni özün yaz.</div><div class="visual">${vis(d[2].split(" + ")[0])}</div><div class="word">${d[2]}</div><div class="az">🇦🇿 ${d[3]}</div><form id="bossForm" autocomplete="off"><input id="bossInput" class="answerInput" type="text" inputmode="text" enterkeyhint="done" autocapitalize="sentences" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="İtalyanca tam cümləni yaz..." aria-label="İtalyanca cavab"><div class="hintline">Cümləni tam yaz və klaviaturada Enter / Done düyməsinə toxun.</div></form>`);const input=document.getElementById("bossInput"),form=document.getElementById("bossForm");const norm=v=>v.toLowerCase().trim().replace(/[.!?;,«»"“”]/g,"").replace(/\s+/g," ");const expected=d[1].join(" ");form.addEventListener("submit",e=>{e.preventDefault();if(!input.value.trim())return;const ok=norm(input.value)===norm(expected);if(ok){input.classList.remove("bad");input.classList.add("ok");input.disabled=true;if(first)score++;fb.className="fb show";fb.innerHTML="✅ <b>Corretto!</b> "+d[4]+"<br><small>🔊 Cümlə tamam səsləndirildikdən sonra növbəti karta keçəcək.</small>";setTimeout(()=>speakThenAdvance(expected),180)}else{input.classList.add("bad");done(false,"");input.focus();input.select()}});setTimeout(()=>input.focus({preventScroll:true}),180)}}
function result(){nav();prog.style.width="100%";st.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:55px">🏭✨</div><h2>Fabbrica completata!</h2><div class="score">${Math.round(score/total*100)}%</div><div class="az">${score}/${total} tapşırıq ilk cəhddə düzgün · hər səhv ilk cəhd yekun faizi azaldır</div><p><b>Yalnız IL → I və LA → LE</b> sistemi istifadə edildi.<br><small>LO, GLI və L’ tələb edən isimlər daxil edilməyib.</small></p><button class="check" onclick="location.reload()">↻ Yenidən oyna</button></div>`}
intro();
</script></body></html>
