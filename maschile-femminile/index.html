<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Da Capo | Maschile o femminile?</title>
<style>
:root{--g:#0b4f35;--g2:#176548;--cream:#fbf7ec;--gold:#d9b95b;--ink:#17362b;--muted:#718078;--red:#b93636}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{padding:14px;background:radial-gradient(circle at 10% 8%,rgba(217,185,91,.13),transparent 22%),radial-gradient(circle at 90% 88%,rgba(11,79,53,.09),transparent 24%),var(--cream)}
button{-webkit-appearance:none;appearance:none;font:inherit;-webkit-tap-highlight-color:transparent}
.app{max-width:720px;margin:auto}.brand{text-align:center}.tree{font-size:36px}.brand h1{margin:0;font:700 29px Georgia,serif;color:var(--g)}
.brand small{display:block;margin-top:3px;letter-spacing:2px;color:var(--g2);font-size:10px;text-transform:uppercase}
.head{text-align:center;margin:16px 0 10px}.head h2{margin:0;font:700 23px Georgia,serif;color:var(--g)}
.head p{margin:6px auto 0;max-width:590px;color:var(--muted);font-size:13px;line-height:1.4}
.panel{background:rgba(255,255,255,.86);border:1px solid rgba(11,79,53,.12);border-radius:24px;padding:18px;box-shadow:0 12px 30px rgba(25,55,42,.08)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#eef5f0;color:var(--g);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700}.stats{font-size:11px;color:var(--muted)}.stats b{color:var(--g)}
.prompt{text-align:center;color:var(--muted);font-size:11px;margin-top:22px;text-transform:uppercase;letter-spacing:1px}
.wordZone{min-height:150px;display:flex;align-items:center;justify-content:center}
.wordCard{min-width:180px;padding:21px 28px;border-radius:20px;background:#fff;border:1px solid #dce6df;box-shadow:0 8px 20px rgba(21,55,40,.10);font:700 34px Georgia,serif;color:var(--g);text-align:center;cursor:grab;touch-action:none;-webkit-user-drag:none;-webkit-user-select:none;user-select:none;position:relative}
.wordCard.dragging{z-index:100;opacity:.95;cursor:grabbing}.wordCard.ok{animation:pop .45s ease}.wordAz{text-align:center;margin-top:9px;font:italic 15px Georgia,serif;color:var(--g2)}.audioBtn{display:block;margin:10px auto 0;border:1px solid #cbdcd1;background:#eef5f0;color:var(--g);border-radius:999px;min-width:44px;min-height:44px;padding:8px 13px;font-weight:700;cursor:pointer}
@keyframes pop{45%{transform:scale(1.1)}}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:5px}
.target{min-height:128px;border:2px dashed rgba(23,54,43,.24);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink);cursor:pointer;transition:.18s}.target[data-g="m"]{background:#dceeff;border-color:#83b7e8}.target[data-g="f"]{background:#ffe1ec;border-color:#eaa0bd}
.target .symbol{font:700 47px Arial,sans-serif;line-height:1}.target .label{font:700 18px Georgia,serif}
.target.hot{border-color:var(--gold)!important;transform:scale(1.015);box-shadow:0 0 0 3px rgba(217,185,91,.18)}.target.good{border-style:solid!important;border-color:#4d9b6d!important;box-shadow:0 0 0 3px rgba(77,155,109,.13)}.target.bad{border-color:var(--red)!important;animation:shake .28s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
.translation{text-align:center;min-height:25px;margin-top:12px;font:italic 15px Georgia,serif;color:var(--g2);opacity:0}.translation.show{opacity:1}
.message{text-align:center;min-height:24px;margin-top:6px;font:700 13px Georgia,serif;color:var(--g)}.message.error{color:var(--red)}
.progress{height:6px;background:#e5e9e6;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:var(--gold);transition:width .25s}
.actions{text-align:center;margin-top:11px}.reset{border:1px solid rgba(11,79,53,.22);background:#fff;color:var(--g);border-radius:13px;padding:10px 14px;font-size:12px;font-weight:700}
.result{display:none;text-align:center;padding:30px 10px 20px}.result.show{display:block}.result .title{font:700 31px Georgia,serif;color:var(--g)}.result .pct{font:700 58px Georgia,serif;color:var(--g);margin:10px}.result p{font-size:13px;color:var(--muted)}
.game.hide{display:none}.footer{text-align:center;margin:13px 0 3px;font:italic 13px Georgia,serif;color:var(--g)}
@media(max-width:520px){body{padding:9px}.panel{padding:14px}.wordCard{font-size:29px;min-width:155px;padding:19px 22px}.target{min-height:115px}.target .symbol{font-size:42px}.target .label{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="brand"><div class="tree">🌳</div><h1>Da Capo</h1><small>Guided Self-Study Membership</small></header>
<section class="head"><h2>Maschile o femminile?</h2><p>İsmi uyğun cinsin üzərinə sürüşdür.</p></section>
<section class="panel">
<div class="game" id="game">
 <div class="top"><div class="pill">I SOSTANTIVI</div><div class="stats">Söz: <b id="counter">1 / 15</b></div></div>
 <div class="prompt">Che genere è?</div>
 <div class="wordZone"><div><div class="wordCard" id="wordCard">mare</div><div class="wordAz" id="wordAz">dəniz</div><button type="button" class="audioBtn" id="audioBtn" aria-label="Sözü dinlə">🔊 Dinlə</button></div></div>
 <div class="targets">
   <button type="button" class="target" id="mTarget" data-g="m"><div class="symbol">♂</div><div class="label">Maschile</div></button>
   <button type="button" class="target" id="fTarget" data-g="f"><div class="symbol">♀</div><div class="label">Femminile</div></button>
 </div>
 <div class="translation" id="translation"></div>
 <div class="message" id="message" aria-live="polite"></div>
 <div class="progress"><div class="fill" id="fill"></div></div>
 <div class="actions"><button type="button" class="reset" id="reset">↻ Yenidən başla</button></div>
</div>
<div class="result" id="result">
 <div class="title">Risultato finale 🌳</div><div class="pct" id="pct">0%</div>
 <p id="scoreLine"></p><p id="resultMsg"></p>
 <button type="button" class="reset" id="restart">↻ Yenidən başla</button>
</div>
</section>
<div class="footer">Osserva, scegli, impara. 🌱</div>
</main>
<script>
(function(){
var items=[
 {w:"mare",g:"m",az:"dəniz"},{w:"penna",g:"f",az:"qələm"},{w:"ponte",g:"m",az:"körpü"},
 {w:"treno",g:"m",az:"qatar"},{w:"lezione",g:"f",az:"dərs"},{w:"cappello",g:"m",az:"papaq"},
 {w:"stazione",g:"f",az:"stansiya"},{w:"borsa",g:"f",az:"çanta"},{w:"ristorante",g:"m",az:"restoran"},
 {w:"giardino",g:"m",az:"bağ"},{w:"televisione",g:"f",az:"televiziya"},{w:"scuola",g:"f",az:"məktəb"},
 {w:"giornale",g:"m",az:"qəzet"},{w:"telefono",g:"m",az:"telefon"},{w:"canzone",g:"f",az:"mahnı"}
];
var idx=0,firstCorrect=0,failed={},locked=false,drag=null,dx=0,dy=0;
var card=document.getElementById("wordCard"),m=document.getElementById("mTarget"),f=document.getElementById("fTarget");
function $(id){return document.getElementById(id)}
function setMsg(t,err){$("message").textContent=t;$("message").className=err?"message error":"message"}
function speak(t){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){setMsg("Bu brauzerdə səs dəstəklənmir.",true);return}try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.78;u.pitch=1;var vs=speechSynthesis.getVoices(),j;for(j=0;j<vs.length;j++){if(vs[j].lang&&vs[j].lang.toLowerCase().indexOf("it")===0){u.voice=vs[j];break}}speechSynthesis.speak(u)}catch(e){setMsg("Səsi başlatmaq mümkün olmadı.",true)}}
function render(){locked=false;setMsg("");m.className="target";f.className="target";card.className="wordCard";card.textContent=items[idx].w;$("wordAz").textContent=items[idx].az;$("counter").textContent=(idx+1)+" / "+items.length;$("translation").textContent="";$("translation").className="translation";$("fill").style.width=(idx/items.length*100)+"%"}
function attempt(g){if(locked)return;var it=items[idx],target=g==="m"?m:f;if(g===it.g){locked=true;if(!failed[idx])firstCorrect++;target.className="target good";$("fill").style.width=((idx+1)/items.length*100)+"%";setMsg("Corretto! ✓",false);speak(it.w);idx++;if(idx<items.length){var next=items[idx];card.textContent=next.w;$("wordAz").textContent=next.az;$("counter").textContent=(idx+1)+" / "+items.length;$("translation").textContent="";$("translation").className="translation";card.className="wordCard";setTimeout(function(){locked=false;m.className="target";f.className="target";setMsg("")},430)}else{setTimeout(finish,430)}}else{failed[idx]=true;target.className="target bad";setMsg("Səhvdir — bir daha düşün! ✕",true);setTimeout(function(){target.className="target";setMsg("")},650)}}
document.getElementById("audioBtn").addEventListener("click",function(){speak(items[idx].w)});m.addEventListener("click",function(){attempt("m")});f.addEventListener("click",function(){attempt("f")});
function hitTarget(x,y){var arr=[m,f],i,r;for(i=0;i<arr.length;i++){r=arr[i].getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return arr[i]}return null}
card.addEventListener("pointerdown",function(e){if(locked)return;drag=card;var r=card.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;card.setPointerCapture&&card.setPointerCapture(e.pointerId);card.className="wordCard dragging";card.style.position="fixed";card.style.width=r.width+"px";card.style.left=(e.clientX-dx)+"px";card.style.top=(e.clientY-dy)+"px";card.style.margin="0";e.preventDefault()});
document.addEventListener("pointermove",function(e){if(!drag)return;card.style.left=(e.clientX-dx)+"px";card.style.top=(e.clientY-dy)+"px";var h=hitTarget(e.clientX,e.clientY);m.className=h===m?"target hot":"target";f.className=h===f?"target hot":"target"});
document.addEventListener("pointerup",function(e){if(!drag)return;var h=hitTarget(e.clientX,e.clientY);card.style.position="";card.style.width="";card.style.left="";card.style.top="";card.style.margin="";card.className="wordCard";drag=null;m.className="target";f.className="target";if(h)attempt(h.getAttribute("data-g"))});
function finish(){$("game").className="game hide";$("result").className="result show";var pct=Math.round(firstCorrect/items.length*100);$("pct").textContent=pct+"%";$("scoreLine").textContent=firstCorrect+" / "+items.length+" — ilk cəhddə düzgün";$("resultMsg").textContent=pct>=87?"Bravissimo! 🌱":pct>=67?"Molto bene! Davam et. 🌱":"Bir daha sına və qaydanı möhkəmləndir. 🌱"}
function reset(){idx=0;firstCorrect=0;failed={};locked=false;drag=null;$("result").className="result";$("game").className="game";render()}
$("reset").addEventListener("click",reset);$("restart").addEventListener("click",reset);render();
})();
</script>
</body></html>
