<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Da Capo | Missione 3 Round</title><style>
:root{--g:#1f5b43;--cream:#f7f1e5;--gold:#c89b45;--ink:#24342c;--red:#bd5656;--blue:#225b9b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(145deg,#fbf8f0,#edf4ee);font-family:Arial,sans-serif;color:var(--ink);padding:14px;min-height:100vh}.app{max-width:780px;margin:auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 16px 50px #1f5b4320}.head{background:var(--g);color:#fff;text-align:center;padding:22px}.brand{font:700 13px Georgia,serif;letter-spacing:1.6px;color:#f2dda8}.head h1{font:700 31px Georgia,serif;margin:6px}.dots{display:flex;justify-content:center;gap:8px;padding:15px}.dot{width:12px;height:12px;border-radius:50%;background:#d8e2dc}.dot.on{background:var(--gold)}main{padding:0 18px 26px}.card{background:var(--cream);border:1px solid #e7dcc5;border-radius:20px;padding:19px}.title{font:700 24px Georgia,serif;color:var(--g);margin:0 0 7px}.sub{font-size:14px;color:#68766f;line-height:1.45}.counter{text-align:right;color:#7a857f;font-size:13px}.sentence{font-size:19px;line-height:1.65;margin:18px 0}.blank{display:inline-block;min-width:95px;border-bottom:2px dashed var(--blue);color:var(--blue);font-weight:700;text-align:center;padding:0 4px}.blank.red{border-color:var(--red);color:var(--red)}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt,.word{border:2px solid #d8e3dc;background:#fff;border-radius:14px;padding:13px;font-size:16px;cursor:pointer;min-height:48px}.opt.ok,.word.ok{border-color:#75a989;background:#ebf6ee}.opt.bad,.word.bad{border-color:#ce7b7b;background:#fff0f0}.build{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.word{min-height:44px;padding:10px 12px}.answer{min-height:65px;border:2px dashed #c8d5cd;border-radius:15px;background:#fff;padding:12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.answer .word{background:#edf5ef}.btn{border:0;border-radius:13px;background:var(--g);color:#fff;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer}.btn.alt{background:#fff;color:var(--g);border:1px solid #cbd9d1}.actions{display:flex;gap:9px;justify-content:center;margin-top:14px;flex-wrap:wrap}.feedback{min-height:24px;margin-top:12px;text-align:center;font-weight:700}.good{color:#287048}.wrong{color:#a94444}.qbox{font:700 22px Georgia,serif;line-height:1.5;margin:18px 0}.qbox input{width:145px;max-width:45%;border:0;border-bottom:2px solid var(--gold);font-size:20px;padding:7px;background:#fff9ed;outline:none;border-radius:6px 6px 0 0}.final{text-align:center;padding:25px}.score{font:700 54px Georgia,serif;color:var(--g)}@media(max-width:520px){main{padding:0 12px 20px}.options{grid-template-columns:1fr 1fr}.sentence{font-size:17px}.qbox{font-size:19px}.qbox input{font-size:18px}}
</style></head><body><div class="app"><header class="head"><div class="brand">DA CAPO · ITALIANO CON METODO</div><h1>🌱 Missione Presente</h1><div>Completa · Ordina · Domanda</div></header><div class="dots"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div><main id="main"></main></div><script>
const main=document.querySelector('#main'),dots=[...document.querySelectorAll('.dot')];let score=0,total=0;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim()}
function round(n){dots.forEach((d,i)=>d.classList.toggle('on',i===n-1))}
const r1=[
{pre:'Ciao! Piacere, io sono Joseph,',post:'ragazzo che studia italiano.',ans:'un',type:'red',opts:['un','una']},
{pre:'Io',post:'l’italiano a Firenze.',ans:'studio',type:'blue',opts:['studio','studi','studia','studiamo']},
{pre:'Studio in',post:'scuola in centro.',ans:'una',type:'red',opts:['un','una']},
{pre:'La scuola è molto bella e c’è anche',post:'bar.',ans:'un',type:'red',opts:['un','una']},
{pre:'In classe noi',post:'sette studenti.',ans:'siamo',type:'blue',opts:['sono','siamo','siete','è']},
{pre:'John e Nate',post:'due fratelli americani.',ans:'sono',type:'blue',opts:['siamo','siete','sono','è']},
{pre:'Abbiamo',post:'professoressa molto simpatica, Marina.',ans:'una',type:'red',opts:['un','una']},
{pre:'Lei',post:'italiana, di Napoli.',ans:'è',type:'blue',opts:['sono','sei','è','siamo']},
{pre:'Noi',post:'tutti in centro.',ans:'abitiamo',type:'blue',opts:['abito','abiti','abita','abitiamo']}
];let i1=0;
function showR1(){round(1);let q=r1[i1];main.innerHTML=`<section class="card"><div class="counter">${i1+1}/9</div><h2 class="title">1. Completa gli spazi</h2><div class="sub">Qırmızı boşluqlarda articolo indeterminativo, mavi boşluqlarda düzgün feil formasını seç.</div><div class="sentence">${q.pre} <span class="blank ${q.type==='red'?'red':''}">?</span> ${q.post}</div><div class="options">${q.opts.map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join('')}</div><div class="feedback" id="fb"></div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{total++;if(b.dataset.v===q.ans){score++;b.classList.add('ok');document.querySelector('.blank').textContent=q.ans;document.querySelector('#fb').innerHTML='<span class="good">✓ Perfetto!</span>';document.querySelectorAll('.opt').forEach(x=>x.disabled=true);setTimeout(()=>{i1++;i1<r1.length?showR1():startR2()},600)}else{b.classList.add('bad');document.querySelector('#fb').innerHTML='<span class="wrong">Bir daha cəhd et.</span>';setTimeout(()=>b.classList.remove('bad'),450)}})}
const orders=[
['le','scuole','aprono','alle','8'],
['Maria','e','Vittoria','vivono','a','Roma,','in','centro'],
['Giacomo','telefona','a','Luisa','ogni','sera'],
['Michela','lavora','in','un','giornale','da','due','anni'],
['Giulio','non','mangia','al','ristorante'],
['Lia','prende','il','treno','ogni','giorno','per','Milano']
];let i2=0,chosen=[];
function startR2(){round(2);i2=0;showR2()}
function sameWords(a,b){let A=a.map(norm).sort(),B=b.map(norm).sort();return A.length===B.length&&A.every((x,i)=>x===B[i])}
function meaningfulOrder(words,idx){let s=norm(words.join(' '));const tests=[
 x=>x.includes('le scuole')&&x.includes('aprono')&&x.includes('alle'),
 x=>x.includes('maria')&&x.includes('vittoria')&&x.includes('vivono')&&x.includes('roma')&&x.includes('centro'),
 x=>x.includes('giacomo')&&x.includes('telefona')&&x.includes('luisa')&&x.includes('ogni sera'),
 x=>x.includes('michela')&&x.includes('lavora')&&x.includes('giornale')&&x.includes('due anni'),
 x=>x.includes('giulio')&&x.includes('non mangia')&&x.includes('ristorante'),
 x=>x.includes('lia')&&x.includes('prende')&&x.includes('treno')&&x.includes('ogni giorno')&&x.includes('milano')
 ];return tests[idx](s)}
function showR2(){chosen=[];let correct=orders[i2],mix=[...correct].sort(()=>Math.random()-.5);main.innerHTML=`<section class="card"><div class="counter">${i2+1}/6</div><h2 class="title">2. Metti in ordine</h2><div class="sub">Sözlərə toxunaraq düzgün cümləni qur.</div><div class="answer" id="answer"></div><div class="build" id="pool"></div><div class="actions"><button class="btn alt" id="clear">↻ Təmizlə</button><button class="btn" id="check">Yoxla</button></div><div class="feedback" id="fb"></div></section>`;let pool=document.querySelector('#pool');mix.forEach((w,k)=>{let b=document.createElement('button');b.className='word';b.textContent=w;b.dataset.k=k;b.onclick=()=>{chosen.push({w,k});b.disabled=true;b.style.opacity=.35;renderAns()};pool.appendChild(b)});document.querySelector('#clear').onclick=showR2;document.querySelector('#check').onclick=()=>{if(chosen.length!==correct.length)return;total++;let words=chosen.map(x=>x.w),s=words.join(' '),c=correct.join(' ');if(sameWords(words,correct)&&meaningfulOrder(words,i2)){score++;document.querySelector('#fb').innerHTML='<span class="good">✓ Düzgün fikir!<br><small>Mümkün variant: '+c+'</small></span>';setTimeout(()=>{i2++;i2<orders.length?showR2():startR3()},750)}else document.querySelector('#fb').innerHTML='<span class="wrong">Söz sırasına yenidən bax.</span>'}}
function renderAns(){document.querySelector('#answer').innerHTML=chosen.map(x=>`<span class="word">${x.w}</span>`).join('')}
const qs=[
{a:'come',tail:'ti chiami?',full:'Ciao, come ti chiami?'},
{a:'dove',tail:'sei?',prefix:'Di',full:'Di dove sei?'},
{a:'quanti',tail:'anni hai?',full:'Quanti anni hai?'},
{a:'dove',tail:'abiti? In centro?',full:'Dove abiti? In centro?'},
{a:'che',tail:'musica ascolti?',full:'Che musica ascolti?'},
{a:'quanto',tail:'tempo studi l’italiano?',prefix:'Da',full:'Da quanto tempo studi l’italiano?'}
];let i3=0;
function startR3(){round(3);i3=0;showR3()}
function showR3(){let q=qs[i3];main.innerHTML=`<section class="card"><div class="counter">${i3+1}/6</div><h2 class="title">3. Completa le domande</h2><div class="sub">Sual sözünü özün yaz və Enter/Done bas.</div><div class="qbox">${q.prefix?q.prefix+' ':''}<input id="ans" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" autocapitalize="none"> ${q.tail}</div><div class="feedback" id="fb"></div></section>`;let a=document.querySelector('#ans');setTimeout(()=>a.focus(),100);a.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkR3(a,q)}}}
function checkR3(a,q){if(!a.value.trim())return;total++;if(norm(a.value)===norm(q.a)){score++;document.querySelector('#fb').innerHTML='<span class="good">✓ '+q.full+'</span>';a.disabled=true;setTimeout(()=>{i3++;i3<qs.length?showR3():finish()},750)}else{document.querySelector('#fb').innerHTML='<span class="wrong">Bir daha cəhd et.</span>';a.select()}}
function finish(){main.innerHTML=`<section class="card final"><div>🌱 Missione completata!</div><div class="score">${Math.round(score/total*100)}%</div><p>Hai completato tutti e tre i round.</p><button class="btn" id="again">↻ Yenidən başla</button></section>`;document.querySelector('#again').onclick=()=>location.reload()}
showR1();
</script></body></html>
