function checkWrite(){let v=$('response').value.trim();if(!v)return alert('Əvvəlcə italyanca cavab yaz.');let a=W[i][1],ok=normalize(v)===normalize(a);if(ok)pts(15);saved.push({q:W[i][0],a:v});$('feedback').innerHTML=(ok?'✓ Perfetto! +15 xal':'💡 Sənin cümlən fərqli ola bilər; nümunə ilə müqayisə et.')+'<p><b>Nümunə:</b> '+esc(a)+'</p>'+btn('🔊 Nümunəni dinlə','say(W[i][1])',true)+'<p class="muted">Avtomatik yoxlama bütün mümkün düzgün cümlələri tanımır.</p>'}

function finish(){$('bar').style.width='100%';$('app').innerHTML=box('<div style="text-align:center;font-size:60px">🏆</div><h2 style="text-align:center">Complimenti! Che bella gita!</h2><h2 style="text-align:center">'+score+' xal</h2><p style="text-align:center">6 mərhələ · 54 tapşırıq · Söz bazası, dinləmə, oxu və yazı</p><p class="muted">Sərbəst yazı üzrə xallar iştirak göstəricisidir; dilin düzgünlüyünü müəllim qiymətləndirir.</p>'+actions(btn('📄 Yazdıqlarımı saxla','download()')+btn('↻ Yenidən başla','reset()',true)))}
function download(){let t='DA CAPO — UNA GITA\nXal: '+score+'\n\n'+saved.map(x=>x.q+'\n'+x.a).join('\n\n'),url=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='Da_Capo_Una_Gita_Cavablar.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function reset(){stage=0;i=0;score=0;awarded.clear();saved=[];render()}render();
</script></body></html>
