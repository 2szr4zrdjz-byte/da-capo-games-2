<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo | Missione DOMANDE</title>
<style>
:root{--g:#0b4f35;--c:#fbf7ec;--gold:#d8b552;--mut:#718078}*{box-sizing:border-box}body{margin:0;padding:10px;background:var(--c);font-family:Arial;color:#17362b}.app{max-width:760px;margin:auto}.brand{text-align:center;color:var(--g)}h1{font:700 31px Georgia;margin:0}.brand small{font-size:10px;letter-spacing:1.6px}.title{text-align:center;font:700 27px Georgia;color:var(--g);margin:15px 0 3px}.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:12px}.card{background:#fffdf8;border:1px solid #dbe5dc;border-radius:23px;padding:17px;box-shadow:0 12px 30px #17362b12}.top{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:900}.badge{background:#edf5ee;padding:7px 10px;border-radius:99px;color:var(--g)}.bar{height:7px;background:#e8eee8;border-radius:9px;overflow:hidden;margin:12px 0 17px}.fill{height:100%;background:linear-gradient(90deg,#27644e,var(--gold));transition:.3s}.rt{text-align:center;font:700 21px Georgia;color:var(--g)}.ins{text-align:center;color:var(--mut);font-size:12px;margin:5px 0 14px}.q{background:#f5f8f3;border:1px solid #dbe8dd;border-radius:18px;padding:18px;text-align:center}.it{font:700 22px Georgia;color:var(--g)}.az{font-size:13px;color:#6e7b74;margin-top:8px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.opt,.chip{border:1px solid #c9d9cd;background:white;border-radius:13px;padding:12px 8px;color:var(--g);font-weight:900;cursor:pointer}.ok{background:#e5f4e9!important;color:#28794e!important}.bad{background:#fae9e6!important;color:#aa4e46!important}.fb{text-align:center;min-height:34px;margin-top:10px;font-size:12px;font-weight:800}.rule{background:#f8f2df;border:1px solid #ead9a3;border-radius:17px;padding:12px;margin-bottom:13px;text-align:center}.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.forms div{background:#fffaf0;border-radius:9px;padding:7px;font-size:10px}.forms b{display:block;font-size:14px;color:var(--g)}.build{min-height:58px;border:2px dashed #b8cdbc;border-radius:14px;margin-top:12px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.bank{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:12px}.placed{background:#eaf3eb;border:1px solid #b9d0be;border-radius:9px;padding:9px;font-weight:900;cursor:pointer}.hide{display:none}.audio,.restart{border:0;background:var(--g);color:white;border-radius:11px;padding:10px 13px;font-weight:900}.res{text-align:center}.pct{font:700 50px Georgia;color:var(--g);margin:8px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.mini{background:#f1f6f1;border-radius:12px;padding:10px;font-size:11px}.mini b{display:block;font-size:18px;color:var(--g)}
@media(max-width:520px){.forms{grid-template-columns:1fr 1fr}.scores{grid-template-columns:1fr}.card{padding:13px}}
</style></head><body><main class="app"><div class="brand"><div style="font-size:33px">🌳</div><h1>Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></div><div class="title">Missione DOMANDE ❓🇮🇹</div><div class="sub">Tanı → QUANTO-nu uyğunlaşdır → sualı özün qur.</div><section class="card"><div class="top"><span id="badge" class="badge"></span><span id="score">0 / 30</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="game"></div></section></main>
<script>
const sh=a=>[...a].sort(()=>Math.random()-.5);
const A=[
["___ è questa ragazza?","Bu qız kimdir?","CHI",["CHI","DOVE","COME","QUANDO"]],["___ sei? — Sono di Baku.","Haralısan? — Bakıdanam.","DI DOVE",["DI DOVE","DOVE","CHI","COME"]],["___ è la lezione? — Alle otto.","Dərs nə vaxtdır? — Saat səkkizdə.","QUANDO",["QUANDO","DOVE","COME","CHI"]],["___ stai?","Necəsən?","COME",["COME","CHI","QUANDO","DOVE"]],["___ abiti?","Harada yaşayırsan?","DOVE",["DOVE","DI DOVE","COME","COSA"]],["___ fai oggi?","Bu gün nə edirsən?","COSA",["COSA","CHI","DOVE","QUANDO"]],["___ è lui?","O kimdir?","CHI",["CHI","COME","DOVE","CHE"]],["___ studi italiano?","İtalyancanı nə vaxt öyrənirsən?","QUANDO",["QUANDO","COME","DOVE","CHI"]],["___ mangi?","Nə yeyirsən?","COSA",["COSA","DOVE","CHI","COME"]],["___ ti chiami?","Adın nədir?","COME",["COME","CHI","CHE","QUANDO"]]];
const B=[
["___ tempo hai?","Nə qədər vaxtın var?","QUANTO","tempo — kişi cinsi, tək"],["___ acqua bevi?","Nə qədər su içirsən?","QUANTA","acqua — qadın cinsi, tək"],["___ studenti ci sono?","Neçə tələbə var?","QUANTI","studenti — kişi cinsi, cəm"],["___ persone ci sono?","Neçə nəfər var?","QUANTE","persone — qadın cinsi, cəm"],["___ anni hai?","Neçə yaşın var?","QUANTI","anni — kişi cinsi, cəm"],["___ pasta mangi?","Nə qədər makaron yeyirsən?","QUANTA","pasta — qadın cinsi, tək"],["___ libri hai?","Neçə kitabın var?","QUANTI","libri — kişi cinsi, cəm"],["___ case ci sono?","Neçə ev var?","QUANTE","case — qadın cinsi, cəm"],["___ caffè bevi?","Nə qədər qəhvə içirsən?","QUANTO","caffè — kişi cinsi, tək"],["___ ore studi?","Neçə saat oxuyursan?","QUANTE","ore — qadın cinsi, cəm"]];
const C=[
["Haralısan?",["Di","dove","sei?"],"Di dove sei?"],["Neçə yaşın var?",["Quanti","anni","hai?"],"Quanti anni hai?"],["Necəsən?",["Come","stai?"],"Come stai?"],["Dərs nə vaxtdır?",["Quando","è","la","lezione?"],"Quando è la lezione?"],["Harada yaşayırsan?",["Dove","abiti?"],"Dove abiti?"],["O kimdir?",["Chi","è","lui?"],"Chi è lui?"],["Nə yeyirsən?",["Cosa","mangi?"],"Cosa mangi?"],["Neçə tələbə var?",["Quanti","studenti","ci","sono?"],"Quanti studenti ci sono?"],["Neçə nəfər var?",["Quante","persone","ci","sono?"],"Quante persone ci sono?"],["Adın nədir?",["Come","ti","chiami?"],"Come ti chiami?"]];
let D=[sh(A),sh(B),sh(C)],r=0,n=0,first=true,total=0,rs=[0,0,0],placed=[],bank=[];
const G=document.getElementById("game"),badge=document.getElementById("badge"),score=document.getElementById("score"),fill=document.getElementById("fill");
function say(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.78;speechSynthesis.speak(u)}
function upd(){score.textContent=total+" / 30";fill.style.width=((r*10+n)/30*100)+"%"}
function nxt(){setTimeout(()=>{n++;first=true;placed=[];if(n==10){r++;n=0;if(r==3)return done()}render()},850)}
function pick(b,v,a,why=""){if(v==a){b.classList.add("ok");document.querySelectorAll(".opt").forEach(x=>x.disabled=true);if(first){total++;rs[r]++}let f=document.getElementById("fb");f.textContent="✅ Düzdür! "+why;f.style.color="#28794e";say(r==1?v+" "+D[1][n][0].replace("___","").trim():D[r][n][0].replace("___",v));nxt()}else{first=false;b.classList.add("bad");document.getElementById("fb").textContent="🔄 Bir də düşün."}}
function render(){upd();
if(r==0){badge.textContent="ROUND 1 · SCEGLI";let x=D[0][n];G.innerHTML=`<div class="rt">Scegli la domanda ❓</div><div class="ins">Uyğun sual sözünü seç.</div><div class="q"><div class="it">${x[0]}</div><div class="az">🇦🇿 ${x[1]}</div></div><div class="opts">${sh(x[3]).map(v=>`<button class="opt">${v}</button>`).join("")}</div><div id="fb" class="fb"></div>`;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b,b.textContent,x[2]))}
else if(r==1){badge.textContent="ROUND 2 · QUANTO";let x=D[1][n];G.innerHTML=`<div class="rule"><b>⚠️ QUANTO cinsə və kəmiyyətə görə dəyişir!</b><div class="forms"><div><b>QUANTO</b>♂ tək</div><div><b>QUANTA</b>♀ tək</div><div><b>QUANTI</b>♂ cəm</div><div><b>QUANTE</b>♀ cəm</div></div></div><div class="rt">La famiglia di QUANTO 🧩</div><div class="ins">İsmin cinsinə və kəmiyyətinə bax.</div><div class="q"><div class="it">${x[0]}</div><div class="az">🇦🇿 ${x[1]}</div></div><div class="opts">${sh(["QUANTO","QUANTA","QUANTI","QUANTE"]).map(v=>`<button class="opt">${v}</button>`).join("")}</div><div id="fb" class="fb"></div>`;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b,b.textContent,x[2],"→ "+x[3]+"."));
}else{badge.textContent="ROUND 3 · COSTRUISCI";let x=D[2][n];bank=sh(x[1].map((w,i)=>({w,i})));G.innerHTML=`<div class="rt">Costruisci la domanda 💬</div><div class="ins">Sözlərə düzgün ardıcıllıqla toxun.</div><div class="q"><div class="az" style="font-size:15px">🇦🇿 ${x[0]}</div><div id="build" class="build"></div></div><div class="bank">${bank.map((z,j)=>`<button class="chip" data-j="${j}">${z.w}</button>`).join("")}</div><div id="fb" class="fb"></div>`;document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{b.classList.add("hide");placed.push({j:+b.dataset.j,w:b.textContent});draw(x)})}}
function draw(x){let box=document.getElementById("build");box.innerHTML=placed.map((z,k)=>`<span class="placed" data-k="${k}">${z.w}</span>`).join("");document.querySelectorAll(".placed").forEach(p=>p.onclick=()=>{let z=placed.splice(+p.dataset.k,1)[0];document.querySelector(`.chip[data-j="${z.j}"]`).classList.remove("hide");draw(x)});if(placed.length==x[1].length){let made=placed.map(z=>z.w).join(" ");if(made==x[2]){if(first){total++;rs[2]++}document.getElementById("fb").innerHTML=`✅ Düzdür! <button class="audio" id="aud">🔊 Dinlə</button>`;say(x[2]);document.getElementById("aud").onclick=()=>say(x[2]);document.querySelectorAll(".placed").forEach(p=>p.style.pointerEvents="none");nxt()}else{first=false;document.getElementById("fb").textContent="🔄 Ardıcıllıq düzgün deyil. Sözə toxunaraq geri qaytar."}}}
function done(){fill.style.width="100%";badge.textContent="MISSIONE COMPLETATA";let p=Math.round(total/30*100);G.innerHTML=`<div class="res"><div style="font-size:42px">🌱🏆</div><div class="rt">Missione completata!</div><div class="pct">${p}%</div><div>${total} / 30 — ilk cəhddə düzgün</div><div class="scores"><div class="mini">Scegli<b>${rs[0]}/10</b></div><div class="mini">QUANTO<b>${rs[1]}/10</b></div><div class="mini">Costruisci<b>${rs[2]}/10</b></div></div><button id="again" class="restart">↻ Yenidən oyna</button></div>`;document.getElementById("again").onclick=()=>{D=[sh(A),sh(B),sh(C)];r=n=total=0;rs=[0,0,0];first=true;render()}}
render();
</script></body></html>
