<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo | Espressioni con AVERE</title>
<style>:root{--g:#0b4f35;--c:#fbf7ec;--gold:#d8b552}*{box-sizing:border-box}body{margin:0;padding:10px;background:var(--c);font-family:Arial;color:#17362b}.app{max-width:650px;margin:auto}.brand{text-align:center;color:var(--g)}h1{font:700 32px Georgia;margin:0}.brand small{font-size:10px;letter-spacing:1.5px}h2{text-align:center;font:700 27px Georgia;color:var(--g);margin:14px 0 3px}.sub{text-align:center;color:#718078;font-size:13px;margin-bottom:12px}.shell{background:#fffdf8;border:1px solid #dce5dc;border-radius:24px;padding:16px;box-shadow:0 12px 30px #17362b12}.top{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.pill{background:#edf5ee;padding:7px 10px;border-radius:99px;color:var(--g)}.bar{height:7px;background:#e8eee8;border-radius:9px;overflow:hidden;margin:12px 0 16px}.fill{height:100%;background:linear-gradient(90deg,#28654e,var(--gold))}.scene{perspective:1200px;min-height:385px}.flash{position:relative;min-height:385px;transform-style:preserve-3d;transition:.6s;cursor:pointer}.flash.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid #d9e4da;border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.front{background:linear-gradient(145deg,#f5faf4,#edf5ee)}.back{background:linear-gradient(145deg,#fffdf7,#f8f2df);transform:rotateY(180deg)}.emoji{font-size:68px}.expr{font:700 30px Georgia;color:var(--g);margin-top:12px}.mean{font:700 25px Georgia;color:var(--g);margin-bottom:20px}.ex{font:700 20px Georgia;color:#6f5b1c}.tr{font-size:14px;color:#58675f;margin-top:8px}.hint{font-size:12px;color:#718078;margin-top:13px}.audio{border:0;background:var(--g);color:white;border-radius:12px;padding:10px 14px;font-weight:900;margin-top:18px;cursor:pointer}.secondary{background:white;color:var(--g);border:1px solid #bfd1c3}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.nav{border:1px solid #c7d8cb;background:white;color:var(--g);border-radius:13px;padding:12px;font-weight:900}.nav:disabled{opacity:.35}.note{margin-top:13px;background:#f8f2df;border:1px solid #ead9a3;border-radius:15px;padding:10px;text-align:center;font-size:11px;color:#715d25}@media(max-width:520px){.scene,.flash{min-height:365px}.expr{font-size:27px}}</style></head>
<body><main class="app"><header class="brand"><div style="font-size:34px">🌳</div><h1>Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></header><h2>Espressioni con AVERE 🇮🇹</h2><div class="sub">Kartı çevir, mənanı öyrən və nümunəni dinlə.</div><section class="shell"><div class="top"><span class="pill">FLASHCARDS · AVERE</span><span id="count"></span></div><div class="bar"><div id="fill" class="fill"></div></div><div class="scene"><div id="flash" class="flash"><div class="face front"><div id="emoji" class="emoji"></div><div id="expr" class="expr"></div><button id="ae" class="audio">🔊 İfadəni dinlə</button><div class="hint">Kartı çevir →</div></div><div class="face back"><div id="mean" class="mean"></div><div id="ex" class="ex"></div><div id="tr" class="tr"></div><button id="ax" class="audio">🔊 Nümunəni dinlə</button><button id="back" class="audio secondary">↩ Ön tərəf</button></div></div></div><div class="controls"><button id="prev" class="nav">← Əvvəlki</button><button id="next" class="nav">Növbəti →</button></div><div class="note">💡 İtalyancada bu hallar <b>AVERE + isim</b> ilə qurulur: <b>Ho fame · Ho sete · Ho paura...</b></div></section></main>
<script>
const C=[["🍕","avere fame","ac olmaq","Ho fame.","Mən acam."],["💧","avere sete","susamaq","Hai sete?","Susamısan?"],["😴","avere sonno","yuxusu gəlmək","Ho sonno.","Yuxum gəlir."],["😨","avere paura","qorxmaq","Lei ha paura.","O qorxur."],["🥶","avere freddo","üşümək","Abbiamo freddo.","Biz üşüyürük."],["🥵","avere caldo","isti olmaq / istisi gəlmək","Avete caldo?","Sizə istidir?"],["🏃","avere fretta","tələsmək","Ho fretta.","Mən tələsirəm."],["✅","avere ragione","haqlı olmaq","Hai ragione.","Sən haqlısan."],["❌","avere torto","haqsız olmaq","Lui ha torto.","O haqsızdır."],["✨","avere voglia di...","... etmək istəmək / həvəsi olmaq","Ho voglia di viaggiare.","Səyahət etmək istəyirəm."]];let i=0,$=x=>document.getElementById(x),f=$("flash");
function say(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.8;speechSynthesis.speak(u)}
function draw(){let c=C[i];f.classList.remove("flip");$("emoji").textContent=c[0];$("expr").textContent=c[1];$("mean").textContent=c[2];$("ex").textContent=c[3];$("tr").textContent="🇦🇿 "+c[4];$("count").textContent=(i+1)+" / 10";$("fill").style.width=(i+1)*10+"%";$("prev").disabled=i===0;$("next").textContent=i===9?"Yenidən başla ↻":"Növbəti →"}
f.onclick=e=>{if(e.target.tagName!=="BUTTON")f.classList.toggle("flip")};$("ae").onclick=e=>{e.stopPropagation();say(C[i][1])};$("ax").onclick=e=>{e.stopPropagation();say(C[i][3])};$("back").onclick=e=>{e.stopPropagation();f.classList.remove("flip")};$("prev").onclick=()=>{if(i){i--;draw()}};$("next").onclick=()=>{i=i===9?0:i+1;draw()};draw();
</script></body></html>
