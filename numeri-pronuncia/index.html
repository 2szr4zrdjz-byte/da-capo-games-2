<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Da Capo | Missione Suoni & Numeri</title>
<style>
:root{--g:#123f32;--g2:#2f6d54;--c:#fbf6e8;--gold:#d1ae4b;--muted:#718078}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--c);font-family:Arial,sans-serif;color:#263b32}.app{max-width:850px;margin:auto}.brand{text-align:center;color:var(--g)}.brand h1,h2,.q,.score{font-family:Georgia,serif}.brand h1{margin:0}.panel,.card{background:#fff;border:1px solid #dce5dd;border-radius:20px;padding:16px;box-shadow:0 10px 28px #0000000d}.title{text-align:center;font:700 27px Georgia;color:var(--g)}.sub,.az,.hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.45}.bar{height:8px;background:#e6ece7;border-radius:8px;overflow:hidden;margin:13px 0}.fill{height:100%;background:linear-gradient(90deg,var(--g2),var(--gold));width:0}.route{display:flex;justify-content:center;gap:7px;margin:10px 0 14px}.dot{width:40px;height:40px;border:2px solid #d5ded7;border-radius:50%;display:grid;place-items:center}.dot.on{background:#fff3ce;border-color:var(--gold)}.dot.done{background:var(--g);color:#fff}.head{text-align:center;background:#f1f6ef;border-radius:15px;padding:9px;margin-bottom:10px}.head h2{margin:3px;color:var(--g)}.q{text-align:center;font-weight:700;font-size:18px;color:var(--g)}.big{text-align:center;font:700 44px Georgia;color:var(--g);margin:12px}.visual{text-align:center;font-size:56px}.choices,.pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:13px 0}.btn,.token{border:1px solid #c7d4c9;background:#fff;color:var(--g);border-radius:12px;padding:11px 14px;font-weight:800;font-size:16px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}.btn:active,.token:active{transform:scale(.98)}.input{width:100%;font-size:19px;padding:14px;border:2px solid #c6d2c8;border-radius:12px;outline:none;color:var(--g)}.input:focus{border-color:var(--gold)}.input.bad{border-color:#c45a50;background:#fff7f5}.input.ok{border-color:#3d805e;background:#f4fbf6}.fb{display:none;margin-top:10px;padding:10px;border-radius:11px;font-size:13px}.fb.show{display:block;background:#eef5ef}.fb.bad{background:#fff0ed;color:#81372f}.start{width:100%;border:0;background:var(--g);color:#fff;border-radius:12px;padding:13px;font-weight:900;font-size:15px;margin-top:13px}.sound{width:64px;height:64px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:28px}.soundwrap{text-align:center;margin:12px}.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.bin{min-height:115px;border:2px dashed #b9c9bd;border-radius:14px;padding:9px;text-align:center}.bin b{font:700 21px Georgia;color:var(--g)}.inside{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:7px}.bin .token{font-size:13px;padding:8px}.note{background:#fff8df;border:1px solid #ead796;border-radius:12px;padding:9px;text-align:center;font-size:12px}.score{text-align:center;font-size:54px;font-weight:700;color:var(--g)}@media(max-width:560px){.title{font-size:23px}.big{font-size:38px}}
</style></head><body><main class="app"><div class="brand">🌳<h1>Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></div><section class="panel"><div class="title">Missione: Suoni & Numeri 🇮🇹</div><div class="sub">I numeri 1–10 · È / É · GN · GL / GLI · Z · ZZ</div><div class="bar"><div id="prog" class="fill"></div></div><div id="route" class="route"></div><div id="stage"></div></section></main><script>
const NUM=[["1","uno","bir","🍎"],["2","due","iki","🍕"],["3","tre","üç","🐱"],["4","quattro","dörd","📚"],["5","cinque","beş","🍋"],["6","sei","altı","🧁"],["7","sette","yeddi","🌻"],["8","otto","səkkiz","🍊"],["9","nove","doqquz","🍨"],["10","dieci","on","🎈"]];
const R=[
{name:"Conta!",ico:"🔢",type:"num",data:[NUM[6],NUM[2],NUM[9],NUM[3],NUM[7],NUM[1],NUM[8],NUM[4]]},
{name:"Calcola in italiano!",ico:"➕",type:"math",data:[["tre + cinque","otto"],["dieci − quattro","sei"],["due + cinque","sette"],["nove − sei","tre"],["quattro + cinque","nove"],["otto − sei","due"],["uno + cinque","sei"],["dieci − cinque","cinque"]]},
{name:"È o É?",ico:"👂",type:"accent",data:[["caffè","è","qəhvə","caffè"],["perché","é","niyə / çünki","perché"],["è","è","-dır / -dir","è"],["vènti","è","küləklər (venti — açıq e)","vènti"],["vénti","é","iyirmi (venti — qapalı e)","vénti"],["pèsca","è","şaftalı (pesca — açıq e)","pèsca"],["pésca","é","balıq ovu / balıqçılıq (pesca — qapalı e)","pésca"]]},
{name:"Officina dei suoni",ico:"🔊",type:"sounds",data:[[["insegnante","müəllim","gn"],["figlio","oğul","gli"],["zero","sıfır","z"],["pizza","pizza","zz"]],[["spagnolo","ispan","gn"],["famiglia","ailə","gli"],["zaino","bel çantası","z"],["mezzo","yarım / vasitə","zz"]],[["insegnante","müəllim","gn"],["glossario","lüğətçə","gl"],["azione","hərəkət / fəaliyyət","z"],["pizza","pizza","zz"]],[["spagnolo","ispan","gn"],["inglese","ingilis dili / ingilis","gl"],["canzone","mahnı","z"],["mezzo","yarım / vasitə","zz"]]]},
{name:"Boss Finale",ico:"👑",type:"boss",data:[["dict","insegnante","müəllim"],["dict","spagnolo","ispan"],["dict","figlio","oğul"],["dict","famiglia","ailə"],["dict","glossario","lüğətçə"],["dict","inglese","ingilis / ingilis dili"],["dict","zero","sıfır"],["dict","zaino","bel çantası"],["dict","azione","hərəkət / fəaliyyət"],["dict","canzone","mahnı"],["dict","pizza","pizza"],["dict","mezzo","yarım / vasitə"],["dict","caffè","qəhvə"],["dict","perché","niyə / çünki"],["dict","venti","iyirmi"],["dict","pesca","şaftalı / balıq ovu"],["sentence","Lui ha una macchina nuova.","Onun yeni maşını var."],["sentence","Noi beviamo caffè.","Biz qəhvə içirik."],["sentence","Gli studenti portano zaini.","Tələbələr bel çantaları daşıyırlar."],["sentence","La famiglia mangia la pizza.","Ailə pizza yeyir."],["sentence","L'insegnante parla inglese.","Müəllim ingiliscə danışır."]]}];
let ri=0,qi=0,score=0,first=true,busy=false;const total=R.reduce((a,r)=>a+r.data.length,0),stage=document.getElementById("stage"),route=document.getElementById("route"),prog=document.getElementById("prog");
function voice(txt,cb){if(!("speechSynthesis" in window)){if(cb)cb();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang="it-IT";u.rate=.76;let vs=speechSynthesis.getVoices(),it=vs.find(v=>/^it(-|_)/i.test(v.lang))||vs.find(v=>/ital/i.test(v.name));if(it)u.voice=it;if(cb){let used=false,go=()=>{if(!used){used=true;cb()}};u.onend=go;u.onerror=go;setTimeout(go,6500)}speechSynthesis.speak(u)}
function nav(){route.innerHTML=R.map((r,i)=>`<div class="dot ${i<ri?"done":i===ri?"on":""}">${i<ri?"✓":r.ico}</div>`).join("");let n=R.slice(0,ri).reduce((a,r)=>a+r.data.length,0)+qi;prog.style.width=(n/total*100)+"%"}
function head(){let r=R[ri];return `<div class="head"><div style="font-size:34px">${r.ico}</div><h2>${r.name}</h2></div>`}
function intro(){nav();let tx=["1–10 arası sayları tanı.","Nəticəni italyanca sözlə yaz.","Açıq È və qapalı É səsini ayırd et.","Sözləri GN · GL/GLI · Z · ZZ qruplarına ayır.","Diktə: əvvəl sözləri, sonra 5 bütöv cümləni dinlə və eşitdiyin kimi yaz."][ri];stage.innerHTML=head()+`<div class="card"><div class="q">Raund ${ri+1}/5</div><div class="az">${tx}</div><button id="go" class="start">Başla →</button></div>`;document.getElementById("go").onclick=render}
function shell(c){stage.innerHTML=head()+`<div class="card">${c}<div id="fb" class="fb"></div></div>`}
function fail(msg="Bir daha düşün və düzəlt."){first=false;let f=document.getElementById("fb");f.className="fb show bad";f.innerHTML="⚠️ <b>Səhvdir.</b> "+msg}
function pass(msg,say){if(busy)return;busy=true;if(first)score++;let f=document.getElementById("fb");f.className="fb show";f.innerHTML="✅ <b>Corretto!</b> "+msg;voice(say,next)}
function next(){setTimeout(()=>{busy=false;if(++qi>=R[ri].data.length){ri++;qi=0;ri<R.length?intro():result()}else render()},250)}
const norm=s=>s.toLowerCase().trim().replace(/[.!?,;:"“”«»]/g,"").replace(/\s+/g," ");
function inputCheck(expected,msg,say){let form=document.getElementById("form"),inp=document.getElementById("ans");form.onsubmit=e=>{e.preventDefault();if(busy||!inp.value.trim())return;if(norm(inp.value)===norm(expected)){inp.disabled=true;inp.classList.add("ok");pass(msg,say||expected)}else{inp.classList.add("bad");fail("Yenidən yaz.");inp.focus();inp.select()}};setTimeout(()=>inp.focus({preventScroll:true}),180)}
function render(){nav();first=true;busy=false;let r=R[ri],d=r.data[qi];
if(r.type==="num"){let opts=[d[1],...NUM.filter(x=>x[1]!==d[1]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1])].sort(()=>Math.random()-.5);shell(`<div class="q">Bu rəqəm italyanca necədir?</div><div class="visual">${d[3]}</div><div class="big">${d[0]}</div><div class="az">🇦🇿 ${d[2]}</div><div class="choices">${opts.map(x=>`<button class="btn" data-v="${x}">${x}</button>`).join("")}</div>`);document.querySelectorAll(".btn").forEach(b=>b.onclick=()=>b.dataset.v===d[1]?pass(`<b>${d[0]} = ${d[1]}</b>`,d[1]):fail())}
if(r.type==="math"){shell(`<div class="q">Nəticəni italyanca yaz.</div><div class="big">${d[0]} = ?</div><div class="az">🇦🇿 Hesabla və cavabı italyanca sözlə yaz.</div><form id="form"><input id="ans" class="input" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Cavabı italyanca yaz..."></form><div class="hint">Enter / Done cavabı yoxlayır.</div>`);inputCheck(d[1],`Düzgün cavab: <b>${d[1]}</b>.`,d[1])}
if(r.type==="accent"){shell(`<div class="q">Sözü dinlə. Hansı səsdir?</div><div class="soundwrap"><button id="snd" class="sound">🔊</button></div><div class="az">🇦🇿 ${d[2]}</div><div class="choices"><button class="btn" data-v="è">È — açıq</button><button class="btn" data-v="é">É — qapalı</button></div><div class="note"><b>è</b> — açıq · <b>é</b> — qapalı</div>`);document.getElementById("snd").onclick=()=>voice(d[3]||d[0]);setTimeout(()=>voice(d[3]||d[0]),250);document.querySelectorAll(".btn").forEach(b=>b.onclick=()=>b.dataset.v===d[1]?pass(`<b>${d[0]}</b> → ${d[1]==="è"?"È — açıq":"É — qapalı"}`,d[3]||d[0]):fail("Səsi yenidən dinlə."))}
if(r.type==="sounds"){let items=[...d].sort(()=>Math.random()-.5);shell(`<div class="q">Sözləri düzgün səs qutusuna yerləşdir.</div><div class="pool"><div class="inside">${items.map(a=>`<button class="token" data-w="${a[0]}">🔊 ${a[0]}<small style="display:block">🇦🇿 ${a[1]}</small></button>`).join("")}</div></div><div class="bins">${["gn","gl/gli","z","zz"].map(g=>`<div class="bin" data-g="${g}"><b>${g.toUpperCase()}</b><div class="inside"></div></div>`).join("")}</div><div class="hint">Sözü seç → qutuya toxun. Düzgündürsə yalnız həmin söz səslənir.</div>`);let selected=null,state={};document.querySelectorAll(".token").forEach(x=>x.onclick=e=>{e.stopPropagation();selected=x;document.querySelectorAll(".token").forEach(y=>y.style.outline="");x.style.outline="3px solid var(--gold)"});document.querySelectorAll(".bin").forEach(box=>box.onclick=()=>{if(!selected||busy)return;let w=selected.dataset.w,a=d.find(z=>z[0]===w),g=(a[2]==="gl"||a[2]==="gli")?"gl/gli":a[2];if(box.dataset.g===g){box.querySelector(".inside").appendChild(selected);selected.style.outline="";selected.style.background="#eaf6ed";state[w]=1;voice(w);selected=null;let f=document.getElementById("fb");f.className="fb";if(d.every(a=>state[a[0]])){if(first)score++;busy=true;f.className="fb show";f.innerHTML="✅ <b>Corretto!</b> Bütün sözlər düzgün qruplaşdırıldı.";setTimeout(next,950)}}else{first=false;selected.style.background="#fff0ed";fail("Bu söz həmin səs qrupuna aid deyil.")}})}
if(r.type==="boss"){let kind=d[0],spoken=d[1],meaning=d[2];if(kind==="dict"){shell(`<div class="q">Sözü dinlə və eşitdiyini tam yaz.</div><div class="soundwrap"><button id="snd" class="sound">🔊</button></div><div class="az">🇦🇿 ${meaning}</div><form id="form"><input id="ans" class="input" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Eşitdiyin italyanca sözü yaz..."></form><div class="hint">Səs qrupu yoxdur — sözün özünü düzgün yaz.</div>`);document.getElementById("snd").onclick=()=>voice(spoken);setTimeout(()=>voice(spoken),250);inputCheck(spoken,`Düzgün yazılış: <b>${spoken}</b>.`,spoken)}else{shell(`<div class="q">Bütöv cümləni dinlə və eşitdiyini yaz.</div><div class="soundwrap"><button id="snd" class="sound">🔊</button></div><div class="az">🇦🇿 ${meaning}</div><form id="form"><input id="ans" class="input" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Bütöv italyanca cümləni yaz..."></form><div class="hint">Cümləni sona qədər dinlə. Durğu işarəsi məcburi deyil.</div>`);document.getElementById("snd").onclick=()=>voice(spoken);setTimeout(()=>voice(spoken),250);inputCheck(spoken,`Düzgün cümlə: <b>${spoken}</b>.`,spoken)}}}
function result(){nav();prog.style.width="100%";let pct=Math.round(score/total*100);stage.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:58px">🏆🇮🇹</div><h2>Missione completata!</h2><div class="score">${pct}%</div><div class="az">${score}/${total} tapşırıq ilk cəhddə düzgün.</div><p>Hər səhv ilk cəhd yekun faizini azaldır.</p><button class="start" onclick="location.reload()">↻ Yenidən oyna</button></div>`}
intro();
</script></body></html>
