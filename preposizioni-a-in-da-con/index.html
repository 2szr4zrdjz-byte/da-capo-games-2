<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo | A · IN · DA · CON</title><style>:root{--green:#174b3a;--gold:#d6b349;--cream:#fbf9ef}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:16px/1.55 system-ui,-apple-system,sans-serif;color:#203d32}.shell{max-width:760px;margin:auto;padding:18px}header{background:var(--green);color:white;padding:28px;border-radius:23px}h1,h2{font-family:Georgia,serif;margin:4px 0 12px}h1{font-size:clamp(27px,5vw,43px)}.muted{color:#62776b}.small{font-size:13px}.card{background:white;border:1px solid #e7e6d8;border-radius:20px;padding:23px;margin-top:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{flex:1}button{font:inherit;cursor:pointer;border:1px solid #bdcebf;border-radius:12px;background:white;color:var(--green);padding:11px 14px;font-weight:700}button.primary,.tabs .active{background:var(--green);color:white}button:disabled{opacity:.45;cursor:default}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choices button{font-size:22px;padding:20px}.choices button.selected{outline:3px solid var(--gold);background:#f8f1d6}.bar{background:#e7ece5;height:9px;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:var(--gold);transition:width .2s}.question{font-size:24px;font-weight:750;margin:24px 0}.feedback{border-radius:12px;background:#eef6ed;padding:14px;margin-top:14px}.feedback.wrong{background:#fff0eb}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}input{width:100%;padding:15px;font-size:22px;border-radius:12px;border:2px solid #b9cbbd}table{border-collapse:collapse;width:100%}td{padding:10px;border-bottom:1px solid #e5e8dd}td:first-child{font-weight:800;color:var(--green);font-size:22px;width:65px}.note{background:#f2f6ef;padding:14px;border-radius:13px;margin-top:14px}footer{font-size:12px;color:#7a897c;text-align:center;margin:24px}@media(max-width:520px){.shell{padding:10px}.card{padding:16px}.choices button{padding:15px}.tabs button{font-size:13px;padding:10px 5px}}</style></head><body><main class="shell"><header><div>🌱 DA CAPO · ITALIANO A1</div><h1>A · IN · DA · CON</h1><div>Le preposizioni — yalnız keçdiyimiz qaydalar</div></header><div class="tabs" id="tabs"></div><section class="card" id="app"></section><footer>Da Capo · Hər gün 20 dəqiqə italyanca 🌱</footer></main><script>
const items=[
['Vado ___ Roma.','a','Şəhər adı: Roma → a.','Romaya gedirəm.'],['Abito ___ Milano.','a','Şəhərdə olmaq: a Milano.','Milanda yaşayıram.'],['Siamo ___ Napoli.','a','Şəhər adı: Napoli → a.','Napolidəyik.'],['Vado ___ studiare.','a','Feildən sonra məqsəd: a + məsdər.','Oxumağa gedirəm.'],['Andiamo ___ mangiare.','a','Məqsəd: a mangiare.','Yemək yeməyə gedirik.'],['Vieni ___ ballare?','a','Məqsəd: a ballare.','Rəqs etməyə gəlirsən?'],
['Vado ___ Italia.','in','Ölkə adı: in Italia.','İtaliyaya gedirəm.'],['Vivo ___ Francia.','in','Ölkədə olmaq: in Francia.','Fransada yaşayıram.'],['Siamo ___ Toscana.','in','Region adı: in Toscana.','Toskanadayıq.'],['Andiamo ___ Sicilia.','in','Regiona getmək: in Sicilia.','Siciliyaya gedirik.'],['Vado ___ treno.','in','Nəqliyyat: in treno.','Qatarla gedirəm.'],['Vieni ___ macchina?','in','Nəqliyyat: in macchina.','Maşınla gəlirsən?'],['Andiamo ___ autobus.','in','Nəqliyyat: in autobus.','Avtobusla gedirik.'],['Sono ___ autobus.','in','Nəqliyyatda olmaq: in autobus.','Avtobusdayam.'],
['Torno ___ scuola.','da','Haradan? Məktəbdən: da scuola.','Məktəbdən qayıdıram.'],['Vengo ___ Roma.','da','Haradan? Romadan: da Roma.','Romadan gəlirəm.'],['Vengo ___ Milano.','da','Haradan? Milandan: da Milano.','Milandan gəlirəm.'],['Vado ___ Marco.','da','Kiminsə yanına / -gilə: da Marco.','Markogilə gedirəm.'],['Sono ___ Giulia.','da','Kiminsə yanında / -gildə: da Giulia.','Culiyagildəyəm.'],['Andiamo ___ Luca.','da','Lukagilə: da Luca.','Lukagilə gedirik.'],['Vengo ___ te.','da','Sənin yanından: da te.','Sənin yanından gəlirəm.'],['Vado ___ te.','da','Sənin yanına: da te.','Sənə / sizə gəlirəm.'],
['Vado ___ Maria.','con','Kimlə? Mariya ilə: con Maria.','Mariya ilə gedirəm.'],['Studio ___ Anna.','con','Kimlə? Anna ilə: con Anna.','Anna ilə dərs oxuyuram.'],['Vieni ___ me?','con','Kimlə? Mənimlə: con me.','Mənimlə gəlirsən?'],['Andiamo ___ voi.','con','Kimlə? Sizinlə: con voi.','Sizinlə gedirik.'],['Sono ___ i miei amici.','con','Kimlə? Dostlarımla: con i miei amici.','Dostlarımlayam.'],['Parlo ___ Marco.','con','Kimlə? Marko ilə: con Marco.','Marko ilə danışıram.'],
['Vado ___ Venezia ___ treno.','a|in','Şəhər: a Venezia; nəqliyyat: in treno.','Venesiyaya qatarla gedirəm.'],['Vengo ___ Firenze ___ mia sorella.','da|con','Haradan: da Firenze; kimlə: con mia sorella.','Florensiyadan bacımla gəlirəm.'],['Andiamo ___ Paolo ___ studiare.','da|a','Paologilə: da Paolo; məqsəd: a studiare.','Paologilə dərs oxumağa gedirik.'],['Sono ___ Sardegna ___ Luca.','in|con','Region: in Sardegna; kimlə: con Luca.','Sardiniyada Luka ilə birlikdəyəm.']
];
const situations=[
['Sən Romaya gedirsən.','Vado ___ Roma.','a','Şəhərə yönəlmə: a Roma.'],['Sən Romadasan.','Sono ___ Roma.','a','Şəhərdə olmaq: a Roma.'],['Sən İtaliyaya gedirsən.','Vado ___ Italia.','in','Ölkəyə yönəlmə: in Italia.'],['Sən İtaliyadasan.','Sono ___ Italia.','in','Ölkədə olmaq: in Italia.'],['Sən Toskanadasan.','Sono ___ Toscana.','in','Regionda olmaq: in Toscana.'],['Sən qatarla gedirsən.','Vado ___ treno.','in','Nəqliyyat: in treno.'],['Sən avtobusdasan.','Sono ___ autobus.','in','Nəqliyyatda olmaq: in autobus.'],['Sən oxumağa gedirsən.','Vado ___ studiare.','a','Feildən sonra məqsəd: a + studiare.'],['Sən məktəbdən gəlirsən.','Vengo ___ scuola.','da','-dən mənası: da scuola.'],['Sən Markogilə gedirsən.','Vado ___ Marco.','da','-gilə mənası: da Marco.'],['Sən Markogildəsən.','Sono ___ Marco.','da','-gildə mənası: da Marco.'],['Sən Anna ilə gedirsən.','Vado ___ Anna.','con','ilə mənası: con Anna.'],['Sən mənimlə gəlirsən.','Vieni ___ me.','con','ilə mənası: con me.'],['Sən Siciliyaya gedirsən.','Vado ___ Sicilia.','in','Regiona yönəlmə: in Sicilia.'],['Sən Milandan gəlirsən.','Vengo ___ Milano.','da','-dan mənası: da Milano.'],['Sən yeməyə gedirsən.','Vado ___ mangiare.','a','Məqsəd: a mangiare.']
];
let stage=0,index=0,score=0,wrong=[],picked='',answered=false,practice=[],repeat=false;
function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.85;u.voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('it'))||null;speechSynthesis.speak(u)}
function rand(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mixQuestions(arr,round){let groups={a:[],in:[],da:[],con:[],mixed:[]};for(let q of arr){let answer=round===3?q[2]:q[1];(groups[answer]||groups.mixed).push(q)}for(let k in groups)groups[k]=rand(groups[k]);let result=[],last='';while(Object.values(groups).some(g=>g.length)){let choices=Object.keys(groups).filter(k=>groups[k].length&&k!==last);if(!choices.length)choices=Object.keys(groups).filter(k=>groups[k].length);let largest=Math.max(...choices.map(k=>groups[k].length));let eligible=choices.filter(k=>groups[k].length>=largest-1);let key=eligible[Math.floor(Math.random()*eligible.length)];result.push(groups[key].pop());last=key}return result}
function current(){return practice[index]}
function tab(){document.getElementById('tabs').innerHTML=['📖 Qaydalar','🎯 Seç','✍️ Tamamla','🌍 Situasiya'].map((x,i)=>'<button class="'+(stage===i?'active':'')+'" data-stage="'+i+'">'+x+'</button>').join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>start(+b.dataset.stage))}
function start(s,custom){stage=s;index=0;score=0;wrong=[];picked='';answered=false;repeat=!!custom;practice=custom|| (s===1?items.slice(0,28):s===2?mixQuestions(items,2):s===3?mixQuestions(situations,3):[]);render()}
function render(){tab();const app=document.getElementById('app');if(stage===0){app.innerHTML='<h2>4 sözönü — 4 sadə qayda</h2><table><tr><td>A</td><td><b>Şəhərlər:</b> vado a Roma / sono a Roma.<br><b>Məqsəd:</b> vado a studiare.</td></tr><tr><td>IN</td><td><b>Ölkə və region:</b> vado in Italia / sono in Toscana.<br><b>Nəqliyyat:</b> vado in treno / sono in autobus.</td></tr><tr><td>DA</td><td><b>-dan/-dən:</b> vengo da Milano.<br><b>-gilə/-gildə:</b> vado da Marco / sono da Marco.</td></tr><tr><td>CON</td><td><b>ilə:</b> vado con Anna / vieni con me.</td></tr></table><div class="note">💡 <b>Haraya?</b> və <b>harada?</b> suallarında şəhər üçün <b>a</b>, ölkə və region üçün <b>in</b> işlənir. <b>Da</b> isə həm haradan, həm də kiminsə yanına/yanında mənası verə bilər.</div><p class="muted small">Oyun yalnız bu qaydaları yoxlayır. Mürəkkəb sözönü birləşmələri daxil edilməyib.</p><button class="primary" id="begin">Oyuna başla →</button>';document.getElementById('begin').onclick=()=>start(1);return}if(index>=practice.length){app.innerHTML='<h2>🎉 Bravissimo!</h2><div class="question">'+score+' / '+practice.length+'</div><p>'+ (score===practice.length?'Təbriklər! Bütün cavabların doğrudur.':'Səhvlərin üzərində bir daha işləyə bilərsən.')+'</p><div class="row"><button class="primary" id="again">Yenidən oyna</button><button id="errors" '+(!wrong.length?'disabled':'')+'>Səhvləri təkrarla ('+wrong.length+')</button><button id="nextstage">Növbəti raund →</button></div>';document.getElementById('again').onclick=()=>start(stage);document.getElementById('errors').onclick=()=>start(stage,[...wrong]);document.getElementById('nextstage').onclick=()=>start(stage===3?1:stage+1);return}let q=current(),prompt=stage===3?q[1]:q[0],translation=stage===3?q[0]:q[3],ans=stage===3?q[2]:q[1];app.innerHTML='<div class="row between"><span class="muted">'+(stage===1?'Raund 1 · Sözönünü seç':stage===2?'Raund 2 · Boşluğu tamamla':'Raund 3 · Situasiya')+(repeat?' · Təkrar':'')+'</span><b>'+(index+1)+' / '+practice.length+'</b></div><div class="bar"><div style="width:'+(100*index/practice.length)+'%"></div></div><div class="muted">'+translation+'</div><div class="question">'+prompt+'</div><div id="answer"></div><div id="feedback"></div><div class="row" style="margin-top:16px"><button class="primary" id="check">Yoxla</button><button id="next" disabled>Növbəti →</button><button id="listen">🔊 Cümləni dinlə</button></div>';let box=document.getElementById('answer');if(stage===1||stage===3){box.className='choices';box.innerHTML=['a','in','da','con'].map(x=>'<button data-choice="'+x+'">'+x.toUpperCase()+'</button>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(answered)return;picked=b.dataset.choice;box.querySelectorAll('button').forEach(t=>t.classList.toggle('selected',t===b))})}else{box.innerHTML='<input id="entry" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="a / in / da / con">';document.getElementById('entry').onkeydown=e=>{if(e.key==='Enter')answered?advance():check()}}document.getElementById('check').onclick=check;document.getElementById('next').onclick=advance;document.getElementById('listen').onclick=()=>{let val=ans.split('|');let k=0;speak(prompt.replace(/___/g,()=>val[k++]||'___'))}}
function check(){if(answered)return;let q=current(),ans=stage===3?q[2]:q[1],given=stage===2?document.getElementById('entry').value.trim().toLowerCase().replace(/\s+/g,' ').replace(/\s*[,;]\s*/g,'|').replace(/\s*\/\s*/g,'|'):picked;if(!given){document.getElementById('feedback').innerHTML='<div class="feedback wrong">Əvvəl cavab seç və ya yaz.</div>';return}let good=given===ans;if(good)score++;else wrong.push(q);answered=true;let expl=stage===3?q[3]:q[2];document.getElementById('feedback').innerHTML='<div class="feedback '+(good?'':'wrong')+'"><b>'+(good?'✅ Düzdür!':'❌ Düzgün cavab: '+ans.toUpperCase().replace('|',' + '))+'</b><div>'+expl+'</div></div>';document.getElementById('check').disabled=true;document.getElementById('next').disabled=false}
function advance(){index++;picked='';answered=false;render()}start(0);
</script></body></html>
