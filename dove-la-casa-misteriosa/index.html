let round=0,num=0,score=0,locked=false,chosen=[];
const el=id=>document.getElementById(id);
function speak(t){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.85;u.voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith("it"))||null;speechSynthesis.speak(u)}
function shuffle(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function update(){el("stage").textContent="Raund "+Math.min(round+1,4)+"/4";el("score").textContent="⭐ "+score+" xal";el("bar").style.width=(round*8+num)/32*100+"%"}
function scene(select){return '<div class="scene '+(select?'selectable':'')+'" id="scene" '+(select?'onclick="tap(event)" role="button" aria-label="Şəkildə əşyanı seç"':'')+'><img draggable="false" src="'+IMG+'" alt="Da Capo evinin tam təsviri"></div>'}
function help(){return '<details class="help"><summary>📖 Kömək — məkan sözlərinin tərcüməsi</summary><div class="help-grid">'+dictionary.map(([it,az])=>'<div><strong>'+it+'</strong> — '+az+'</div>').join('')+'</div><p class="muted">İtalyanca artikllərlə: sul = su + il, nel = in + il, alla = a + la, ai = a + i.</p></details>'}
function render(){update();if(round>=4){el('bar').style.width='100%';el('game').innerHTML='<div class="result"><div style="font-size:65px">🏆</div><h2>Bravissimo!</h2><h2>'+score+' / 320 xal</h2><p>32 fərqli tapşırığı tamamladın!</p><button class="btn" onclick="round=0;num=0;score=0;render()">🔁 Yenidən oyna</button></div>';return}
locked=false;chosen=[];let q=DATA[round][num];
let question=round===3?"Traduci in italiano":q.it;
let out='<h2 style="text-align:center">'+titles[round]+'</h2><p class="muted">'+desc[round]+'</p><div class="qtag">SUAL '+(num+1)+' / 8 · CƏMİ '+(round*8+num+1)+' / 32</div>'+scene(round===1)+'<div class="question">'+question+' <button class="btn alt" onclick="speak('+JSON.stringify(round===3?q.answer:q.it).replace(/"/g,'&quot;')+')">🔊</button></div><div class="translation">🇦🇿 '+(round===3?q.it:q.az)+'</div>';
if(round===0||round===2){out+='<div class="choices">'+shuffle(q.opts).map(v=>'<button class="choice" onclick="pick(this,'+JSON.stringify(v).replace(/"/g,'&quot;')+')">'+v+'</button>').join('')+'</div>'}
if(round===1){out+='<p class="muted">Şəkildə düzgün yerə toxun. Düzgün yer cavabdan sonra işarələnəcək.</p>'}
if(round===3){out+='<div class="built" id="built"></div><div class="words" id="words"></div><div class="controls"><button class="btn alt" onclick="resetWords()">↺ Sıfırla</button><button class="btn" onclick="checkWords()">✓ Yoxla</button></div>'}
out+=help()+'<div id="feedback" class="feedback" aria-live="polite"></div><div class="controls"><button id="next" class="btn hide" onclick="next()">Davam et →</button></div>';
el('game').innerHTML=out;if(round===3)resetWords()}
function finish(ok,correct){if(locked)return;locked=true;if(ok)score+=10;el('feedback').textContent=ok?'✓ Bravissimo! +10 xal':'✦ Düzgün cavab: '+correct;el('next').classList.remove('hide');update()}
function pick(btn,val){if(locked)return;let q=DATA[round][num],ok=val===q.answer;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});finish(ok,q.answer);if(q.ex)el('feedback').textContent+=' · '+q.ex;if(round===0)speak(q.it+' '+q.answer)}
function tap(ev){if(locked||round!==1)return;let box=el('scene').getBoundingClientRect(),x=(ev.clientX-box.left)/box.width,y=(ev.clientY-box.top)/box.height,q=DATA[1][num],a=q.rect,ok=x>=a[0]&&x<=a[0]+a[2]&&y>=a[1]&&y<=a[1]+a[3];let m=document.createElement('div');m.className='marker'+(ok?'':' bad');m.style.cssText='left:'+(a[0]*100)+'%;top:'+(a[1]*100)+'%;width:'+(a[2]*100)+'%;height:'+(a[3]*100)+'%';el('scene').appendChild(m);finish(ok,q.name);speak(q.it)}
function resetWords(){if(locked)return;chosen=[];let q=DATA[3][num];el('built').innerHTML='';el('words').innerHTML=shuffle(q.words.map((w,i)=>({w,i}))).map(o=>'<button class="word" id="w'+o.i+'" onclick="addWord('+o.i+')">'+o.w+'</button>').join('')}
function addWord(i){if(locked)return;let b=el('w'+i);if(!b||b.disabled)return;chosen.push(i);b.disabled=true;let t=document.createElement('button');t.className='word';t.textContent=b.textContent;t.onclick=()=>{if(locked)return;resetWords()};el('built').appendChild(t)}
function checkWords(){if(locked)return;let q=DATA[3][num],answer=chosen.map(i=>q.words[i]).join(' ').trim().replace(/[.!?]$/,'').toLocaleLowerCase('it'),expected=q.answer.replace(/[.!?]$/,'').toLocaleLowerCase('it');finish(answer===expected,q.answer);speak(q.answer)}
function next(){num++;if(num===8){num=0;round++}render()}
render();
</script></body></html>
