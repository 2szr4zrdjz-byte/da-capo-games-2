<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Da Capo | 10 espressioni con ESSERE</title>
<style>
:root{--g:#0b4f35;--g2:#1d684b;--cream:#fbf7ec;--gold:#d8b552;--ink:#17362b;--muted:#718078}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 5%,#e9f2e8 0,transparent 26%),var(--cream);color:var(--ink);font-family:Arial,sans-serif;padding:14px}
.app{max-width:720px;margin:auto}.brand{text-align:center}.brand .tree{font-size:34px}.brand h1{font:700 30px Georgia,serif;color:var(--g);margin:0}.brand small{font-size:10px;letter-spacing:1.8px;color:var(--g2);text-transform:uppercase}
h2{text-align:center;font:700 25px Georgia,serif;color:var(--g);margin:18px 0 5px}.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:15px}
.panel{background:#fffdf8;border:1px solid #dbe5dd;border-radius:25px;padding:17px;box-shadow:0 14px 34px #17362b12}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.badge{background:#edf5ef;color:var(--g);font-weight:800;padding:8px 12px;border-radius:99px}
.progress{height:6px;background:#e6ebe7;border-radius:99px;overflow:hidden;margin:12px 0 18px}.fill{height:100%;background:var(--gold);transition:.25s}
.scene{perspective:1200px}.card{position:relative;min-height:380px;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid #d9e5dc;border-radius:24px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#fff 0,#fbf8ef 100%)}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,#f4f9f4,#fffdf8)}
.icon{font-size:48px;margin-bottom:15px}.expr{font:700 31px Georgia,serif;color:var(--g);line-height:1.15}.hint{margin-top:15px;font-size:12px;color:var(--muted)}.meaning{font:700 22px Georgia,serif;color:var(--g);margin-bottom:20px}
.example{font:700 22px Georgia,serif;color:var(--ink);line-height:1.35}.translation{font:italic 15px Georgia,serif;color:var(--g2);margin-top:9px;line-height:1.4}
.audioRow{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:22px}.audio{border:0;background:var(--g);color:white;border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer;box-shadow:0 5px 12px #0b4f3520}.audio.secondary{background:white;color:var(--g);border:1px solid #bcd0c2;box-shadow:none}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;margin-top:14px}.nav{border:1px solid #bed0c3;background:white;color:var(--g);border-radius:14px;padding:12px;font-weight:800;cursor:pointer}.flipBtn{border:0;background:var(--gold);color:#3c3214;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}.nav:disabled{opacity:.35}
.status{text-align:center;min-height:22px;margin-top:10px;font-size:12px;color:var(--g2)}footer{text-align:center;margin:14px;font:italic 13px Georgia,serif;color:var(--g)}
@media(max-width:520px){body{padding:8px}.panel{padding:12px}.card{min-height:390px}.face{padding:23px 16px}.expr{font-size:27px}.example{font-size:20px}.controls{grid-template-columns:1fr 1fr}.flipBtn{grid-column:1/-1;grid-row:1}.nav{grid-row:2}}
</style></head><body>
<main class="app"><header class="brand"><div class="tree">🌳</div><h1>Da Capo</h1><small>Guided Self-Study Membership</small></header>
<h2>10 espressioni con ESSERE 🇮🇹</h2><div class="sub">Gündəlik danışıqda işlənən sabit ifadələri öyrən və dinlə.</div>
<section class="panel"><div class="top"><span class="badge">FLASHCARDS</span><span id="counter">1 / 10</span></div><div class="progress"><div id="fill" class="fill"></div></div>
<div class="scene"><div id="card" class="card" aria-label="Flashcard"><div class="face front"><div id="icon" class="icon"></div><div id="expr" class="expr"></div><div class="audioRow"><button id="hearExpr" class="audio" type="button">🔊 İfadəni dinlə</button></div><div class="hint">Mənanı və nümunəni görmək üçün kartı çevir.</div></div>
<div class="face back"><div id="meaning" class="meaning"></div><div id="example" class="example"></div><div id="translation" class="translation"></div><div class="audioRow"><button id="hearSentence" class="audio" type="button">🔊 Cümləni dinlə</button><button id="hearExpr2" class="audio secondary" type="button">🔊 İfadə</button></div></div></div></div>
<div class="controls"><button id="prev" class="nav" type="button">← Əvvəlki</button><button id="flip" class="flipBtn" type="button">↻ Kartı çevir</button><button id="next" class="nav" type="button">Növbəti →</button></div><div id="status" class="status"></div></section><footer>Scopri, ascolta, impara. 🌱</footer></main>
<script>
(function(){const data=[
{e:"essere d’accordo",m:"razı olmaq",s:"Sono d’accordo con te.",t:"Mən səninlə razıyam.",i:"🤝"},
{e:"essere in ritardo",m:"gecikmək / gecikmiş olmaq",s:"Scusa, sono in ritardo.",t:"Bağışla, gecikmişəm.",i:"⏰"},
{e:"essere in anticipo",m:"vaxtından əvvəl gəlmək / tez olmaq",s:"Oggi siamo in anticipo.",t:"Bu gün vaxtından əvvəl gəlmişik.",i:"⌚"},
{e:"essere in gamba",m:"bacarıqlı, fərasətli olmaq",s:"La nostra insegnante è davvero in gamba.",t:"Müəlliməmiz həqiqətən çox bacarıqlıdır.",i:"💪"},
{e:"essere di fretta",m:"tələsmək",s:"Non posso fermarmi, sono di fretta.",t:"Dayana bilmirəm, tələsirəm.",i:"🏃"},
{e:"essere in grado di",m:"bir şeyi etməyə qadir / iqtidarında olmaq",s:"Sei in grado di farlo da solo?",t:"Bunu təkbaşına edə bilirsən?",i:"🎯"},
{e:"essere a posto",m:"qaydasında olmaq / hazır olmaq",s:"È tutto a posto, non preoccuparti.",t:"Hər şey qaydasındadır, narahat olma.",i:"👌"},
{e:"essere nei guai",m:"başı bəlada olmaq / çətin vəziyyətdə olmaq",s:"Siamo nei guai!",t:"Başımız bəladadır!",i:"😬"},
{e:"essere al verde",m:"pulu qurtarmaq / pulsuz qalmaq",s:"A fine mese sono sempre al verde.",t:"Ayın sonunda həmişə pulum qurtarır.",i:"💸"},
{e:"essere fuori di testa",m:"dəli olmaq / ağlasığmaz davranmaq",s:"Sei fuori di testa? È troppo pericoloso!",t:"Dəlisən? Bu, həddindən artıq təhlükəlidir!",i:"🤯"}];
let n=0;const $=id=>document.getElementById(id);
function render(){const x=data[n];$("expr").textContent=x.e;$("meaning").textContent=x.m;$("example").textContent=x.s;$("translation").textContent=x.t;$("icon").textContent=x.i;$("counter").textContent=(n+1)+" / "+data.length;$("fill").style.width=((n+1)/data.length*100)+"%";$("prev").disabled=n===0;$("next").disabled=n===data.length-1;$("card").classList.remove("flipped");$("status").textContent=""}
let voices=[];function loadVoices(){voices=window.speechSynthesis?window.speechSynthesis.getVoices():[]}if("speechSynthesis" in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}
function speak(text){if(!("speechSynthesis" in window)){$("status").textContent="Bu brauzerdə səsləndirmə dəstəklənmir.";return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="it-IT";u.rate=.82;u.pitch=1;const v=voices.find(v=>/^it(-|_)/i.test(v.lang))||voices.find(v=>/Italian/i.test(v.name));if(v)u.voice=v;u.onerror=()=>{$("status").textContent="Səs açılmadı. Cihazda italyanca səsin aktiv olduğunu yoxla."};u.onstart=()=>{$("status").textContent="🔊 Ascolta..."};u.onend=()=>{$("status").textContent=""};speechSynthesis.speak(u)}
$("hearExpr").onclick=e=>{e.stopPropagation();speak(data[n].e)};$("hearExpr2").onclick=e=>{e.stopPropagation();speak(data[n].e)};$("hearSentence").onclick=e=>{e.stopPropagation();speak(data[n].s)};$("card").onclick=()=>$("card").classList.toggle("flipped");$("flip").onclick=()=>$("card").classList.toggle("flipped");$("prev").onclick=()=>{if(n>0){n--;render()}};$("next").onclick=()=>{if(n<data.length-1){n++;render()}};render()})();
</script></body></html>
