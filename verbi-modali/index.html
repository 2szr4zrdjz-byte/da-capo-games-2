<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo — I verbi modali</title><style>:root{--g:#174b3b;--gold:#d6b04d;--cream:#fbf9ef}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:16px/1.55 system-ui,-apple-system,sans-serif;color:#244133}.wrap{max-width:860px;margin:auto;padding:16px}header{background:var(--g);color:#fff;padding:28px;border-radius:22px}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(29px,5vw,46px);margin:0}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}button{font:inherit;font-weight:700;border:1px solid #bdcebf;border-radius:12px;background:#fff;color:var(--g);padding:11px 14px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary,.tabs .active{background:var(--g);color:white}.tabs button{flex:1;min-width:110px;font-size:13px}.card{background:white;border:1px solid #e7e6d9;border-radius:20px;padding:23px;margin:14px 0}.muted{color:#6a7d71}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{padding:17px;text-align:left}.choice.selected{outline:3px solid var(--gold);background:#fff9dd}.big{font-size:clamp(21px,4vw,27px);font-weight:750;margin:20px 0}.bar{height:9px;background:#e5ece5;border-radius:9px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:var(--gold)}.feedback{padding:14px;border-radius:13px;background:#edf6ec;margin-top:13px}.feedback.bad{background:#fff0e9}input{width:100%;border:2px solid #c3d0c4;border-radius:12px;padding:13px;font:inherit;font-size:20px}.speak{padding:5px 9px;font-size:14px}.note{background:#f4f7ed;padding:15px;border-radius:14px;margin:14px 0}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e4e8dd;text-align:left}th{background:#f4f7ed}.bubble{border-radius:15px;padding:13px;background:#edf4ed;margin:10px 0}.tag{font-size:12px;font-weight:800;color:#63806d}@media(max-width:550px){.wrap{padding:10px}.card{padding:16px}.grid{grid-template-columns:1fr}.tabs button{min-width:90px;padding:10px 6px}}</style></head><body><main class="wrap"><header><div>🌱 DA CAPO · ITALIANO A1</div><h1>I VERBI MODALI</h1><div>Potere · Volere · Dovere</div><div>5 raund · mənalar · 18 hallanma · 24 cümlə · dialoq</div></header><nav class="tabs" id="tabs"></nav><div id="app"></div></main><script>
const verbs={potere:{az:'bacarmaq / mümkün olmaq / icazə',forms:['posso','puoi','può','possiamo','potete','possono']},volere:{az:'istəmək',forms:['voglio','vuoi','vuole','vogliamo','volete','vogliono']},dovere:{az:'malı / məli olmaq, məcburiyyət',forms:['devo','devi','deve','dobbiamo','dovete','devono']}},persons=['io','tu','lui/lei/Lei','noi','voi','loro'],names=Object.keys(verbs),titles=['1 · Mənalar','2 · Hallanma','3 · Yazılı məşq','4 · Cümlələr','5 · Dialoq'];let stage=0,idx=0,score=0,answered=false,choice='',mistakes=[],pool=[],selectedVerb='potere',dialogStep=0,history=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.87;u.voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('it'))||null;speechSynthesis.speak(u)}function audio(s){return '<button class="speak" data-say="'+s.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">🔊</button>'}function bindAudio(){document.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say)})}
const meanings=[{q:'«Potere» hansı mənanı bildirir?',a:'Bacarmaq / mümkün olmaq',opts:['Bacarmaq / mümkün olmaq','İstəmək','Məcbur olmaq','Getmək'],why:'Potere — bacarıq, imkan və ya icazə.'},{q:'«Volere» hansı mənanı bildirir?',a:'İstəmək',opts:['Bilmək','İstəmək','Məcbur olmaq','Çıxmaq'],why:'Volere — arzu və istək.'},{q:'«Dovere» hansı mənanı bildirir?',a:'Məcburiyyət / -malı, -məli',opts:['İstəmək','Oynamaq','Məcburiyyət / -malı, -məli','Bacarmaq'],why:'Dovere — zərurət, öhdəlik.'},{q:'«Mən kitab oxumaq istəyirəm» — hansı modal feil?',a:'volere',opts:['potere','volere','dovere'],why:'İstəmək = volere.'},{q:'«Mən sabah işləməliyəm» — hansı modal feil?',a:'dovere',opts:['volere','potere','dovere'],why:'-malı/-məli = dovere.'},{q:'«Burada otura bilərəm?» — hansı modal feil?',a:'potere',opts:['dovere','potere','volere'],why:'İcazə və imkan = potere.'}];let forms=[];names.forEach(k=>persons.forEach((p,i)=>forms.push({q:p+' + '+k,answer:verbs[k].forms[i],why:p+' + '+k+' → '+verbs[k].forms[i]})));
const raw=[
['Io ___ aprire la finestra? (potere)','posso','Pəncərəni aça bilərəm?'],['Tu ___ usare il mio computer. (potere)','puoi','Sən mənim kompüterimdən istifadə edə bilərsən.'],['Sara ___ parlare con il direttore. (potere)','può','Sara direktorla danışa bilər.'],['Noi ___ studiare insieme domani. (potere)','possiamo','Biz sabah birlikdə dərs oxuya bilərik.'],['Voi ___ sedervi qui. (potere)','potete','Siz burada əyləşə bilərsiniz.'],['Gli studenti ___ fare una pausa. (potere)','possono','Tələbələr fasilə edə bilərlər.'],['Io ___ comprare un quaderno nuovo. (volere)','voglio','Mən yeni dəftər almaq istəyirəm.'],['Tu ___ ascoltare questa canzone? (volere)','vuoi','Sən bu mahnını dinləmək istəyirsən?'],['Mia sorella ___ imparare lo spagnolo. (volere)','vuole','Bacım ispan dilini öyrənmək istəyir.'],['Noi ___ preparare una sorpresa. (volere)','vogliamo','Biz sürpriz hazırlamaq istəyirik.'],['Voi ___ visitare il museo? (volere)','volete','Siz muzeyi ziyarət etmək istəyirsiniz?'],['I miei amici ___ ordinare una pizza. (volere)','vogliono','Dostlarım pizza sifariş etmək istəyirlər.'],['Io ___ finire questo esercizio. (dovere)','devo','Mən bu tapşırığı bitirməliyəm.'],['Tu ___ chiamare tua nonna. (dovere)','devi','Sən nənənə zəng etməlisən.'],['Il medico ___ arrivare alle nove. (dovere)','deve','Həkim saat doqquzda gəlməlidir.'],['Noi ___ pulire la cucina. (dovere)','dobbiamo','Biz mətbəxi təmizləməliyik.'],['Voi ___ portare i documenti. (dovere)','dovete','Siz sənədləri gətirməlisiniz.'],['I bambini ___ lavare le mani. (dovere)','devono','Uşaqlar əllərini yumalıdırlar.'],['Stasera io non ___ guidare: sono stanco. (potere)','posso','Bu axşam maşın sürə bilmirəm: yorğunam.'],['Perché tu non ___ venire alla festa? (volere)','vuoi','Niyə şənliyə gəlmək istəmirsən?'],['Domani noi ___ partire presto. (dovere)','dobbiamo','Sabah tez yola düşməliyik.'],['Marco e Paolo ___ imparare il francese. (volere)','vogliono','Marko və Paolo fransızca öyrənmək istəyirlər.'],['Ragazzi, ___ chiudere la porta? (potere)','potete','Uşaqlar, qapını bağlaya bilərsiniz?'],['Lei ___ pagare entro venerdì. (dovere)','deve','O, cümə gününə qədər ödəməlidir.']];const sentences=raw.map(([q,answer,az])=>({q,answer,why:az}));
const dialog=[
{say:'Ciao! Vuoi organizzare un picnic domenica?',az:'Salam! Bazar günü piknik təşkil etmək istəyirsən?',q:'«Bəli, istəyirəm!» de.',opts:['Sì, voglio!','Sì, vuole!','Sì, vuoi!'],a:'Sì, voglio!',why:'Io voglio — volere.'},
{say:'Possiamo invitare anche Sofia?',az:'Sofiyanı da dəvət edə bilərik?',q:'«Bəli, edə bilərik» de.',opts:['Sì, possiamo.','Sì, possono.','Sì, potete.'],a:'Sì, possiamo.',why:'Noi possiamo — potere.'},
{say:'Che cosa dobbiamo portare?',az:'Nə gətirməliyik?',q:'«Biz su gətirməliyik» de.',opts:['Dobbiamo portare l’acqua.','Dovete portare l’acqua.','Devono portare l’acqua.'],a:'Dobbiamo portare l’acqua.',why:'Noi dobbiamo — dovere.'},
{say:'Sai se Luca vuole partecipare?',az:'Lukanın iştirak etmək istəyib-istəmədiyini bilirsən?',q:'«Bəli, o iştirak etmək istəyir» de.',opts:['Sì, vuole partecipare.','Sì, voglio partecipare.','Sì, vogliono partecipare.'],a:'Sì, vuole partecipare.',why:'Luca = lui → vuole.'},
{say:'I bambini possono giocare nel parco?',az:'Uşaqlar parkda oynaya bilərlər?',q:'«Bəli, oynaya bilərlər» de.',opts:['Sì, possono giocare.','Sì, può giocare.','Sì, posso giocare.'],a:'Sì, possono giocare.',why:'I bambini = loro → possono.'},
{say:'A che ora devi essere pronto?',az:'Saat neçədə hazır olmalısan?',q:'«Saat onda hazır olmalıyam» de.',opts:['Devo essere pronto alle dieci.','Devi essere pronto alle dieci.','Deve essere pronto alle dieci.'],a:'Devo essere pronto alle dieci.',why:'Io devo — dovere.'},
{say:'Vuoi portare la tua macchina fotografica?',az:'Fotoaparatını gətirmək istəyirsən?',q:'«Bəli, onu gətirmək istəyirəm» de.',opts:['Sì, voglio portarla.','Sì, vuoi portarla.','Sì, vuole portarla.'],a:'Sì, voglio portarla.',why:'Io voglio — volere.'},
{say:'Perfetto! Possiamo incontrarci davanti al parco?',az:'Əla! Parkın qarşısında görüşə bilərik?',q:'«Əlbəttə, görüşə bilərik!» de.',opts:['Certo, possiamo!','Certo, potete!','Certo, possono!'],a:'Certo, possiamo!',why:'Noi possiamo — potere.'}
];
function tabs(){document.getElementById('tabs').innerHTML=titles.map((t,i)=>'<button data-stage="'+i+'" class="'+(stage===i?'active':'')+'">'+t+'</button>').join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>start(+b.dataset.stage))}
function start(n,custom){stage=n;idx=0;score=0;answered=false;choice='';mistakes=[];dialogStep=0;history=[];pool=custom|| (n===0?shuffle(meanings):n===2?shuffle(forms):n===3?shuffle(sentences):[]);render()}
function render(){tabs();if(stage===1)return tables();if(stage===4)return dialogue();if(idx>=pool.length)return finished();let q=pool[idx],app=document.getElementById('app');app.innerHTML='<section class="card"><div class="row between"><span class="tag">'+titles[stage]+'</span><b>'+(idx+1)+' / '+pool.length+'</b></div><div class="bar"><div style="width:'+(100*idx/pool.length)+'%"></div></div><div class="muted">'+(stage===0?'Düzgün mənanı seç':stage===2?'Formanı yaddaşdan yaz':'Boşluğu düzgün forma ilə tamamla')+'</div><div class="big">'+q.q+'</div><div id="answer"></div><div id="feedback"></div><div class="row" style="margin-top:16px"><button class="primary" id="check">Yoxla</button><button id="next" disabled>Növbəti →</button>'+(stage===3?'<button id="hear">🔊 Cümləni dinlə</button>':'')+'</div></section>';if(stage===0){document.getElementById('answer').className='grid';document.getElementById('answer').innerHTML=shuffle(q.opts).map((x,i)=>'<button class="choice" data-choice="'+i+'">'+x+'</button>').join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(answered)return;choice=b.textContent;document.querySelectorAll('[data-choice]').forEach(z=>z.classList.toggle('selected',z===b))})}else{document.getElementById('answer').innerHTML='<input id="input" placeholder="İtalyanca yaz..." autocomplete="off" autocapitalize="none" spellcheck="false">';document.getElementById('input').onkeydown=e=>{if(e.key==='Enter')answered?next():check()}}document.getElementById('check').onclick=check;document.getElementById('next').onclick=next;if(document.getElementById('hear'))document.getElementById('hear').onclick=()=>speak(q.q.replace('___',q.answer).replace(/\([^)]*\)/g,''))}
function check(){if(answered)return;let q=pool[idx],v=stage===0?choice:document.getElementById('input').value.trim();if(!v){document.getElementById('feedback').innerHTML='<div class="feedback bad">Əvvəl cavab daxil et.</div>';return}answered=true;let good=norm(v)===norm(stage===0?q.a:q.answer);if(good)score++;else mistakes.push(q);document.getElementById('feedback').innerHTML='<div class="feedback '+(good?'':'bad')+'"><b>'+(good?'✅ Bravissimo!':'❌ Düzgün cavab: '+(stage===0?q.a:q.answer))+'</b><p>'+q.why+'</p>'+(stage===0?'':audio(q.answer))+'</div>';document.getElementById('check').disabled=true;document.getElementById('next').disabled=false;bindAudio()}
function next(){idx++;answered=false;choice='';render()}
function finished(){document.getElementById('app').innerHTML='<section class="card"><h2>🎉 Raund tamamlandı!</h2><div class="big">'+score+' / '+pool.length+' · '+Math.round(100*score/pool.length)+'%</div><p>Səhv cavablar: '+mistakes.length+'</p><div class="row"><button class="primary" id="again">Yenidən başla</button><button id="retry" '+(!mistakes.length?'disabled':'')+'>Səhvləri təkrarla</button><button id="forward">Növbəti mərhələ →</button></div></section>';document.getElementById('again').onclick=()=>start(stage);document.getElementById('retry').onclick=()=>start(stage,[...mistakes]);document.getElementById('forward').onclick=()=>start(Math.min(stage+1,4))}
function tables(){let v=verbs[selectedVerb];document.getElementById('app').innerHTML='<section class="card"><h2>Hallanma cədvəlləri</h2><p>Formaları dinlə, təkrar et, sonra yaddaşdan yaz.</p><div class="row">'+names.map(n=>'<button data-v="'+n+'" class="'+(n===selectedVerb?'primary':'')+'">'+n+'</button>').join('')+'</div><h2>'+selectedVerb+' — '+v.az+'</h2><table><thead><tr><th>Şəxs</th><th>Forma</th><th>Dinlə</th></tr></thead><tbody>'+persons.map((p,i)=>'<tr><td>'+p+'</td><td><b>'+v.forms[i]+'</b></td><td>'+audio((i===2?'lei':p)+' '+v.forms[i])+'</td></tr>').join('')+'</tbody></table><div class="note"><b>Qayda:</b> Modal feil şəxsə görə hallanır, ardınca gələn əsas feil isə <b>məsdərdə (infinito)</b> qalır.<br><i>Posso leggere.</i> — Oxuya bilərəm.<br><i>Voglio dormire.</i> — Yatmaq istəyirəm.<br><i>Devo lavorare.</i> — İşləməliyəm.</div><button class="primary" id="go">Yazılı məşqə keç →</button></section>';document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{selectedVerb=b.dataset.v;tables()});document.getElementById('go').onclick=()=>start(2);bindAudio()}
function dialogue(){let app=document.getElementById('app');if(dialogStep>=dialog.length){app.innerHTML='<section class="card"><h2>🎉 Dialogo completato!</h2><div class="big">'+score+' / '+dialog.length+'</div><p>Elena ilə dialoqu tamamladın!</p><button class="primary" id="again">Yenidən başla</button><button id="hear">🔊 Bütün dialoqu dinlə</button><div>'+dialog.map(d=>'<div class="bubble"><b>Elena:</b> '+d.say+'<div><b>Sən:</b> '+d.a+'</div></div>').join('')+'</div></section>';document.getElementById('again').onclick=()=>start(4);document.getElementById('hear').onclick=()=>speak(dialog.map(d=>d.say+' '+d.a).join('. '));return}let d=dialog[dialogStep];app.innerHTML='<section class="card"><div class="row between"><span class="tag">INTERACTIVE DIALOGO</span><b>'+(dialogStep+1)+' / '+dialog.length+'</b></div><div class="bar"><div style="width:'+(100*dialogStep/dialog.length)+'%"></div></div>'+history.map(h=>'<div class="bubble"><b>Elena:</b> '+h.say+'<br><b>Sən:</b> '+h.a+'</div>').join('')+'<div class="bubble"><b>👩 Elena '+audio(d.say)+'</b><div class="big">'+d.say+'</div><div class="muted">'+d.az+'</div></div><div class="note">'+d.q+'</div><div class="grid">'+shuffle(d.opts).map((o,i)=>'<button class="choice" data-choice="'+i+'">'+o+'</button>').join('')+'</div><div id="feedback"></div><div class="row" style="margin-top:16px"><button class="primary" id="check">Cavabla</button><button id="next" disabled>Davam et →</button></div></section>';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(answered)return;choice=b.textContent;document.querySelectorAll('[data-choice]').forEach(z=>z.classList.toggle('selected',z===b))});document.getElementById('check').onclick=()=>{if(!choice||answered)return;answered=true;let good=norm(choice)===norm(d.a);if(good)score++;document.getElementById('feedback').innerHTML='<div class="feedback '+(good?'':'bad')+'"><b>'+(good?'✅ Düzdür!':'❌ Düzgün cavab: '+d.a)+'</b><p>'+d.why+'</p>'+audio(d.a)+'</div>';document.getElementById('check').disabled=true;document.getElementById('next').disabled=false;bindAudio()};document.getElementById('next').onclick=()=>{history.push(d);dialogStep++;answered=false;choice='';dialogue()};bindAudio()}
start(0);
</script></body></html>
