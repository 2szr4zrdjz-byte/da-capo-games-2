<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo · La sfida del tempo</title><style>:root{--green:#173f32;--cream:#fffaf0;--gold:#d7a74a;--mint:#dcefe2}*{box-sizing:border-box}body{margin:0;background:#f0f3ed;color:var(--green);font-family:system-ui,-apple-system,sans-serif}main{max-width:850px;margin:25px auto;padding:22px;background:var(--cream);border:1px solid #e4dcc7;border-radius:25px;box-shadow:0 15px 45px #153b2820}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(29px,5vw,44px);margin:6px 0}.eyebrow{letter-spacing:.2em;color:#95722d;font-size:12px;font-weight:800}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.pill{background:var(--mint);padding:9px 13px;border-radius:30px;font-weight:700}.progress{height:10px;background:#e8e5d8;border-radius:20px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:var(--gold);transition:width .3s}.panel{text-align:center;padding:12px 0}.clock{width:min(270px,72vw);display:block;margin:12px auto;touch-action:none;user-select:none}.digital{font-family:ui-monospace,monospace;font-size:clamp(38px,9vw,70px);font-weight:900;color:#b9f7bb;background:#122b24;border:9px solid #365248;border-radius:18px;padding:15px 25px;display:inline-block;box-shadow:0 9px 0 #9aa99a}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0}.choice,button{font:inherit;cursor:pointer}.choice{padding:17px 10px;border:2px solid #d6decf;background:white;border-radius:15px;color:var(--green);font-weight:750;min-height:70px}.choice:hover{border-color:var(--gold)}.choice:disabled{opacity:.7;cursor:default}.choice.correct{border-color:#2a9b64;background:#d9f5e2}.choice.wrong{border-color:#bd4848;background:#fbe0df}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:16px 0}button.primary{background:var(--green);color:white;border:0;padding:14px 24px;border-radius:14px;font-weight:800}button.secondary{background:#e9eee4;color:var(--green);border:0;padding:14px 20px;border-radius:14px;font-weight:750}.hint{color:#68796d;font-size:14px}.feedback{min-height:52px;font-weight:750;padding:10px}.hidden{display:none}.clock-edit{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}.clock-edit input{width:95px;font-size:25px;text-align:center;padding:8px;border:2px solid #b9c8b9;border-radius:12px}.clock-edit label{font-size:13px;display:flex;flex-direction:column;gap:5px}.scenario{background:#e7eee5;border-radius:15px;padding:15px;font-size:20px}.footer{text-align:center;font-size:13px;color:#819083;margin-top:20px}@media(max-width:530px){main{margin:0;border-radius:0;padding:15px;min-height:100vh}.choices{grid-template-columns:1fr}.choice{min-height:54px}}</style></head><body><main><div class="top"><div><div class="eyebrow">DA CAPO 🌱 · A1</div><h1>La sfida del tempo</h1><div class="hint">Saatları italyanca öyrən!</div></div><div><div class="pill" id="score">⭐ 0 xal</div><div class="pill" id="round" style="margin-top:7px">Mərhələ 1/5</div></div></div><div class="progress"><div id="bar" style="width:0"></div></div><section id="game" class="panel"></section><div class="footer">Da Capo · Hər gün 20 dəqiqə italyanca 💚</div></main><script>
const levels=[{title:'1. Guarda l’orologio!',desc:'Əqrəbli saata bax və italyanca düzgün cavabı seç.',type:'analog',items:[['02:10','Sono le due e dieci','Sono le due meno dieci','Sono le dieci e due','Sono le due e venti'],['11:45','Sono le dodici meno un quarto','Sono le undici e un quarto','Sono le undici e mezzo','Sono le dodici e un quarto'],['04:30','Sono le quattro e mezzo','Sono le quattro e un quarto','Sono le cinque meno venti','Sono le tre e mezzo'],['01:25','È l’una e venticinque','Sono le una e venticinque','È l’una meno venticinque','Sono le due e venticinque']]},{title:'2. Leggi il display!',desc:'Rəqəmsal saatı italyanca ifadəyə çevir.',type:'digital',items:[['17:50','Sono le diciotto meno dieci','Sono le diciassette e quindici','Sono le diciotto e dieci','Sono le cinque meno venti'],['00:00','È mezzanotte','È mezzogiorno','Sono le dodici e mezzo','È l’una'],['13:15','È l’una e un quarto','Sono le tredici meno un quarto','Sono le una e quindici','È l’una e mezzo'],['10:40','Sono le undici meno venti','Sono le dieci e un quarto','Sono le undici e venti','Sono le dieci meno venti']]},{title:'3. Costruisci l’ora!',desc:'Saatı qur: saat və dəqiqəni seç. Əqrəblər canlı hərəkət edəcək.',type:'build',items:[['Sono le sette e un quarto','07:15'],['Sono le cinque meno dieci','04:50'],['È l’una e mezzo','01:30'],['Sono le nove meno un quarto','08:45']]},{title:'4. Quale orario?',desc:'İtalyanca ifadəyə uyğun rəqəmsal saatı tap.',type:'reverse',items:[['Sono le sei e venticinque','06:25','06:35','05:25','18:45'],['Sono le tre meno cinque','02:55','03:05','03:55','02:50'],['È mezzogiorno','12:00','00:00','12:30','01:00'],['Sono le otto e mezzo di sera','20:30','08:30','21:30','20:15']]},{title:'5. La vita quotidiana!',desc:'Gündəlik vəziyyətlərdə saatı düzgün başa düş.',type:'story',items:[['Il film comincia alle nove meno venti di sera. A che ora comincia?','20:40','21:20','08:40','20:20'],['La lezione inizia alle otto e un quarto di mattina. A che ora?','08:15','08:45','20:15','07:45'],['Il treno parte a mezzanotte. Quale orario?','00:00','12:00','00:30','23:00'],['La pausa finisce alle due meno un quarto del pomeriggio. A che ora?','13:45','14:15','01:45','12:45']]}];
let level=0,index=0,score=0,locked=false,hh=3,mm=0,correctIndex=0;const $=id=>document.getElementById(id);function say(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.82;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('it'))||null;speechSynthesis.speak(u)}function clock(time,editable=false){let [h,m]=time.split(':').map(Number);let a=((h%12)+m/60)*30,b=m*6;let nums=Array.from({length:12},(_,i)=>{let n=i+1,ang=n*Math.PI/6;return '<text x="'+(150+108*Math.sin(ang))+'" y="'+(155-108*Math.cos(ang))+'" text-anchor="middle" font-size="19" font-weight="700" fill="#173f32">'+n+'</text>'}).join('');let ticks=Array.from({length:60},(_,i)=>{let a=i*Math.PI/30,r=i%5?131:125;return '<line x1="'+(150+r*Math.sin(a))+'" y1="'+(150-r*Math.cos(a))+'" x2="'+(150+137*Math.sin(a))+'" y2="'+(150-137*Math.cos(a))+'" stroke="#809f8c" stroke-width="'+(i%5?1:3)+'"/>'}).join('');return '<svg class="clock" viewBox="0 0 300 300" role="img" aria-label="Əqrəbli saat: '+time+'"><circle cx="150" cy="150" r="145" fill="#fff" stroke="#173f32" stroke-width="9"/><circle cx="150" cy="150" r="139" fill="none" stroke="#d7a74a" stroke-width="3"/>'+ticks+nums+'<line x1="150" y1="150" x2="'+(150+73*Math.sin(a*Math.PI/180))+'" y2="'+(150-73*Math.cos(a*Math.PI/180))+'" stroke="#173f32" stroke-width="10" stroke-linecap="round"/><line x1="150" y1="150" x2="'+(150+105*Math.sin(b*Math.PI/180))+'" y2="'+(150-105*Math.cos(b*Math.PI/180))+'" stroke="#c18a2e" stroke-width="6" stroke-linecap="round"/><circle cx="150" cy="150" r="9" fill="#173f32"/></svg>'}
function update(){ $('score').textContent='⭐ '+score+' xal';$('round').textContent='Mərhələ '+Math.min(level+1,5)+'/5';$('bar').style.width=Math.round(((level*4+index)/20)*100)+'%'}
function show(){update();if(level>=5){$('bar').style.width='100%';$('game').innerHTML='<h2>Bravissimo! 🎉</h2><div style="font-size:70px">🏆</div><h2>'+score+' / 200 xal</h2><p>'+(score>=160?'Fantastico! Saatları çox yaxşı bilirsən!':'Complimenti! Təkrar oynayaraq nəticəni yüksəldə bilərsən.')+'</p><button class="primary" onclick="level=0;index=0;score=0;show()">🔁 Yenidən oyna</button>';return}locked=false;let l=levels[level],item=l.items[index];let html='<div class="eyebrow">SUAL '+(index+1)+'/4</div><h2>'+l.title+'</h2><p class="hint">'+l.desc+'</p>';if(l.type==='analog'){html+=clock(item[0]);html+=choices(item.slice(1),0,'phrase')}else if(l.type==='digital'){html+='<div class="digital">'+item[0]+'</div>';html+=choices(item.slice(1),0,'phrase')}else if(l.type==='build'){hh=3;mm=0;html+='<div id="editableClock">'+clock('03:00',true)+'</div><p style="font-size:23px;font-weight:800">'+item[0]+' <button class="secondary" onclick="say(levels[level].items[index][0])">🔊</button></p><div class="clock-edit"><label>Saat<input id="hours" type="number" min="1" max="12" value="3" oninput="moveHands()"></label><label>Dəqiqə<input id="minutes" type="number" min="0" max="59" step="5" value="0" oninput="moveHands()"></label></div><p class="hint">Saatı və dəqiqəni dəyişərək əqrəbləri hərəkət etdir.</p><div class="actions"><button class="primary" onclick="checkBuild()">✓ Yoxla</button></div>'}else if(l.type==='reverse'){html+='<p style="font-size:24px;font-weight:800">'+item[0]+'</p><div class="actions"><button class="secondary" onclick="say(levels[level].items[index][0])">🔊 Dinlə</button></div>';html+=choices(item.slice(1),0,'digital')}else{html+='<div class="scenario">'+item[0]+'</div><div class="actions"><button class="secondary" onclick="say(levels[level].items[index][0])">🔊 Dinlə</button></div>';html+=choices(item.slice(1),0,'digital')}html+='<div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="primary hidden" onclick="next()">Davam et →</button></div>';$('game').innerHTML=html}
function choices(arr,correct,mode){let shuffled=arr.map((s,i)=>({s,i})).sort(()=>Math.random()-.5);correctIndex=shuffled.findIndex(x=>x.i===correct);return '<div class="choices">'+shuffled.map(({s},i)=>'<button class="choice" onclick="answer('+i+')">'+(mode==='digital'?'<span style="font-family:monospace;font-size:26px">'+s+'</span>':s)+'</button>').join('')+'</div>'}function answer(i){if(locked)return;locked=true;let item=levels[level].items[index];let buttons=[...document.querySelectorAll('.choice')];buttons.forEach((b,j)=>{b.disabled=true;if(j===correctIndex)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});let good=i===correctIndex;if(good)score+=10;let correct=item[1];$('feedback').textContent=good?'✓ Bravissimo! Düzgün cavab!':'✦ Düzgün cavab: '+correct;$('next').classList.remove('hidden');if(level<2)say(correct);update()}
function moveHands(){hh=Number($('hours').value);mm=Number($('minutes').value);if(Number.isFinite(hh)&&Number.isFinite(mm)&&hh>=1&&hh<=12&&mm>=0&&mm<60)$('editableClock').innerHTML=clock(String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'))}function checkBuild(){if(locked)return;let [h,m]=levels[level].items[index][1].split(':').map(Number);let good=(hh%12)===(h%12)&&mm===m;locked=true;if(good)score+=10;$('feedback').textContent=good?'✓ Perfetto! Əqrəbləri düzgün qurdun!':'✦ Düzgün saat: '+levels[level].items[index][1];if(!good)$('editableClock').innerHTML=clock(levels[level].items[index][1]);$('next').classList.remove('hidden');update()}function next(){index++;if(index===4){index=0;level++}show()}show();</script></body></html>
