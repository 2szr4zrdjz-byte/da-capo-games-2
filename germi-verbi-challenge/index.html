<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Germì Challenge — Verbi al Presente</title>
<style>
:root{--g:#168a4a;--dg:#0c5f34;--cream:#fffaf0;--ink:#173026;--gold:#ffd45a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#dff5ff,#fff7df);color:var(--ink);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,var(--dg),var(--g));color:#fff;border-radius:24px;padding:22px;text-align:center;box-shadow:0 12px 35px #0002}.hero h1{margin:0;font-size:clamp(30px,7vw,52px)}.hero p{margin:8px 0 0}.card{background:#fff;border-radius:24px;padding:22px;margin-top:18px;box-shadow:0 12px 30px #0002}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.badge{background:#e7f7ed;color:var(--dg);font-weight:800;padding:8px 12px;border-radius:999px}.score{font-weight:900}.progress{height:12px;background:#e9eee9;border-radius:99px;overflow:hidden;margin:16px 0}.bar{height:100%;background:linear-gradient(90deg,#23a75d,#ffd45a);width:0;transition:.3s}.q{font-size:clamp(22px,5vw,32px);font-weight:900;margin:18px 0 8px}.hint{color:#64746c;margin-bottom:14px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,.opt,input{font:inherit}.opt,.action{border:0;border-radius:16px;padding:15px;cursor:pointer;font-weight:800}.opt{background:#f1f6f2;color:#173026;border:2px solid transparent}.opt:hover{border-color:#56b87a}.opt.correct{background:#d9f6e3;border-color:#2ca65d}.opt.wrong{background:#ffe0e0;border-color:#e45151}.action{background:var(--g);color:#fff}.action.secondary{background:#eef4ef;color:var(--dg)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}input{width:100%;padding:15px;border:2px solid #cbd9cf;border-radius:15px;font-size:20px;outline:none}.feedback{min-height:30px;font-weight:800;margin-top:14px}.foot{text-align:center;color:#65746c;padding:18px;font-size:13px}.result{text-align:center}.result .big{font-size:64px}.hidden{display:none}@media(max-width:560px){.options{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:17px}}
</style></head><body><div class="wrap"><div class="hero"><h1>🌱 Germì Challenge 🇮🇹</h1><p>Verbi al Presente • yalnız qaydalı feillər • -isc yoxdur</p></div><div class="card" id="game"><div class="top"><span class="badge" id="round"></span><span class="score" id="score">⭐ 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="content"></div><div class="controls"><button class="action secondary" id="speak">🔊 Tələffüz</button><button class="action hidden" id="next">Növbəti →</button></div><div class="feedback" id="feedback"></div></div><div class="foot">Tələffüz cihazın brauzerindəki Italian voice vasitəsilə səsləndirilir.</div></div>
<script>
const qs=[
{r:1,p:1,q:"Io ______ molto bene l’italiano.",v:"parlare",o:["parla","parlo","parli","parlate"],a:"parlo",s:"Io parlo molto bene l’italiano."},{r:1,p:1,q:"Tu ______ molti libri.",v:"leggere",o:["leggi","legge","leggo","leggete"],a:"leggi",s:"Tu leggi molti libri."},{r:1,p:1,q:"Giulia ______ una lettera.",v:"scrivere",o:["scrivi","scrive","scrivo","scrivono"],a:"scrive",s:"Giulia scrive una lettera."},{r:1,p:1,q:"Noi ______ italiano ogni giorno.",v:"studiare",o:["studiamo","studate","studiano","studiate"],a:"studiamo",s:"Noi studiamo italiano ogni giorno."},{r:1,p:1,q:"Voi ______ la musica italiana.",v:"ascoltare",o:["ascoltiamo","ascoltano","ascoltate","ascoltete"],a:"ascoltate",s:"Voi ascoltate la musica italiana."},{r:1,p:1,q:"Marco e Luca ______ a Roma.",v:"vivere",o:["vivete","vivono","viviamo","vivano"],a:"vivono",s:"Marco e Luca vivono a Roma."},
{r:2,p:2,q:"CUCINO — hansı şəxsdir?",o:["io","tu","noi","loro"],a:"io",s:"Io cucino."},{r:2,p:2,q:"CORRIAMO — hansı şəxsdir?",o:["loro","noi","voi","lei"],a:"noi",s:"Noi corriamo."},{r:2,p:2,q:"DORMITE — hansı şəxsdir?",o:["voi","loro","noi","tu"],a:"voi",s:"Voi dormite."},{r:2,p:2,q:"SCRIVE — uyğun şəxsi seç.",o:["io","lui / lei","voi","loro"],a:"lui / lei",s:"Lui scrive. Lei scrive."},{r:2,p:2,q:"PARLI — hansı şəxsdir?",o:["tu","lui","voi","noi"],a:"tu",s:"Tu parli."},{r:2,p:2,q:"LEGGONO — hansı şəxsdir?",o:["voi","loro","noi","lei"],a:"loro",s:"Loro leggono."},
{r:3,p:3,q:"Io e Marco ______ una pizza.",v:"preparare",a:"prepariamo",s:"Io e Marco prepariamo una pizza.",input:true},{r:3,p:3,q:"Tu ______ molto velocemente.",v:"correre",a:"corri",s:"Tu corri molto velocemente.",input:true},{r:3,p:3,q:"Anna ______ una foto del Colosseo.",v:"guardare",a:"guarda",s:"Anna guarda una foto del Colosseo.",input:true},{r:3,p:3,q:"Tu e Sofia ______ una lettera.",v:"scrivere",a:"scrivete",s:"Tu e Sofia scrivete una lettera.",input:true},{r:3,p:3,q:"Marco, Luca e Paolo ______ in piscina.",v:"nuotare",a:"nuotano",s:"Marco, Luca e Paolo nuotano in piscina.",input:true},{r:3,p:3,q:"Io ______ otto ore ogni notte.",v:"dormire",a:"dormo",s:"Io dormo otto ore ogni notte.",input:true}];
let i=0,score=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;$("next").classList.add("hidden");$("feedback").textContent="";const x=qs[i];$("round").textContent=`RAUND ${x.r} • ${x.r==1?"SCEGLI":x.r==2?"CHI SONO?":"LA SFIDA DI GERMÌ"}`;$("bar").style.width=(i/qs.length*100)+"%";$("score").textContent="⭐ "+score;let h=`<div class="q">${x.q}</div>${x.v?`<div class="hint">Feil: <b>${x.v}</b></div>`:""}`;if(x.input)h+=`<input id="answer" autocomplete="off" placeholder="Cavabı yaz..."><div class="controls"><button class="action" id="check">Yoxla ✓</button></div>`;else h+=`<div class="options">${x.o.map(a=>`<button class="opt" data-a="${a}">${a}</button>`).join("")}</div>`;$("content").innerHTML=h;if(x.input){$("check").onclick=()=>checkInput();$("answer").onkeydown=e=>{if(e.key==="Enter")checkInput()}}else document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(b))}function choose(b){if(locked)return;locked=true;const x=qs[i],ok=b.dataset.a===x.a;if(ok){score+=x.p;b.classList.add("correct");$("feedback").textContent="✅ Bravissimo!"}else{b.classList.add("wrong");document.querySelectorAll(".opt").forEach(z=>{if(z.dataset.a===x.a)z.classList.add("correct")});$("feedback").textContent="❌ Düzgün cavab: "+x.a}done()}function checkInput(){if(locked)return;const x=qs[i],inp=$("answer");let val=inp.value.trim().toLowerCase();if(!val)return;locked=true;if(val===x.a.toLowerCase()){score+=x.p;inp.style.borderColor="#2ca65d";$("feedback").textContent="✅ Perfetto!"}else{inp.style.borderColor="#e45151";$("feedback").textContent="❌ Düzgün cavab: "+x.a}done()}function done(){$("score").textContent="⭐ "+score;$("next").classList.remove("hidden")}$("next").onclick=()=>{i++;if(i<qs.length)render();else finish()};$("speak").onclick=()=>{const x=qs[i];if(!("speechSynthesis" in window)){alert("Bu brauzer səsli oxunuşu dəstəkləmir.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x.s);u.lang="it-IT";u.rate=.82;const voices=speechSynthesis.getVoices();const it=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("it"));if(it)u.voice=it;speechSynthesis.speak(u)};function finish(){$("bar").style.width="100%";let t=score>=33?"🏆 CAMPIONE DEI VERBI!":score>=26?"🌳 Bravissimo!":score>=16?"🌿 Molto bene!":"🌱 Continua ad allenarti!";$("content").innerHTML=`<div class="result"><div class="big">🇮🇹</div><h2>${t}</h2><p>Yekun nəticə: <b>${score} / 36</b></p><button class="action" onclick="location.reload()">Yenidən oyna ↻</button></div>`;$("round").textContent="FİNAL";$("next").classList.add("hidden");$("speak").classList.add("hidden");$("feedback").textContent=""}render();
</script></body></html>
