<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Da Capo | Singolare o plurale?</title><style>
:root{--g:#0b4f35;--g2:#176548;--c:#fbf7ec;--gold:#d9b95b;--red:#b93636;--muted:#718078}*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--c);color:#17362b;font-family:Arial,sans-serif}.app{max-width:720px;margin:auto}.brand,.head{text-align:center}.brand{font:700 29px Georgia;color:var(--g)}.sub{font:10px Arial;letter-spacing:2px;color:var(--g2)}.head h2{font:700 24px Georgia;color:var(--g);margin:16px 0 5px}.head p{font-size:13px;color:var(--muted)}.panel{background:#fff;border:1px solid #dfe8e2;border-radius:24px;padding:18px;box-shadow:0 10px 28px #17362b12}.top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.tag{background:#eef5f0;color:var(--g);padding:7px 10px;border-radius:99px;font-weight:bold}.lab{text-align:center;font-size:10px;color:var(--muted);margin-top:14px}.sing{text-align:center;font:700 25px Georgia;color:var(--g2);margin:6px}.arrow{text-align:center;color:var(--gold);font-size:22px}.stage{min-height:92px;display:flex;align-items:center;justify-content:center}.word{font:700 46px Georgia;color:var(--g)}.blank{display:inline-flex;width:48px;height:55px;align-items:center;justify-content:center;border-bottom:4px solid var(--gold)}.blank.hot{background:#fff5cc;border-radius:10px}.word.done{animation:pop .45s}.trans{text-align:center;min-height:25px;font:italic 16px Georgia;color:var(--g2);opacity:0}.trans.show{opacity:1}.listen{display:none;margin:5px auto 0;border:0;border-radius:99px;background:#eef5f0;color:var(--g);padding:9px 14px;font-weight:bold}.listen.show{display:block}.hint{text-align:center;font-size:11px;color:var(--muted);margin:14px 0 9px}.vowels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:430px;margin:auto}.v{height:58px;border:1px solid #dce6df;background:#fff;border-radius:16px;color:var(--g);font:700 27px Georgia;touch-action:none;-webkit-user-drag:none;user-select:none}.v.sel{border:2px solid var(--gold);background:#fff9e8}.v.drag{z-index:99}.msg{text-align:center;min-height:25px;margin-top:10px;font:700 13px Georgia;color:var(--g)}.msg.err{color:var(--red)}.bar{height:6px;background:#e5e9e6;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--gold);transition:.3s}.reset{display:block;margin:12px auto 0;border:1px solid #bfd0c5;background:#fff;color:var(--g);border-radius:13px;padding:10px 14px;font-weight:bold}.result{display:none;text-align:center;padding:25px 10px}.result.show{display:block}.game.hide{display:none}.pct{font:700 58px Georgia;color:var(--g);margin:10px}.result h3{font:700 30px Georgia;color:var(--g)}.footer{text-align:center;margin:13px;font:italic 13px Georgia;color:var(--g)}@keyframes pop{50%{transform:scale(1.12) translateY(-3px)}}@media(max-width:520px){.panel{padding:14px}.word{font-size:38px}.v{height:54px}}
</style></head><body><main class="app"><header class="brand">🌳<div>Da Capo</div><div class="sub">GUIDED SELF-STUDY MEMBERSHIP</div></header><section class="head"><h2>Singolare o plurale?</h2><p>Düzgün saiti seç və ismin cəm formasını tamamla.</p></section><section class="panel"><div class="game" id="game"><div class="top"><span class="tag">I SOSTANTIVI</span><span>Söz: <b id="count">1 / 15</b></span></div><div class="lab">SINGOLARE</div><div class="sing" id="sing"></div><div class="arrow">↓</div><div class="lab">PLURALE</div><div class="stage"><div class="word" id="word"><span id="stem"></span><span class="blank" id="blank">_</span></div></div><div class="trans" id="trans"></div><button class="listen" id="listen">🔊 Dinlə</button><div class="hint">Saiti boşluğa sürüşdür və ya saitə toxun → boşluğa toxun.</div><div class="vowels" id="vowels"></div><div class="msg" id="msg"></div><div class="bar"><div class="fill" id="fill"></div></div><button class="reset" id="reset">↻ Yenidən başla</button></div><div class="result" id="result"><h3>Risultato finale 🌳</h3><div class="pct" id="pct"></div><p id="scoreline"></p><p id="rmsg"></p><button class="reset" id="restart">↻ Yenidən başla</button></div></section><div class="footer">Impara, prova, ricorda. 🌱</div></main><script>
(function(){var data=[["gelato","gelati","dondurmalar"],["studente","studenti","tələbələr"],["pagina","pagine","səhifələr"],["chiave","chiavi","açarlar"],["ragazzo","ragazzi","oğlanlar"],["ragazza","ragazze","qızlar"],["libro","libri","kitablar"],["casa","case","evlər"],["fiore","fiori","çiçəklər"],["gatto","gatti","pişiklər"],["porta","porte","qapılar"],["bicchiere","bicchieri","stəkanlar"],["bambino","bambini","uşaqlar"],["finestra","finestre","pəncərələr"],["notte","notti","gecələr"]],vs=["a","o","e","i","u"],i=0,first=0,failed={},locked=false,sel=null,drag=null,ox=0,oy=0,$=x=>document.getElementById(x);
function shuffle(a){a=a.slice();for(var j=a.length-1;j;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}
function message(t,e){$("msg").textContent=t;$("msg").className=e?"msg err":"msg"}
function speak(t){if(!speechSynthesis||!window.SpeechSynthesisUtterance)return message("Səsləndirmə dəstəklənmir.",1);speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.78;var a=speechSynthesis.getVoices();for(var j=0;j<a.length;j++)if((a[j].lang||"").toLowerCase().indexOf("it")===0){u.voice=a[j];break}speechSynthesis.speak(u)}
function render(){locked=false;sel=null;message("");var d=data[i];$("count").textContent=(i+1)+" / 15";$("sing").textContent=d[0];$("stem").textContent=d[1].slice(0,-1);$("blank").textContent="_";$("word").className="word";$("trans").textContent="";$("trans").className="trans";$("listen").className="listen";$("fill").style.width=(i/15*100)+"%";var box=$("vowels");box.innerHTML="";shuffle(vs).forEach(function(x){var b=document.createElement("button");b.className="v";b.type="button";b.textContent=x;b.dataset.v=x;b.onclick=function(){select(b)};b.addEventListener("pointerdown",down);box.appendChild(b)})}
function select(b){if(locked)return;document.querySelectorAll(".v").forEach(x=>x.className="v");sel=b;b.className="v sel";message("İndi boşluğa toxun.")}
function attempt(v){if(locked)return;var d=data[i],ok=d[1].slice(-1);if(v===ok){locked=true;if(!failed[i])first++;$("blank").textContent=v;$("word").className="word done";$("trans").textContent=d[2];$("trans").className="trans show";$("listen").className="listen show";$("fill").style.width=((i+1)/15*100)+"%";message("Corretto! ✓");speak(d[1]);setTimeout(function(){i++;i<15?render():finish()},1350)}else{failed[i]=1;message("Səhvdir — başqa sait seç. ✕",1);$("blank").className="blank hot";setTimeout(()=>$("blank").className="blank",400)}}
$("blank").onclick=function(){if(sel)attempt(sel.dataset.v)};
function down(e){if(locked)return;drag=e.currentTarget;sel=drag;document.querySelectorAll(".v").forEach(x=>x.className="v");drag.className="v sel drag";var r=drag.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;drag.style.position="fixed";drag.style.width=r.width+"px";drag.style.left=(e.clientX-ox)+"px";drag.style.top=(e.clientY-oy)+"px";drag.style.margin=0;e.preventDefault()}
document.addEventListener("pointermove",function(e){if(!drag)return;drag.style.left=(e.clientX-ox)+"px";drag.style.top=(e.clientY-oy)+"px";var r=$("blank").getBoundingClientRect(),h=e.clientX>=r.left-20&&e.clientX<=r.right+20&&e.clientY>=r.top-20&&e.clientY<=r.bottom+20;$("blank").className=h?"blank hot":"blank"});
document.addEventListener("pointerup",function(e){if(!drag)return;var b=drag,v=b.dataset.v,r=$("blank").getBoundingClientRect(),h=e.clientX>=r.left-22&&e.clientX<=r.right+22&&e.clientY>=r.top-22&&e.clientY<=r.bottom+22;b.style.position=b.style.width=b.style.left=b.style.top=b.style.margin="";b.className="v sel";drag=null;$("blank").className="blank";if(h)attempt(v)});
$("listen").onclick=function(){speak(data[i][1])};
function finish(){$("game").className="game hide";$("result").className="result show";var p=Math.round(first/15*100);$("pct").textContent=p+"%";$("scoreline").textContent=first+" / 15 — ilk cəhddə düzgün";$("rmsg").textContent=p>=87?"Bravissimo! 🌱":p>=67?"Molto bene! Davam et. 🌱":"Bir daha sına və qaydanı möhkəmləndir. 🌱"}
function reset(){i=0;first=0;failed={};locked=false;sel=drag=null;$("result").className="result";$("game").className="game";render()}$("reset").onclick=$("restart").onclick=reset;render()})();
</script></body></html>
