<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Da Capo | Missione ESSERE</title>
<style>
:root{--g:#0b4f35;--g2:#1f684d;--cream:#fbf7ec;--gold:#d8b552;--ink:#18362c;--red:#b94d4d;--line:#d9e4dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 5% 5%,#e7f0e6,transparent 25%),var(--cream);color:var(--ink);font-family:Arial,sans-serif;padding:12px}
.app{max-width:820px;margin:auto}.brand{text-align:center}.brand h1{font:700 30px Georgia,serif;color:var(--g);margin:2px}.brand small{font-size:10px;letter-spacing:1.8px;color:var(--g2)}
.title{text-align:center;font:700 27px Georgia,serif;color:var(--g);margin:15px 0 4px}.subtitle{text-align:center;color:#718078;font-size:13px;margin-bottom:13px}
.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}.city{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;text-align:center;font-size:12px;font-weight:800;color:#8a958e}.city.active{border-color:var(--gold);color:var(--g);background:#fffaf0}.city.done{background:#eaf4ed;color:var(--g)}
.panel{background:#fffdf8;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 14px 34px #17362b12}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}.badge{background:#edf5ef;color:var(--g);padding:8px 11px;border-radius:99px;font-weight:900}.progress{height:6px;background:#e7ece8;border-radius:99px;overflow:hidden;margin:11px 0 16px}.fill{height:100%;background:var(--gold);transition:.3s}
.prompt{text-align:center;min-height:76px;display:flex;flex-direction:column;justify-content:center}.prompt h2{font:700 24px Georgia,serif;color:var(--g);margin:0 0 7px}.prompt p{margin:0;color:#53655c;line-height:1.45}.az{font:italic 14px Georgia,serif;color:var(--g2)!important;margin-top:5px!important}
.bank{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.chip{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;border:1px solid #bfd1c4;background:white;color:var(--g);border-radius:15px;padding:13px 10px;text-align:center;font-weight:800;cursor:grab;box-shadow:0 4px 10px #17362b0b;transition:.16s}.chip:active{transform:scale(.98)}.chip.used{opacity:.28;pointer-events:none}
.dropzone{min-height:76px;border:2px dashed #a9c0b0;border-radius:18px;background:#f6faf6;margin-top:14px;padding:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:#73827a;font-weight:800;transition:.18s}.dropzone.hot{background:#eaf5ed;border-color:var(--g);transform:scale(1.01)}.dropzone.good{border-style:solid;border-color:#6ca17d;background:#edf7ef;color:var(--g)}.dropzone.bad{border-color:#c66;background:#fff0f0;color:var(--red);animation:shake .25s}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.slot{min-height:54px;border:2px dashed #b8c9bd;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:7px;text-align:center;font-weight:800;color:var(--g);background:#fafcf9;overflow:hidden;word-break:break-word}.slot.filled{border-style:solid;background:#edf5ef}.slot.bad{border-color:#c66;background:#fff0f0}
.msg{text-align:center;min-height:24px;margin-top:10px;font-size:13px;font-weight:800;color:var(--g)}.msg.err{color:var(--red)}
.audio{display:none;margin:8px auto 0;border:0;background:var(--g);color:white;border-radius:13px;padding:10px 14px;font-weight:800;cursor:pointer}.audio.show{display:block}
.result{display:none;text-align:center;padding:25px 8px}.result.show{display:block}.result .pct{font:700 54px Georgia,serif;color:var(--g)}.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{border:1px solid var(--line);border-radius:15px;padding:12px 5px;background:white}.stat b{display:block;font-size:20px;color:var(--g)}.restart{border:0;border-radius:14px;background:var(--g);color:white;padding:13px 22px;font-weight:900;cursor:pointer}
.dragging{position:fixed!important;z-index:9999;pointer-events:none;width:220px;opacity:.94;transform:rotate(2deg);box-shadow:0 15px 30px #0003}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:560px){body{padding:7px}.panel{padding:12px}.bank{grid-template-columns:1fr 1fr}.chip{font-size:13px;padding:12px 6px}.slots{grid-template-columns:1fr}.slot{min-height:48px}.title{font-size:24px}.prompt h2{font-size:21px}.breakdown{gap:5px}.stat{font-size:11px}}
</style></head><body><main class="app">
<header class="brand"><div style="font-size:34px">🌳</div><h1>Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></header>
<div class="title">Missione ESSERE 🇮🇹</div><div class="subtitle">Tanı → kontekstdə seç → özün qur.</div>
<div class="journey"><div id="c0" class="city active">🏛️ Roma<br>Significato</div><div id="c1" class="city">🎨 Firenze<br>Situazione</div><div id="c2" class="city">🏙️ Milano<br>Frase</div></div>
<section class="panel"><div id="game"><div class="meta"><span id="badge" class="badge">ROUND 1 · ABBINA</span><span id="count">1 / 30</span></div><div class="progress"><div id="fill" class="fill"></div></div>
<div id="prompt" class="prompt"></div><div id="drop" class="dropzone">Kartı buraya sürüşdür və ya cavaba toxun 🌱</div><div id="slots" class="slots" style="display:none"></div><div id="bank" class="bank"></div>
<div id="msg" class="msg"></div><button id="audio" class="audio" type="button">🔊 Cümləni dinlə</button></div>
<div id="result" class="result"><div style="font-size:48px">🇮🇹🌱</div><h2 style="font:700 30px Georgia;color:var(--g);margin:5px">Missione completata!</h2><div id="pct" class="pct">0%</div><div id="scoreLine"></div><div class="breakdown"><div class="stat">Roma<b id="s0">0/10</b></div><div class="stat">Firenze<b id="s1">0/10</b></div><div class="stat">Milano<b id="s2">0/10</b></div></div><button id="restart" class="restart">↻ Yenidən oyna</button></div>
</section></main>
<script>
(()=>{const X=[
{e:"essere d’accordo",m:"razı olmaq",sit:"Tu e Marco avete la stessa opinione.",az:"Sən və Marco eyni fikirdəsiniz.",sub:"Noi",verb:"siamo",comp:"d’accordo",sent:"Noi siamo d’accordo."},
{e:"essere in ritardo",m:"gecikmək / gecikmiş olmaq",sit:"La lezione inizia alle 10:00. Luca arriva alle 10:15.",az:"Dərs 10:00-da başlayır. Luca 10:15-də gəlir.",sub:"Luca",verb:"è",comp:"in ritardo",sent:"Luca è in ritardo."},
{e:"essere in anticipo",m:"vaxtından əvvəl gəlmək",sit:"Il treno parte alle 9:00. Anna arriva alla stazione alle 8:30.",az:"Qatar 9:00-da yola düşür. Anna stansiyaya 8:30-da gəlir.",sub:"Anna",verb:"è",comp:"in anticipo",sent:"Anna è in anticipo."},
{e:"essere in gamba",m:"bacarıqlı, fərasətli olmaq",sit:"Giulia risolve sempre i problemi velocemente e lavora molto bene.",az:"Giulia problemləri həmişə tez həll edir və çox yaxşı işləyir.",sub:"Giulia",verb:"è",comp:"in gamba",sent:"Giulia è in gamba."},
{e:"essere di fretta",m:"tələsmək",sit:"Ho solo cinque minuti e devo prendere l’autobus.",az:"Cəmi beş dəqiqəm var və avtobusa çatmalıyam.",sub:"Io",verb:"sono",comp:"di fretta",sent:"Io sono di fretta."},
{e:"essere in grado di",m:"bir şeyi etməyə qadir olmaq",sit:"Paolo sa riparare il computer senza aiuto.",az:"Paolo kompüteri köməksiz təmir edə bilir.",sub:"Paolo",verb:"è",comp:"in grado di farlo",sent:"Paolo è in grado di farlo."},
{e:"essere a posto",m:"qaydasında olmaq / hazır olmaq",sit:"Abbiamo controllato tutto. Non c’è nessun problema.",az:"Hər şeyi yoxladıq. Heç bir problem yoxdur.",sub:"Tutto",verb:"è",comp:"a posto",sent:"Tutto è a posto."},
{e:"essere nei guai",m:"başı bəlada olmaq",sit:"Abbiamo perso i documenti e il nostro volo parte tra un’ora.",az:"Sənədləri itirmişik və uçuşumuz bir saata yola düşür.",sub:"Noi",verb:"siamo",comp:"nei guai",sent:"Noi siamo nei guai."},
{e:"essere al verde",m:"pulu qurtarmaq / pulsuz qalmaq",sit:"È la fine del mese e non ho più soldi.",az:"Ayın sonudur və artıq pulum yoxdur.",sub:"Io",verb:"sono",comp:"al verde",sent:"Io sono al verde."},
{e:"essere fuori di testa",m:"dəli olmaq / ağlasığmaz davranmaq",sit:"Marco vuole nuotare nel mare durante una tempesta.",az:"Marco fırtına zamanı dənizdə üzmək istəyir.",sub:"Marco",verb:"è",comp:"fuori di testa",sent:"Marco è fuori di testa."}
];
const $=x=>document.getElementById(x),shuffle=a=>[...a].sort(()=>Math.random()-.5);let round=0,q=0,first=[0,0,0],failed={},locked=false,lastSpeech="",placed=[];
function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.82;let vs=speechSynthesis.getVoices(),v=vs.find(v=>/^it(-|_)/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function journey(){for(let i=0;i<3;i++)$("c"+i).className="city "+(i<round?"done":i===round?"active":"")}
function render(){locked=false;placed=[];$("msg").textContent="";$("msg").className="msg";$("audio").className="audio";$("drop").className="dropzone";$("drop").style.visibility="visible";$("bank").style.visibility="visible";$("bank").innerHTML="";$("slots").innerHTML="";journey();$("count").textContent=(round*10+q+1)+" / 30";$("fill").style.width=((round*10+q)/30*100)+"%";let x=X[q];
if(round===0){$("badge").textContent="ROUND 1 · ABBINA";$("prompt").innerHTML="<h2>"+x.e+"</h2><p>İfadənin düzgün mənasını tap.</p>";$("drop").style.display="flex";$("slots").style.display="none";makeChoices(shuffle([x.m,...shuffle(X.filter((_,i)=>i!==q)).slice(0,3).map(z=>z.m)]),x.m)}
if(round===1){$("badge").textContent="ROUND 2 · CHE SUCCEDE?";$("prompt").innerHTML="<h2>🎭 Che succede?</h2><p>"+x.sit+"</p><p class='az'>"+x.az+"</p>";$("drop").style.display="flex";$("slots").style.display="none";makeChoices(shuffle([x.e,...shuffle(X.filter((_,i)=>i!==q)).slice(0,3).map(z=>z.e)]),x.e)}
if(round===2){$("badge").textContent="ROUND 3 · COSTRUISCI";$("prompt").innerHTML="<h2>🇮🇹 Costruisci la frase</h2><p>"+x.az+"</p>";$("drop").style.display="none";$("slots").style.display="grid";for(let i=0;i<3;i++){let s=document.createElement("div");s.className="slot";s.textContent="...";s.onclick=()=>removeSlot(i);$("slots").appendChild(s)}let verbs=["sono","sei","è","siamo","siete"];let wrong=shuffle(verbs.filter(v=>v!==x.verb))[0];makeBuild(shuffle([x.sub,x.verb,x.comp,wrong,shuffle(X.filter((_,i)=>i!==q))[0].comp]))}}
function makeChoices(arr,correct){arr.forEach(t=>{let b=document.createElement("div");b.className="chip";b.textContent=t;b.onclick=()=>attempt(t,correct);enableDrag(b,()=>attempt(t,correct));$("bank").appendChild(b)})}
function attempt(v,correct){if(locked)return;if(v===correct){locked=true;if(!failed[round+"-"+q])first[round]++;if(round===0){$("drop").style.visibility="hidden";$("bank").style.visibility="hidden"}else{$("drop").className="dropzone good";$("drop").textContent="✓ "+correct}let x=X[q];lastSpeech=round===1?x.sent:x.e;speak(lastSpeech);$("audio").className="audio show";$("msg").textContent="Bravissimo! ✓";next()}else{failed[round+"-"+q]=1;$("drop").className="dropzone bad";$("msg").textContent="Bir daha düşün! ✕";$("msg").className="msg err";setTimeout(()=>{$("drop").className="dropzone";$("msg").textContent="";$("msg").className="msg"},550)}}
function makeBuild(arr){arr.forEach(t=>{let b=document.createElement("div");b.className="chip";b.textContent=t;b.onclick=()=>addPart(b,t);$("bank").appendChild(b)})}
function addPart(el,t){if(locked||placed.length>=3||el.classList.contains("used"))return;placed.push({t,el});el.classList.add("used");paintSlots();if(placed.length===3)checkBuild()}
function removeSlot(i){if(locked||i>=placed.length)return;placed[i].el.classList.remove("used");placed.splice(i,1);paintSlots()}
function paintSlots(){[...$("slots").children].forEach((s,i)=>{s.textContent=placed[i]?placed[i].t:"...";s.className=placed[i]?"slot filled":"slot"})}
function checkBuild(){let x=X[q],ans=placed.map(p=>p.t).join("|"),ok=[x.sub,x.verb,x.comp].join("|");if(ans===ok){locked=true;if(!failed[round+"-"+q])first[round]++;[...$("slots").children].forEach(s=>s.className="slot filled");lastSpeech=x.sent;speak(lastSpeech);$("audio").className="audio show";$("msg").textContent="✓ "+x.sent;next()}else{failed[round+"-"+q]=1;[...$("slots").children].forEach(s=>s.classList.add("bad"));$("msg").textContent="Ardıcıllıq və ya ifadə səhvdir. Yenidən sına!";$("msg").className="msg err";setTimeout(()=>{placed.forEach(p=>p.el.classList.remove("used"));placed=[];paintSlots();$("msg").textContent="";$("msg").className="msg"},750)}}
function next(){$("fill").style.width=((round*10+q+1)/30*100)+"%";setTimeout(()=>{q++;if(q===10){q=0;round++;if(round===3){finish();return}}render()},850)}
function finish(){$("game").style.display="none";$("result").className="result show";let total=first.reduce((a,b)=>a+b,0),p=Math.round(total/30*100);$("pct").textContent=p+"%";$("scoreLine").textContent=total+" / 30 — ilk cəhddə düzgün";for(let i=0;i<3;i++)$("s"+i).textContent=first[i]+"/10"}
function enableDrag(el,onDrop){let drag=null,dx=0,dy=0;el.addEventListener("pointerdown",e=>{if(locked)return;let r=el.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;drag=el;el.setPointerCapture&&el.setPointerCapture(e.pointerId);el.classList.add("dragging");el.style.left=(e.clientX-dx)+"px";el.style.top=(e.clientY-dy)+"px";e.preventDefault()});el.addEventListener("pointermove",e=>{if(!drag)return;el.style.left=(e.clientX-dx)+"px";el.style.top=(e.clientY-dy)+"px";let r=$("drop").getBoundingClientRect(),hot=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;$("drop").classList.toggle("hot",hot)});el.addEventListener("pointerup",e=>{if(!drag)return;let r=$("drop").getBoundingClientRect(),hot=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;el.classList.remove("dragging");el.style.left=el.style.top="";$("drop").classList.remove("hot");drag=null;if(hot)onDrop()})}
$("audio").onclick=()=>speak(lastSpeech);$("restart").onclick=()=>{round=0;q=0;first=[0,0,0];failed={};$("game").style.display="block";$("result").className="result";render()};render()})();
</script></body></html>
