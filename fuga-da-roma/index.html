<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Da Capo | Fuga da Roma — Puzzle Edition</title>
<style>
:root{--g:#123f32;--g2:#2d6b52;--cream:#fbf6e9;--gold:#c6a34c;--ink:#23382f;--mut:#738078;--ok:#2d774e;--bad:#aa5149}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:10px;background:radial-gradient(circle at 50% 0,#e5eee5,transparent 28%),var(--cream);font-family:Arial;color:var(--ink)}
.app{max-width:820px;margin:auto}.brand{text-align:center;color:var(--g)}.brand h1{font:700 29px Georgia;margin:0}.brand small{font-size:9px;letter-spacing:1.5px}
.panel{background:#fffdf8;border:1px solid #dce2da;border-radius:24px;padding:15px;box-shadow:0 12px 30px #17382c10}
.eyebrow{text-align:center;color:var(--gold);font-size:10px;letter-spacing:1.6px;font-weight:900}.title{text-align:center;font:700 27px Georgia;color:var(--g);margin:5px}.sub{text-align:center;color:var(--mut);font-size:12px;line-height:1.45}
.route{display:flex;align-items:center;justify-content:center;margin:14px 0;gap:3px}.stop{width:35px;height:35px;border:2px solid #d2ddd4;border-radius:50%;display:grid;place-items:center;background:#fff}.stop.on{border-color:var(--gold);background:#fbf0d2}.stop.done{background:var(--g);border-color:var(--g);color:white}.line{width:35px;height:2px;background:#d9e0d9}
.place{padding:12px;border-radius:17px;background:linear-gradient(135deg,#edf4ee,#fff8e7);border:1px solid #d9e4da;text-align:center}.place .ico{font-size:39px}.place h2{font:700 21px Georgia;color:var(--g);margin:3px}.mini{font-size:11px;color:var(--mut)}
.card{margin-top:10px;border:1px solid #dbe5dc;border-radius:16px;padding:14px;background:#fff}.q{font:700 18px Georgia;color:var(--g);line-height:1.42;margin:5px 0}.hint{font-size:11px;color:var(--mut);line-height:1.45}.taskno{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1px}
.pool,.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.token{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;border:1px solid #bfcfc2;background:#fff;border-radius:11px;padding:10px 12px;font-weight:900;color:var(--g);box-shadow:0 3px 8px #0000000c;cursor:grab}.token.selected{outline:3px solid #e2c66e;background:#fff9e9}.slot{min-width:105px;min-height:48px;border:2px dashed #bdcbbf;border-radius:12px;background:#f7faf6;padding:5px;display:flex;align-items:center;justify-content:center}.slot.over{border-color:var(--gold);background:#fff8e4}
.binwrap{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.bin{min-height:115px;border:2px dashed #bdcbbf;border-radius:14px;padding:9px;text-align:center;background:#f8faf7}.bin b{color:var(--g);font:700 15px Georgia}.bin .inside{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.check,.next{width:100%;border:0;border-radius:12px;padding:12px;font-weight:900;margin-top:10px}.check{background:var(--g);color:white}.next{display:none;background:var(--gold);color:#17372c}.next.show{display:block}.feedback{margin-top:9px;border-radius:11px;font-size:12px;line-height:1.45}.feedback.show{padding:10px;background:#eef5ef}
.dialog{display:grid;gap:7px;margin-top:11px}.drow{display:grid;grid-template-columns:34px 1fr 38px 38px;align-items:center;gap:5px;background:#f7faf7;border:1px solid #d9e3da;border-radius:11px;padding:6px}.drow span{font-size:12px;font-weight:800}.move{border:0;background:#e7efe8;border-radius:8px;padding:8px;color:var(--g);font-weight:900}
.maze{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.stone{min-height:74px;border:1px solid #cbd8cd;border-radius:12px;background:#fff;padding:7px;font-size:11px;font-weight:900;color:var(--g)}.stone.pick{background:#fff2c9;border:2px solid var(--gold)}.stone.good{background:#e1f0e5}.stone.bad{background:#f9e3df}.path{text-align:center;font-size:11px;color:var(--mut);margin-top:8px}
.result{text-align:center}.pct{font:700 46px Georgia;color:var(--g)}.bars{text-align:left;margin:14px 0}.row{display:grid;grid-template-columns:150px 1fr 42px;gap:7px;align-items:center;margin:8px 0;font-size:11px;font-weight:900}.bar{height:9px;background:#e4ebe5;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--g2),var(--gold))}.restart{border:0;background:var(--g);color:white;border-radius:12px;padding:11px 16px;font-weight:900}
@media(max-width:560px){.binwrap{grid-template-columns:1fr}.maze{grid-template-columns:repeat(2,1fr)}.line{width:18px}.row{grid-template-columns:115px 1fr 35px}.token{padding:9px;font-size:12px}}
</style></head>
<body><main class="app"><header class="brand"><div style="font-size:29px">🌳</div><h1>Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></header>
<section class="panel"><div class="eyebrow">MISSIONE 03 · PUZZLE EDITION</div><div class="title">Fuga da Roma 🇮🇹</div><div class="sub">Test deyil — dil detektividir. Kartları hərəkət etdir, əlaqəni tap, dialoqu qur və düzgün marşrutla Colosseo-dan çıx.</div><div id="route" class="route"></div><div id="stage"></div></section></main>
<script>
(()=>{
const L=[
{name:"Stazione Termini",icon:"🚉",cat:"Pronuncia",tasks:[
{kind:"bins",q:"Sözləri eşidilən başlanğıc səsinə görə iki platformaya ayır.",hint:"S hərfi hər sözdə eyni səslənmir.",bins:["/s/","/z/"],items:[["sera","/s/"],["sole","/s/"],["Svizzero","/z/"],["sbaglio","/z/"],["studente","/s/"],["sveglia","/z/"]]},
{kind:"bins",q:"Sözləri SC səsinə görə düzgün relsə yerləşdir.",hint:"Sonrakı saitə diqqət et.",bins:["/ʃ/ — ş","/sk/"],items:[["scena","/ʃ/ — ş"],["scimmia","/ʃ/ — ş"],["scuola","/sk/"],["scopa","/sk/"],["scelta","/ʃ/ — ş"],["scusa","/sk/"]]},
{kind:"bins",q:"C/G detektivi: sözləri yumşaq və sərt səsə görə ayır.",hint:"E və I çox vaxt səsi dəyişir.",bins:["yumşaq","sərt"],items:[["cena","yumşaq"],["cinema","yumşaq"],["casa","sərt"],["gelato","yumşaq"],["giro","yumşaq"],["gatto","sərt"]]}
]},
{name:"Piazza Navona",icon:"⛲",cat:"Nomi",tasks:[
{kind:"bins",q:"Kartları yalnız cinsinə görə çeşidlə.",hint:"Tək/cəm səni çaşdırmasın.",bins:["Maschile","Femminile"],items:[["libri","Maschile"],["ragazze","Femminile"],["studente","Maschile"],["case","Femminile"],["amici","Maschile"],["studentessa","Femminile"]]},
{kind:"bins",q:"İndi eyni məntiqi say üçün tətbiq et.",hint:"Cinsə yox, tək/cəm formasına bax.",bins:["Singolare","Plurale"],items:[["ragazza","Singolare"],["libri","Plurale"],["casa","Singolare"],["studenti","Plurale"],["amico","Singolare"],["donne","Plurale"]]},
{kind:"order",q:"Transformasiya zəncirini qur: kişi tək → kişi cəm → qadın tək → qadın cəm.",items:["ragazze","ragazzo","ragazzi","ragazza"],answer:["ragazzo","ragazzi","ragazza","ragazze"],why:"ragazzo → ragazzi → ragazza → ragazze"}
]},
{name:"Fontana di Trevi",icon:"🪙",cat:"ESSERE / AVERE",tasks:[
{kind:"match",q:"Personajları vəziyyətlərinə uyğun ifadə ilə cütləşdir.",hint:"Əvvəl mənanı düşün, sonra ESSERE/AVERE-ni.",left:["Marco səhərdən yeməyib","Anna dərsə gec gəlib","Luca işində çox bacarıqlıdır"],right:["è in ritardo","ha fame","è in gamba"],answer:[1,0,2]},
{kind:"bins",q:"İfadələri düzgün fel fəvvarəsinə at.",bins:["ESSERE","AVERE"],items:[["in ritardo","ESSERE"],["fame","AVERE"],["in gamba","ESSERE"],["paura","AVERE"],["al verde","ESSERE"],["ragione","AVERE"]]},
{kind:"match",q:"Mübtəda + vəziyyətə uyğun tam formaları tap.",left:["Noi + paura","Voi + in ritardo","Loro + sonno"],right:["avete paura","hanno sonno","abbiamo paura","siete in ritardo"],answer:[2,3,1]}
]},
{name:"Pantheon",icon:"🏛️",cat:"Domande & Dialogo",tasks:[
{kind:"order",q:"Marco və Leyla ilk dəfə tanış olurlar. Replikaları təbii dialoq ardıcıllığına sal.",hint:"Kim danışır göstərilib. Əvvəl salamlaşırlar, sonra adlarını və haralı olduqlarını soruşurlar, sonda sağollaşırlar.",items:["👩 Leyla: Sono di Baku.","👨 Marco: A presto, Leyla!","👨 Marco: Buongiorno! Mi chiamo Marco. Come ti chiami?","👩 Leyla: Mi chiamo Leyla. Piacere!","👨 Marco: Piacere! Di dove sei?","👩 Leyla: A presto, Marco!"],answer:["👨 Marco: Buongiorno! Mi chiamo Marco. Come ti chiami?","👩 Leyla: Mi chiamo Leyla. Piacere!","👨 Marco: Piacere! Di dove sei?","👩 Leyla: Sono di Baku.","👨 Marco: A presto, Leyla!","👩 Leyla: A presto, Marco!"],why:"Marco salamlaşır və adını soruşur → Leyla özünü təqdim edir → Marco haralı olduğunu soruşur → Leyla cavab verir → qarşılıqlı sağollaşırlar."},
{kind:"match",q:"Hər cavabı ona uyğun TAM SUAL ilə cütləşdir.",hint:"Cavabın hansı məlumatı verdiyini düşün: mənşə, hal-əhval, yoxsa yaş?",left:["🇦🇿 Sono di Baku.","😊 Sto bene, grazie.","🎂 Ho 20 anni."],right:["Come stai?","Quanti anni hai?","Di dove sei?","Chi sei?"],answer:[2,0,1]},
{kind:"match",q:"Hər situasiyada deyəcəyin ifadəni seç.",hint:"Vaxta və görüşün davam edib-etməyəcəyinə diqqət et.",left:["🕣 Saat 08:30-dur. Müəlliminlə ilk dəfə bu gün qarşılaşırsan.","🌙 Saat 23:30-dur. Dostun yatmağa gedir.","📅 Bu gün sağollaşırsınız və sabah yenidən görüşəcəksiniz."],right:["A domani!","Buonanotte!","Buongiorno!","A dopo!"],answer:[2,1,0]}
]},
{name:"Colosseo",icon:"🏟️",cat:"Boss Puzzle",tasks:[
{kind:"maze",q:"START-dan EXIT-ə yalnız düzgün italyanca daşları seçərək get. Düzgün 4 daşı ardıcıllıqla seç.",stones:[["Ho fame.",1],["Sono fame.",0],["Siamo paura.",0],["Abbiamo paura.",1],["Voi siete in ritardo.",1],["Voi avete in ritardo.",0],["Loro hanno sonno.",1],["Loro sono sonno.",0]],answer:["Ho fame.","Abbiamo paura.","Voi siete in ritardo.","Loro hanno sonno."]},
{kind:"match",q:"Üç ipucunu oxu və hər personajın vəziyyətini çıxar.",hint:"Marco yeməyib. Giulia 20 dəqiqə gec gəlib. Paolo “Roma è la capitale d'Italia” deyir.",left:["Marco","Giulia","Paolo"],right:["ha ragione","ha fame","è in ritardo"],answer:[1,2,0]},
{kind:"order",q:"Final şifrə: sözləri elə düz ki, düzgün italyanca cümlə alınsın.",items:["voglia","Noi","Italia","di","andare","abbiamo","in"],answer:["Noi","abbiamo","voglia","di","andare","in","Italia"],why:"Noi abbiamo voglia di andare in Italia."}
]}];
let lv=0,ti=0,score=0,first=true,section={};L.forEach(x=>section[x.cat]=0);
const st=document.getElementById("stage"),rt=document.getElementById("route");
function route(){rt.innerHTML=L.map((x,i)=>`${i?'<div class="line"></div>':''}<div class="stop ${i<lv?'done':i===lv?'on':''}">${i<lv?'✓':x.icon}</div>`).join("")}
function intro(){route();let l=L[lv];st.innerHTML=`<div class="place"><div class="ico">${l.icon}</div><h2>${l.name}</h2><div class="mini">${l.cat} · 3 puzzle</div></div><div class="card" style="text-align:center"><div class="q">${lv===0?'Bilet parçalarını toplamaq üçün ilk dil tapmacasını həll et.':'Növbəti Roma qapısı açıldı.'}</div><button class="check" id="go">Puzzle-a başla →</button></div>`;go.onclick=()=>{ti=0;render()}}
function shell(t,body){let l=L[lv];st.innerHTML=`<div class="place"><div class="ico">${l.icon}</div><h2>${l.name}</h2><div class="mini">${l.cat} · Puzzle ${ti+1}/3</div></div><div class="card"><div class="taskno">PUZZLE ${ti+1} / 3</div><div class="q">${t.q}</div>${t.hint?`<div class="hint">💡 ${t.hint}</div>`:""}${body}<div id="fb" class="feedback"></div><button id="check" class="check">✓ Yoxla</button><button id="next" class="next">${ti===2?'Qapını aç →':'Növbəti puzzle →'}</button></div>`}
function token(txt){return `<button class="token" data-v="${txt}">${txt}</button>`}
function render(){route();first=true;let t=L[lv].tasks[ti];if(t.kind==="bins") bins(t);if(t.kind==="order") order(t);if(t.kind==="match") match(t);if(t.kind==="maze") maze(t)}
function bindMovables(){
 let sel=null;
 document.querySelectorAll(".token").forEach(x=>{
   x.onclick=()=>{document.querySelectorAll(".token").forEach(z=>z.classList.remove("selected"));sel=x;x.classList.add("selected")};
   x.draggable=true;x.ondragstart=e=>e.dataTransfer.setData("text/plain",x.dataset.v);
 });
 document.querySelectorAll("[data-drop]").forEach(d=>{
   d.ondragover=e=>{e.preventDefault();d.classList.add("over")};d.ondragleave=()=>d.classList.remove("over");
   d.ondrop=e=>{e.preventDefault();d.classList.remove("over");let v=e.dataTransfer.getData("text/plain"),x=[...document.querySelectorAll(".token")].find(z=>z.dataset.v===v);if(x)d.querySelector(".inside")?d.querySelector(".inside").appendChild(x):d.appendChild(x)};
   d.onclick=e=>{if(sel && !e.target.classList.contains("token")){(d.querySelector(".inside")||d).appendChild(sel);sel.classList.remove("selected");sel=null}}
 });
}
function bins(t){shell(t,`<div class="pool" data-drop="pool"><div class="inside">${shuffle(t.items.map(x=>token(x[0]))).join("")}</div></div><div class="binwrap">${t.bins.map(b=>`<div class="bin" data-drop="${b}"><b>${b}</b><div class="inside"></div></div>`).join("")}</div>`);bindMovables();check.onclick=()=>{let ok=t.items.every(([w,b])=>document.querySelector(`[data-drop="${css(b)}"] .token[data-v="${css(w)}"]`));finish(ok,"Bütün kartların dil qaydasına görə düzgün qruplaşdırılması tələb olunur.")}}
function order(t){shell(t,`<div class="hint">Kartlara toxunub seç, sonra boş sahəyə toxun; kompüterdə sürükləmək də olar.</div><div class="pool" data-drop="pool"><div class="inside">${shuffle(t.items.map(token)).join("")}</div></div><div class="slots" data-drop="order"><div class="inside" style="display:flex;flex-wrap:wrap;gap:7px;min-height:55px;width:100%;justify-content:center"></div></div>`);bindMovables();check.onclick=()=>{let a=[...document.querySelector('[data-drop="order"] .inside').children].map(x=>x.dataset.v);finish(JSON.stringify(a)===JSON.stringify(t.answer),t.why||"Ardıcıllığı yenidən yoxla.")}}
function match(t){shell(t,`<div style="display:grid;gap:9px;margin-top:12px">${t.left.map((x,i)=>`<div style="background:#f7faf7;border-radius:12px;padding:9px"><b style="font-size:12px">${i+1}. ${x}</b><div class="slots" data-drop="m${i}"><div class="inside" style="min-height:40px"></div></div></div>`).join("")}</div><div class="pool" data-drop="pool"><div class="inside">${shuffle(t.right.map(token)).join("")}</div></div>`);bindMovables();check.onclick=()=>{let ok=t.left.every((_,i)=>{let el=document.querySelector(`[data-drop="m${i}"] .token`);return el&&el.dataset.v===t.right[t.answer[i]]});finish(ok,"Məna, şəxs və düzgün fel formasını birlikdə düşün.")}}
function maze(t){shell(t,`<div class="maze">${t.stones.map(([x])=>`<button class="stone" data-v="${x}">${x}</button>`).join("")}</div><div class="path">Seçdiyin yol: <b id="pth">—</b></div>`);let picks=[];document.querySelectorAll(".stone").forEach(b=>b.onclick=()=>{if(b.classList.contains("pick")){b.classList.remove("pick");picks=picks.filter(x=>x!==b.dataset.v)}else if(picks.length<4){b.classList.add("pick");picks.push(b.dataset.v)}pth.textContent=picks.join(" → ")||"—"});check.onclick=()=>finish(JSON.stringify(picks)===JSON.stringify(t.answer),"Düzgün yol AVERE/ESSERE ifadələrini və şəxs formalarını eyni anda yoxlayır.")}
function finish(ok,msg){let f=document.getElementById("fb");if(ok){f.className="feedback show";f.innerHTML="✅ <b>Puzzle həll edildi!</b> "+msg;if(first){score++;section[L[lv].cat]++}document.getElementById("check").disabled=true;document.getElementById("next").classList.add("show");next.onclick=()=>{if(ti<2){ti++;render()}else{lv++;if(lv<L.length)intro();else results()}}}else{first=false;f.className="feedback show";f.innerHTML="❌ Hələ açılmadı. "+msg+" İlk cəhd xalı itirildi, amma puzzle-ı həll edib davam edə bilərsən."}}
function results(){rt.innerHTML=L.map((x,i)=>`${i?'<div class="line"></div>':''}<div class="stop done">✓</div>`).join("");let pct=Math.round(score/15*100);st.innerHTML=`<div class="result"><div style="font-size:55px">🏟️🔓</div><div class="eyebrow">FUGA COMPLETATA</div><h2 style="font:700 27px Georgia;color:var(--g)">Sei uscito da Roma!</h2><div class="pct">${score}/15</div><div class="sub">${pct}% · ilk cəhddə həll edilən puzzle-lar</div><div class="bars">${L.map(l=>`<div class="row"><span>${l.cat}</span><div class="bar"><div class="fill" style="width:${section[l.cat]/3*100}%"></div></div><span>${section[l.cat]}/3</span></div>`).join("")}</div><div class="card" style="text-align:left;font-size:12px;line-height:1.5"><b>🌱 Nəticə</b><br>${diag()}</div><button class="restart" onclick="location.reload()">↻ Yenidən oyna</button></div>`}
function diag(){let a=Object.entries(section).sort((x,y)=>x[1]-y[1]),lo=a[0],hi=a[a.length-1];return lo[1]===3?"Bütün bölmələrdə 3/3 — bütün qapıları ilk cəhddə açdın.":`Ən güclü sahə: <b>${hi[0]} (${hi[1]}/3)</b>.<br>Təkrar üçün prioritet: <b>${lo[0]} (${lo[1]}/3)</b>.`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function css(s){return CSS.escape(s)}
intro();
})();
</script></body></html>
