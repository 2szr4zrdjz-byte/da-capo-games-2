<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo — Verbi Irregolari 2</title><style>
:root{--green:#164936;--gold:#d8b447;--cream:#faf8ee;--ink:#20392d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif}.wrap{max-width:870px;margin:auto;padding:14px}header{background:var(--green);color:#fff;border-radius:23px;padding:24px}h1,h2{font-family:Georgia,serif;margin:6px 0}h1{font-size:clamp(28px,5vw,44px)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tabs button{flex:1;min-width:100px;font-size:13px}.card{background:#fff;border:1px solid #e4e5d8;border-radius:19px;padding:23px;margin:12px 0}button{border:1px solid #b8cdbf;background:#fff;color:var(--green);font:inherit;font-weight:700;padding:10px 14px;border-radius:12px;cursor:pointer}button.primary,.tabs .active{background:var(--green);color:white}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{padding:15px;text-align:left}.option.selected{outline:3px solid var(--gold);background:#fff8db}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#63786c}.question{font-size:clamp(20px,4vw,27px);font-weight:750;margin:20px 0}.bar{background:#e5ece5;border-radius:10px;height:9px;overflow:hidden;margin:13px 0}.bar>div{background:var(--gold);height:100%}input{font:inherit;font-size:19px;border:2px solid #b8cdbf;border-radius:12px;padding:12px;width:100%}.feedback{padding:14px;border-radius:12px;background:#edf6eb;margin:13px 0}.feedback.bad{background:#fff0e9}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #e5e9e2;padding:10px;text-align:left}th{background:#f3f5e9}td:first-child{font-weight:750}.speak{padding:5px 9px;font-size:15px}.note{padding:12px;background:#f3f7ef;border-radius:12px;margin:10px 0}.tag{font-size:12px;letter-spacing:.05em;font-weight:800;color:#6d806e}.dialog{background:#f4f7f0;border-radius:16px;padding:13px;margin:9px 0}.dialog.mine{background:#fff7df}.dialog b{display:block;color:var(--green)}@media(max-width:560px){.card{padding:15px}.grid{grid-template-columns:1fr}.tabs button{min-width:90px;padding:9px 5px}}
</style></head><body><div class="wrap"><header><div>🌱 DA CAPO · A1</div><h1>VERBI IRREGOLARI (2)</h1><div>Dare · Sapere · Stare · Uscire · Fare · Giocare</div><div>5 mərhələ · 36 forma · real cümlələr · interaktiv dialoq</div></header><div id="tabs" class="tabs"></div><main id="app"></main></div><script>
const verbs={dare:{az:'vermək',forms:['do','dai','dà','diamo','date','danno'],sample:'Ti do un libro.'},sapere:{az:'bilmək',forms:['so','sai','sa','sappiamo','sapete','sanno'],sample:'So la risposta.'},stare:{az:'olmaq / vəziyyətdə olmaq',forms:['sto','stai','sta','stiamo','state','stanno'],sample:'Come stai?'},uscire:{az:'çıxmaq / bayıra çıxmaq',forms:['esco','esci','esce','usciamo','uscite','escono'],sample:'Esco alle otto.'},fare:{az:'etmək / görmək',forms:['faccio','fai','fa','facciamo','fate','fanno'],sample:'Faccio i compiti.'},giocare:{az:'oynamaq',forms:['gioco','giochi','gioca','giochiamo','giocate','giocano'],sample:'Giochiamo a calcio.'}};
const persons=['io','tu','lui/lei/Lei','noi','voi','loro'];const keys=Object.keys(verbs);const titles=['1 · Mənalar','2 · Hallanma','3 · Yazılı məşq','4 · Cümlələr','5 · Dialoq'];let stage=0,idx=0,score=0,answered=false,choice='',mistakes=[],pool=[],review=false,shown={},dialogStep=0,dialogHistory=[];
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.85;u.voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('it'))||null;speechSynthesis.speak(u)}
function audio(t){return '<button class="speak" data-say="'+t.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">🔊</button>'}function bindAudio(){document.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.say)})}
const meanings=keys.map(k=>({q:k,answer:verbs[k].az,opts:shuffle(keys.map(v=>verbs[v].az)),ex:'«'+k+'» — '+verbs[k].az+'. '+verbs[k].sample,type:'mcq'}));
const conjugations=[];keys.forEach(k=>persons.forEach((p,i)=>conjugations.push({q:p+' + '+k,answer:verbs[k].forms[i],ex:p+' + '+k+' → '+verbs[k].forms[i],verb:k,person:i,type:'type'})));
const sentences=[
['Io ___ un regalo a Sara. (dare)','do','Mən Saraya hədiyyə verirəm.'],['Tu ___ una mano a Luca? (dare)','dai','Sən Lukaya kömək edirsən?'],['Marta ___ il quaderno a Paolo. (dare)','dà','Marta dəftəri Paoloya verir.'],['Noi ___ una risposta. (dare)','diamo','Biz cavab veririk.'],['Voi ___ i libri agli studenti. (dare)','date','Siz kitabları tələbələrə verirsiniz.'],['I genitori ___ un consiglio. (dare)','danno','Valideynlər məsləhət verirlər.'],
['Io non ___ la risposta. (sapere)','so','Mən cavabı bilmirəm.'],['Tu ___ parlare italiano? (sapere)','sai','Sən italyanca danışmağı bacarırsan?'],['Giulia ___ dove abito. (sapere)','sa','Culiya harada yaşadığımı bilir.'],['Noi ___ tutto. (sapere)','sappiamo','Biz hər şeyi bilirik.'],['Voi ___ la verità? (sapere)','sapete','Siz həqiqəti bilirsiniz?'],['Loro ___ la notizia. (sapere)','sanno','Onlar xəbəri bilirlər.'],
['Io ___ bene, grazie. (stare)','sto','Mən yaxşıyam, sağ ol.'],['Come ___ oggi? (tu, stare)','stai','Bu gün necəsən?'],['Mio fratello ___ male. (stare)','sta','Qardaşım özünü pis hiss edir.'],['Noi ___ a casa oggi. (stare)','stiamo','Biz bu gün evdəyik.'],['Come ___ ragazzi? (voi, stare)','state','Uşaqlar, necəsiniz?'],['I bambini ___ bene. (stare)','stanno','Uşaqlar yaxşıdırlar.'],
['Io ___ dopo cena. (uscire)','esco','Mən şam yeməyindən sonra çıxıram.'],['Tu ___ con noi? (uscire)','esci','Sən bizimlə çıxırsan?'],['Marco ___ alle sette. (uscire)','esce','Marko saat yeddidə çıxır.'],['Noi ___ insieme. (uscire)','usciamo','Biz birlikdə çıxırıq.'],['Voi ___ stasera? (uscire)','uscite','Siz bu axşam çıxırsınız?'],['I miei amici ___ spesso. (uscire)','escono','Dostlarım tez-tez bayıra çıxırlar.'],
['Io ___ colazione alle otto. (fare)','faccio','Mən saat səkkizdə səhər yeməyi yeyirəm.'],['Tu ___ sport? (fare)','fai','Sən idman edirsən?'],['Anna ___ una torta. (fare)','fa','Anna tort hazırlayır.'],['Noi ___ una passeggiata. (fare)','facciamo','Biz gəzintiyə çıxırıq.'],['Voi ___ i compiti? (fare)','fate','Siz ev tapşırığını edirsiniz?'],['Loro ___ una festa. (fare)','fanno','Onlar şənlik təşkil edirlər.'],
['Io ___ a tennis. (giocare)','gioco','Mən tennis oynayıram.'],['Tu ___ a calcio? (giocare)','giochi','Sən futbol oynayırsan?'],['Elena ___ a pallavolo. (giocare)','gioca','Elena voleybol oynayır.'],['Noi ___ a carte. (giocare)','giochiamo','Biz kart oynayırıq.'],['Voi ___ a scacchi? (giocare)','giocate','Siz şahmat oynayırsınız?'],['I ragazzi ___ a basket. (giocare)','giocano','Uşaqlar basketbol oynayırlar.']].map(([q,answer,az])=>({q,answer,ex:az,type:'type'}));
const dialog=[
{who:'Giulia',say:'Ciao! Come stai oggi?',az:'Salam! Bu gün necəsən?',q:'Giulia soruşur: «Come stai?» Sən necə cavab verərsən?',opts:['Sto bene, grazie!','So bene, grazie!','Do bene, grazie!'],answer:'Sto bene, grazie!',ex:'Sto — stare feilinin io forması.'},
{who:'Giulia',say:'Che cosa fai oggi pomeriggio?',az:'Bu gün günortadan sonra nə edirsən?',q:'«Mən ev tapşırıqlarımı edirəm» de.',opts:['Faccio i compiti.','Fa i compiti.','Fai i compiti.'],answer:'Faccio i compiti.',ex:'Io faccio — fare.'},
{who:'Giulia',say:'Sai giocare a tennis?',az:'Tennis oynamağı bacarırsan?',q:'«Bəli, tennis oynamağı bacarıram» de.',opts:['Sì, so giocare a tennis.','Sì, sa giocare a tennis.','Sì, sai giocare a tennis.'],answer:'Sì, so giocare a tennis.',ex:'Io so — sapere.'},
{who:'Giulia',say:'A che ora esci di casa?',az:'Evdən saat neçədə çıxırsan?',q:'«Saat beşdə çıxıram» de.',opts:['Esco alle cinque.','Esce alle cinque.','Esci alle cinque.'],answer:'Esco alle cinque.',ex:'Io esco — uscire.'},
{who:'Giulia',say:'Mi dai il tuo numero di telefono?',az:'Mənə telefon nömrəni verərsən?',q:'«Bəli, sənə nömrəmi verirəm» de.',opts:['Sì, ti do il mio numero.','Sì, ti dà il mio numero.','Sì, ti dai il mio numero.'],answer:'Sì, ti do il mio numero.',ex:'Io do — dare.'},
{who:'Giulia',say:'Domani giochiamo a calcio con gli amici. Vieni?',az:'Sabah dostlarla futbol oynayırıq. Gəlirsən?',q:'«Bəli, mən də oynayıram!» de.',opts:['Sì, gioco anch’io!','Sì, giochi anch’io!','Sì, gioca anch’io!'],answer:'Sì, gioco anch’io!',ex:'Io gioco — giocare; tu giochi formasında h var.'}
];
function tab(){document.getElementById('tabs').innerHTML=titles.map((t,i)=>'<button class="'+(stage===i?'active':'')+'" data-stage="'+i+'">'+t+'</button>').join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>start(+b.dataset.stage))}
function start(s,custom){stage=s;idx=0;score=0;answered=false;choice='';mistakes=[];review=!!custom;dialogStep=0;dialogHistory=[];pool=custom|| (s===0?shuffle(meanings):s===2?shuffle(conjugations):s===3?shuffle(sentences):[]);render()}
function render(){tab();if(stage===1)return tableView();if(stage===4)return dialogView();if(idx>=pool.length)return finish();let q=pool[idx],app=document.getElementById('app');app.innerHTML='<section class="card"><div class="row between"><span class="tag">'+titles[stage]+(review?' · Səhvlərin təkrarı':'')+'</span><b>'+(idx+1)+' / '+pool.length+'</b></div><div class="bar"><div style="width:'+(idx/pool.length*100)+'%"></div></div><div class="muted">'+(stage===0?'Feilin Azərbaycan dilində mənasını seç':stage===2?'Şəxsə uyğun formanı yaz':'Cümləni düzgün feillə tamamla')+'</div><div class="question">'+q.q+'</div><div id="response"></div><div id="feedback"></div><div class="row" style="margin-top:15px"><button class="primary" id="check">Yoxla</button><button id="next" disabled>Növbəti →</button>'+(stage!==0?'<button id="listen">🔊 Dinlə</button>':'')+'</div></section>';if(q.type==='mcq'){document.getElementById('response').className='grid';document.getElementById('response').innerHTML=q.opts.map((x,i)=>'<button class="option" data-opt="'+i+'">'+x+'</button>').join('');document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(answered)return;choice=q.opts[+b.dataset.opt];document.querySelectorAll('[data-opt]').forEach(c=>c.classList.toggle('selected',b===c))})}else{document.getElementById('response').innerHTML='<input id="entry" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="İtalyanca cavabı yaz...">';document.getElementById('entry').onkeydown=e=>{if(e.key==='Enter')answered?next():check()}}document.getElementById('check').onclick=check;document.getElementById('next').onclick=next;if(document.getElementById('listen'))document.getElementById('listen').onclick=()=>say(q.q.replace('___',q.answer).replace(/\([^)]*\)/g,''))}
function check(){if(answered)return;let q=pool[idx],value=q.type==='mcq'?choice:document.getElementById('entry').value.trim();if(!value){document.getElementById('feedback').innerHTML='<div class="feedback bad">Əvvəl cavab ver.</div>';return}answered=true;let ok=norm(value)===norm(q.answer);if(ok)score++;else mistakes.push(q);document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'':'bad')+'"><b>'+(ok?'✅ Bravissimo!':'❌ Düzgün cavab: '+q.answer)+'</b><div>'+q.ex+'</div>'+(stage!==0?audio(q.answer):'')+'</div>';document.getElementById('check').disabled=true;document.getElementById('next').disabled=false;bindAudio()}
function next(){idx++;choice='';answered=false;render()}
function finish(){document.getElementById('app').innerHTML='<section class="card"><h2>🎉 Raund tamamlandı!</h2><div class="question">'+score+' / '+pool.length+' · '+Math.round(score/pool.length*100)+'%</div><p>Yanlış cavablar: '+mistakes.length+'</p><div class="row"><button class="primary" id="again">Yenidən oyna</button><button id="retry" '+(mistakes.length?'':'disabled')+'>Səhvləri təkrarla</button><button id="forward">Növbəti mərhələ →</button></div></section>';document.getElementById('again').onclick=()=>start(stage);document.getElementById('retry').onclick=()=>start(stage,[...mistakes]);document.getElementById('forward').onclick=()=>start(Math.min(4,stage+1))}
function tableView(){let app=document.getElementById('app');app.innerHTML='<section class="card"><h2>Hallanmanı öyrən və dinlə</h2><p class="muted">Hər feilin bütün 6 formasını gör. İstədiyin formanı dinlə və ucadan təkrar et.</p><div class="row" id="verbButtons">'+keys.map(k=>'<button data-verb="'+k+'" class="'+(shown.current===k?'primary':'')+'">'+k+'</button>').join('')+'</div><div id="table"></div><div class="note"><b>Diqqət:</b> <i>dare</i> feilinin üçüncü şəxs tək forması <b>dà</b> yazılır. <i>Giocare</i> müntəzəm feildir, lakin <b>giochi</b> və <b>giochiamo</b> formalarında sərt «g» səsini saxlamaq üçün <b>h</b> yazılır.</div><button class="primary" id="forward">Hallanma məşqinə keç →</button></section>';document.querySelectorAll('[data-verb]').forEach(b=>b.onclick=()=>{shown.current=b.dataset.verb;tableView()});let k=shown.current||'dare';document.getElementById('table').innerHTML='<h2>'+k+' — '+verbs[k].az+'</h2><table><thead><tr><th>Şəxs</th><th>Forma</th><th>Dinlə</th></tr></thead><tbody>'+persons.map((p,i)=>'<tr><td>'+p+'</td><td><b>'+verbs[k].forms[i]+'</b></td><td>'+audio((i===2?'lei':p)+' '+verbs[k].forms[i])+'</td></tr>').join('')+'</tbody></table><p>'+verbs[k].sample+' '+audio(verbs[k].sample)+'</p>';document.getElementById('forward').onclick=()=>start(2);bindAudio()}
function dialogView(){let app=document.getElementById('app');if(dialogStep>=dialog.length){app.innerHTML='<section class="card"><h2>🎉 Dialogo completato!</h2><div class="question">'+score+' / '+dialog.length+'</div><p>Bütün altı feildən istifadə etdiyin dialoqu tamamladın!</p><div class="row"><button class="primary" id="again">Dialoqu yenidən başla</button><button id="hear">🔊 Dialoqu dinlə</button></div><div id="transcript">'+dialog.map((d,i)=>'<div class="dialog"><b>Giulia:</b>'+d.say+'<br><b>Tu:</b>'+d.answer+'</div>').join('')+'</div></section>';document.getElementById('again').onclick=()=>start(4);document.getElementById('hear').onclick=()=>{let text=dialog.map(d=>d.say+' '+d.answer).join('. ');say(text)};return}let d=dialog[dialogStep];app.innerHTML='<section class="card"><div class="row between"><span class="tag">INTERACTIVE DIALOGO</span><b>'+(dialogStep+1)+' / '+dialog.length+'</b></div><div class="bar"><div style="width:'+(dialogStep/dialog.length*100)+'%"></div></div><div id="history">'+dialogHistory.map(h=>'<div class="dialog"><b>Giulia</b>'+h.say+'<br><b>Sən</b>'+h.answer+'</div>').join('')+'</div><div class="dialog"><b>👩 Giulia '+audio(d.say)+'</b><div class="question" style="margin:7px 0">'+d.say+'</div><span class="muted">'+d.az+'</span></div><div class="note">'+d.q+'</div><div class="grid" id="response">'+shuffle(d.opts).map((x,i)=>'<button class="option" data-opt="'+i+'">'+x+' '+audio(x)+'</button>').join('')+'</div><div id="feedback"></div><div class="row" style="margin-top:15px"><button class="primary" id="check">Cavabla</button><button id="next" disabled>Davam et →</button></div></section>';document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=e=>{if(answered||e.target.closest('[data-say]'))return;choice=b.textContent.replace(' 🔊','').trim();document.querySelectorAll('[data-opt]').forEach(c=>c.classList.toggle('selected',b===c))});document.getElementById('check').onclick=()=>{if(!choice||answered)return;answered=true;let ok=norm(choice)===norm(d.answer);if(ok)score++;document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'':'bad')+'"><b>'+(ok?'✅ Düzdür!':'❌ Düzgün cavab: '+d.answer)+'</b><p>'+d.ex+'</p>'+audio(d.answer)+'</div>';document.getElementById('check').disabled=true;document.getElementById('next').disabled=false;bindAudio()};document.getElementById('next').onclick=()=>{dialogHistory.push({say:d.say,answer:d.answer});dialogStep++;answered=false;choice='';dialogView()};bindAudio()}
start(0);
</script></body></html>
