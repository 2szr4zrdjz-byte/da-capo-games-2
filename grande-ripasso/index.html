<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo | Grande Ripasso</title>
<style>:root{--g:#0b4f35;--c:#fbf7ec;--gold:#d8b552;--ok:#28794e;--bad:#ad5048}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;padding:9px;background:radial-gradient(circle at 8% 2%,#e5efe5,transparent 28%),var(--c);font-family:Arial;color:#17362b}.app{max-width:760px;margin:auto}.brand{text-align:center;color:var(--g)}h1{font:700 31px Georgia;margin:0}.brand small{font-size:10px;letter-spacing:1.5px}h2{text-align:center;font:700 27px Georgia;color:var(--g);margin:13px 0 3px}.sub{text-align:center;color:#718078;font-size:12px;margin-bottom:12px}.panel{background:#fffdf8;border:1px solid #dce5dc;border-radius:24px;padding:15px;box-shadow:0 12px 30px #17362b12}.top{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.badge{background:#edf5ee;padding:7px 10px;border-radius:99px}.bar{height:7px;background:#e8eee8;border-radius:8px;overflow:hidden;margin:12px 0 17px}.fill{height:100%;background:linear-gradient(90deg,#28654e,var(--gold));transition:.3s}.title{text-align:center;font:700 21px Georgia;color:var(--g)}.ins{text-align:center;color:#718078;font-size:12px;margin:5px 0 13px}.q{background:#f4f8f3;border:1px solid #d9e6db;border-radius:18px;padding:18px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center}.big{font:700 21px Georgia;color:var(--g);line-height:1.4}.az{font-size:13px;color:#66766d;margin-top:8px;line-height:1.45}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.opt{border:1px solid #c8d9cc;background:#fff;color:var(--g);border-radius:13px;padding:12px 8px;font-weight:900;cursor:pointer;min-height:48px}.ok{background:#e4f3e8!important;color:var(--ok)!important}.bad{background:#fae8e5!important;color:var(--bad)!important}.fb{margin-top:10px;border-radius:13px;padding:0;text-align:left;font-size:12px;line-height:1.5;min-height:25px}.fb.good,.fb.wrong{padding:11px}.good{background:#eaf5ed;color:var(--ok)}.wrong{background:#fff0ed;color:#8f4039}.fb b{display:block;margin-bottom:3px}.audio{border:0;background:var(--g);color:#fff;border-radius:9px;padding:7px 9px;font-weight:900;margin-top:6px}.answer{width:100%;border:2px solid #bfd2c3;border-radius:14px;padding:14px;font-size:17px;outline:none;margin-top:12px;color:#17362b}.answer:focus{border-color:var(--g)}.keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:9px 0}.key,.check{border:1px solid #c8d9cc;background:#fff;color:var(--g);border-radius:9px;padding:8px 11px;font-weight:900;cursor:pointer}.check{display:block;width:100%;background:var(--g);color:#fff;border:0;padding:12px}.hintbox{background:#f8f2df;border:1px solid #ead9a3;border-radius:12px;padding:9px;margin-top:9px;font-size:11px;color:#715d25}.result{text-align:center}.pct{font:700 50px Georgia;color:var(--g)}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}.mini{background:#f0f5f0;border-radius:11px;padding:8px;font-size:9px}.mini b{display:block;font-size:16px;color:var(--g)}.restart,.nextbtn{border:0;background:var(--g);color:#fff;border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer}.nextbtn{display:block;width:100%;margin-top:10px}@media(max-width:540px){.rounds{grid-template-columns:1fr 1fr}.big{font-size:19px}.opt{font-size:13px}}</style></head><body><main class="app"><header class="brand"><div style="font-size:33px">🌳</div><h1>Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></header><h2>Grande Ripasso 🇮🇹</h2><div class="sub">5 round · 50 challenge · ESSERE + AVERE + nomi</div><section class="panel"><div class="top"><span id="badge" class="badge"></span><span id="score">0 / 50</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="game"></div></section></main>
<script>
const R1=[["La ragazza è italiana.","VERO","“La ragazza” qadın cinsi təkdir; buna görə “è italiana” uyğunlaşması düzgündür."],["I libro sono nuovi.","FALSO","“Libro” kişi cinsi təkdir. Cəmdə “libri” olur: “I libri sono nuovi.”"],["Marco e Luca sono studenti.","VERO","İki şəxs cəmdir, buna görə ESSERE-nin “sono” forması düzgündür."],["Ho fame.","VERO","“Avere fame” sabit ifadədir. “Mən acam” italyancada “Ho fame” deyilir."],["Sono sete.","FALSO","“Sete” ESSERE ilə yox, AVERE ilə işlənir: “Ho sete.”"],["Le case sono grandi.","VERO","“Casa → case” qadın cinsi cəmdir; “le” və “sono grandi” düzgün uyğunlaşıb."],["La studenti è brava.","FALSO","“Studenti” cəmdir və “la” ilə işlənmir. Bir qadın tələbə üçün: “La studentessa è brava.”"],["Noi abbiamo sonno.","VERO","“Avere sonno” ifadəsində “noi” üçün AVERE forması “abbiamo”dur."],["Giulia ha freddo.","VERO","“Avere freddo” = üşümək. Giulia üçün “ha” düzgün formadır."],["Loro ha paura.","FALSO","“Loro” cəmdir; AVERE forması “hanno” olmalıdır: “Loro hanno paura.”"]];
const R2=[["ragazza","👧","tək","Qadın adı bildirir və -a ilə bitən tək formadır."],["libri","👦👦👦","cəm","“Libro”nun cəmidir: libro → libri. Kişi cinsi cəm."],["studente","👦","tək","“Studente” burada kişi cinsi tək formadır."],["case","👧👧👧","cəm","Casa → case. Qadın cinsi cəm."],["amico","👦","tək","Amico kişi cinsi tək isimdir."],["donne","👧👧👧","cəm","Donna → donne. Qadın cinsi cəm."],["ragazzi","👦👦👦","cəm","Ragazzo → ragazzi. Kişi cinsi cəm."],["scuola","👧","tək","Scuola qadın cinsi tək isimdir."],["quaderni","👦👦👦","cəm","Quaderno → quaderni. Kişi cinsi cəm."],["studentessa","👧","tək","Studentessa qadın cinsi tək formadır."]];
const R3=[[["fame","sete","sonno","in ritardo"],"in ritardo","“Fame, sete, sonno” AVERE ilə işlənir: avere fame/sete/sonno. “In ritardo” isə ESSERE ilə: essere in ritardo."],[["ragazzi","studenti","libri","ragazze"],"ragazze","“Ragazzi, studenti, libri” kişi cinsi cəmdir. “Ragazze” qadın cinsi cəmdir."],[["paura","freddo","caldo","in gamba"],"in gamba","“Paura, freddo, caldo” AVERE ilə işlənir. “In gamba” ESSERE ilə işlənir."],[["casa","ragazza","scuola","libro"],"libro","“Casa, ragazza, scuola” qadın cinsi təkdir. “Libro” kişi cinsi təkdir."],[["sono","sei","siamo","hanno"],"hanno","“Sono, sei, siamo” ESSERE formalarıdır. “Hanno” AVERE felinin loro formasıdır."],[["ho","hai","ha","siete"],"siete","“Ho, hai, ha” AVERE formalarıdır. “Siete” ESSERE felinin voi formasıdır."],[["donne","case","ragazze","amici"],"amici","İlk üç söz qadın cinsi cəmdir. “Amici” kişi cinsi cəmdir."],[["ragione","torto","fame","a posto"],"a posto","“Avere ragione/torto/fame” AVERE ilədir. “Essere a posto” isə ESSERE ilə işlənir."],[["libro","amico","studente","case"],"case","İlk üç söz kişi cinsi təkdir. “Case” qadın cinsi cəmdir."],[["in ritardo","in gamba","al verde","sete"],"sete","İlk üç ifadə ESSERE ilə işlənir. “Sete” isə AVERE ilə: avere sete."]];
const R4=[["Io sono fame.","Mən acam.",["io ho fame","ho fame"],"Ho fame.","“Fame” AVERE ilə işlənir."],["Le ragazza sono italiane.","Qızlar italyandır.",["le ragazze sono italiane","ragazze sono italiane"],"Le ragazze sono italiane.","“Ragazza” cəmdə “ragazze” olur."],["Marco e Luca ha sonno.","Marco və Lucanın yuxusu gəlir.",["marco e luca hanno sonno"],"Marco e Luca hanno sonno.","İki şəxs olduğuna görə “hanno” işlənir."],["La studenti è in ritardo.","Qadın tələbə gecikir.",["la studentessa è in ritardo","studentessa è in ritardo"],"La studentessa è in ritardo.","Bir qadın tələbə üçün “studentessa” işlənir."],["Noi ha paura.","Biz qorxuruq.",["noi abbiamo paura","abbiamo paura"],"Noi abbiamo paura.","Noi ilə AVERE → abbiamo."],["I casa sono grandi.","Evlər böyükdür.",["le case sono grandi","case sono grandi"],"Le case sono grandi.","Casa → case və qadın cinsi cəmdə artikl “le”dir."],["Voi avete in gamba.","Siz bacarıqlısınız.",["voi siete in gamba","siete in gamba"],"Voi siete in gamba.","“In gamba” ESSERE ilə işlənir: siete in gamba."],["Loro sono sete.","Onlar susayıblar.",["loro hanno sete","hanno sete"],"Loro hanno sete.","“Sete” AVERE ilə işlənir; loro → hanno."],["Gli ragazze sono brave.","Qızlar bacarıqlıdırlar.",["le ragazze sono brave"],"Le ragazze sono brave.","Qadın cinsi cəmdə “le ragazze” işlənir."],["Tu sei ragione.","Sən haqlısan.",["tu hai ragione","hai ragione"],"Tu hai ragione.","“Avere ragione” sabit ifadədir; tu → hai."]];
const R5=[["Giulia e Sara: è mezzanotte e vogliono dormire.","Giulia və Sara: gecə yarısıdır və yatmaq istəyirlər.","hanno sonno","Giulia və Sara cəmdir → “hanno”. “Yuxusu gəlmək” = avere sonno."],["Marco non mangia da ieri.","Marco dünəndən yemək yemir.","ha fame","Marco tək şəxsdir → “ha”. “Ac olmaq” = avere fame."],["Anna arriva venti minuti dopo l'inizio.","Anna başlanğıcdan 20 dəqiqə sonra gəlir.","è in ritardo","Gec gəlmək vəziyyəti ESSERE ilə qurulur: essere in ritardo."],["Luca e Paolo sono molto capaci nel loro lavoro.","Luca və Paolo işlərində çox bacarıqlıdırlar.","sono in gamba","“Bacarıqlı olmaq” = essere in gamba; iki şəxs → sono."],["Fuori nevica e noi non abbiamo il cappotto.","Çöldə qar yağır və bizim paltomuz yoxdur.","abbiamo freddo","“Üşümək” = avere freddo; noi → abbiamo."],["Maria dice: «Roma è la capitale d'Italia».","Maria deyir: «Roma İtaliyanın paytaxtıdır».","ha ragione","Fikir doğrudur → avere ragione; Maria → ha."],["Voi arrivate trenta minuti prima.","Siz 30 dəqiqə əvvəl gəlirsiniz.","siete in anticipo","Vaxtından əvvəl gəlmək = essere in anticipo; voi → siete."],["Le ragazze vedono un cane enorme e si spaventano.","Qızlar nəhəng it görür və qorxurlar.","hanno paura","Qorxmaq = avere paura; le ragazze cəmdir → hanno."],["Paolo non ha più soldi nel portafoglio.","Paolonun pulqabısında artıq pul yoxdur.","è al verde","Pulsuz qalmaq ifadəsi = essere al verde; Paolo → è."],["Noi desideriamo andare in Italia.","Biz İtaliyaya getmək istəyirik.","abbiamo voglia di andare","İstək/həvəs = avere voglia di + infinitiv; noi → abbiamo."]];
const $=x=>document.getElementById(x),sh=a=>[...a].sort(()=>Math.random()-.5);let sets=[sh(R1),sh(R2),sh(R3),sh(R4),sh(R5)],r=0,n=0,total=0,rs=[0,0,0,0,0],first=true;
function norm(s){return s.toLowerCase().trim().replace(/[.!?;,«»"']/g,"").replace(/\s+/g," ")}
function say(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.78;speechSynthesis.speak(u)}}
function up(){$("score").textContent=total+" / 50";$("fill").style.width=((r*10+n)/50*100)+"%"}
function goNext(){n++;first=true;if(n===10){r++;n=0;if(r===5)return finish()}render()}
function showNext(){let f=$("fb");let b=document.createElement("button");b.className="nextbtn";b.textContent=(n===9&&r<4)?"Növbəti raund →":"Növbəti sual →";b.onclick=goNext;f.appendChild(b)}
function feedback(ok,explain,audio){let f=$("fb");f.className="fb "+(ok?"good":"wrong");f.innerHTML='<b>'+(ok?"✅ Düzdür!":"❌ Bu seçim düzgün deyil.")+"</b>"+explain+(audio?'<br><button id="aud" class="audio">🔊 Dinlə</button>':"");if(audio){$("aud").onclick=()=>say(audio);if(ok)say(audio)}}
function pick(b,v,a,explain,audio){if(v===a){document.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("ok");if(first){total++;rs[r]++}feedback(true,explain,audio);showNext()}else{first=false;b.classList.add("bad");feedback(false,explain,"")}}
function opts(title,ins,q,arr,ans,explain,audio,az=""){$("game").innerHTML='<div class="title">'+title+'</div><div class="ins">'+ins+'</div><div class="q"><div class="big">'+q+'</div>'+(az?'<div class="az">🇦🇿 '+az+"</div>":"")+'</div><div class="opts">'+arr.map(x=>'<button class="opt">'+x+"</button>").join("")+'</div><div id="fb" class="fb"></div>';document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b,b.textContent,ans,explain,audio))}
function render(){up();let x=sets[r][n];if(r===0){$("badge").textContent="ROUND 1 · VERO/FALSO";opts("Vero o Falso? ⚡","Cümlənin qrammatik cəhətdən düzgün olub-olmadığını seç.","🇮🇹 "+x[0],["VERO","FALSO"],x[1],x[2],x[0])}else if(r===1){$("badge").textContent="ROUND 2 · CLASSIFICA";let labels=["👦  Kişi · tək","👦👦👦  Kişi · cəm","👧  Qadın · tək","👧👧👧  Qadın · cəm"];let ans=x[1]==="👦"?"👦  Kişi · tək":x[1]==="👦👦👦"?"👦👦👦  Kişi · cəm":x[1]==="👧"?"👧  Qadın · tək":"👧👧👧  Qadın · cəm";opts("Classifica il nome 🧺","İsmin cinsini və sayını seç.",x[0],sh(labels),ans,x[3],x[0])}else if(r===2){$("badge").textContent="ROUND 3 · INTRUSO";opts("Trova l'intruso 🕵️","Digərlərinə uyğun olmayan sözü və ya ifadəni tap.","Hansı fərqlidir?",sh(x[0]),x[1],x[2],x[1])}else if(r===3){$("badge").textContent="ROUND 4 · SCRIVI";$("game").innerHTML='<div class="title">Scrivi la frase ⌨️</div><div class="ins">Səhv cümləni düzəlt və düzgün variantı özün yaz.</div><div class="q"><div class="big">❌ '+x[0]+'</div><div class="az">🇦🇿 '+x[1]+'</div></div><input id="answer" class="answer" type="text" autocomplete="off" autocapitalize="sentences" placeholder="Düzgün italyanca cümləni yaz..."><div class="keys">'+["à","è","é","ì","ò","ù","'"].map(k=>'<button class="key">'+k+"</button>").join("")+'</div><button id="check" class="check">✓ Yoxla</button><div class="hintbox">💡 Cümləni birəbir nümunədəki kimi yazmaq məcburi deyil. Şəxs əvəzliyini buraxa bilərsən; böyük/kiçik hərf və durğu işarələri qiymətləndirməyə təsir etmir.</div><div id="fb" class="fb"></div>';let inp=$("answer");document.querySelectorAll(".key").forEach(k=>k.onclick=()=>{inp.value+=k.textContent;inp.focus()});$("check").onclick=()=>checkTyped(x);inp.addEventListener("keydown",e=>{if(e.key==="Enter")checkTyped(x)})}else{$("badge").textContent="ROUND 5 · BOSS";let pool=R5.map(z=>z[2]),d=sh(pool.filter(y=>y!==x[2])).slice(0,3);opts("Boss Finale 👑","Situasiyanı analiz et və ən uyğun ifadəni seç.",x[0],sh([x[2],...d]),x[2],x[3],x[0]+" "+x[2],x[1])}}
function checkTyped(x){let inp=$("answer"),v=norm(inp.value);if(!v)return;let accepted=x[2].map(norm);if(accepted.includes(v)){if(first){total++;rs[r]++}inp.disabled=true;$("check").disabled=true;feedback(true,'Qəbul edildi. Nümunə cavab: <b style="display:inline">'+x[3]+"</b>",x[3]);showNext()}else{first=false;feedback(false,x[4]+'<br>Nümunə düzgün cavab: <b style="display:inline">'+x[3]+"</b>","");inp.focus()}}
function finish(){$("fill").style.width="100%";$("badge").textContent="COMPLETATO";let p=Math.round(total/50*100);$("game").innerHTML='<div class="result"><div style="font-size:44px">🌱🏆</div><div class="title">Grande Ripasso completato!</div><div class="pct">'+p+"%</div><div>"+total+' / 50 — ilk cəhddə düzgün</div><div class="rounds">'+["Vero/Falso","Classifica","Intruso","Scrivi","Boss"].map((z,i)=>'<div class="mini">'+z+"<b>"+rs[i]+"/10</b></div>").join("")+'</div><button id="again" class="restart">↻ Yenidən oyna</button></div>';$("again").onclick=()=>location.reload()}
render();</script></body></html>
