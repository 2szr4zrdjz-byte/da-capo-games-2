<!doctype html>
<html lang="az">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Germì — Presente Challenge</title>
<style>:root{--g:#16884a;--dg:#0b6036;--ink:#183128;--gold:#ffd45c;--ok:#dff7e6;--bad:#fff0df;--blue:#e8f5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#dff5ff,#fff7df);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.wrap{max-width:700px;margin:auto;padding:8px}.hero{background:linear-gradient(135deg,var(--dg),var(--g));color:white;border-radius:24px;padding:18px;text-align:center;box-shadow:0 10px 28px #0002}h1{margin:0;font-size:clamp(26px,7vw,43px)}.hero p{margin:5px 0 0}.card{background:#fff;border-radius:24px;padding:16px;margin-top:11px;box-shadow:0 9px 26px #0002}.top{display:flex;justify-content:space-between;gap:8px}.pill{padding:8px 11px;border-radius:999px;font-weight:900}.round{background:#e2f6e8;color:var(--dg)}.count{background:#fff0b7}.progress{height:10px;background:#e8eee9;border-radius:99px;overflow:hidden;margin:13px 0}.bar{height:100%;background:linear-gradient(90deg,#1da35b,var(--gold));transition:.3s}.label{text-align:center;color:#6e7b74;font-size:13px;font-weight:800}.prompt{text-align:center;font-weight:950;font-size:clamp(25px,7vw,40px);line-height:1.25;margin:9px 0 17px}.subprompt{text-align:center;background:var(--blue);padding:10px;border-radius:13px;margin:-6px 0 12px;font-weight:750}.input{width:100%;border:3px solid #b6cfbe;border-radius:16px;padding:14px;text-align:center;font:inherit;font-size:clamp(18px,5vw,25px);font-weight:800;outline:0}.input:focus{border-color:#e4aa25;box-shadow:0 0 0 4px #ffd45c44}.good{background:var(--ok)!important;border-color:#35a65e!important}.wrong{background:var(--bad)!important;border-color:#e2a04e!important}.actions{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:14px;padding:13px;font:inherit;font-weight:900;cursor:pointer}.check{flex:1;background:var(--g);color:#fff}.clear{background:#edf3ef;color:var(--dg)}.msg{text-align:center;min-height:50px;padding-top:9px;font-weight:850}.hint{text-align:center;color:#718078;font-size:12px}.stage{text-align:center;padding:18px}.stage .emoji{font-size:58px}.next{width:100%;background:var(--dg);color:#fff;margin-top:10px}.mic{width:116px;height:116px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:48px;display:block;margin:14px auto;box-shadow:0 8px 22px #16884a44;cursor:pointer}.mic.listening{animation:pulse 1s infinite;background:#d44}.heard{background:#f4f7f5;border-radius:13px;min-height:48px;padding:12px;text-align:center;font-weight:750}.oklamp{width:18px;height:18px;border-radius:50%;display:inline-block;background:#c9d0cc;vertical-align:-2px;margin-right:6px}.oklamp.on{background:#25b85e;box-shadow:0 0 12px #25b85e}.roundnav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.rnav{border:0;border-radius:13px;padding:11px 6px;background:#fff;color:var(--dg);font:inherit;font-size:13px;font-weight:900;box-shadow:0 5px 15px #0001;cursor:pointer}.rnav.active{background:var(--dg);color:#fff}.rnav.done{outline:2px solid #32a75e}@keyframes pulse{50%{transform:scale(1.07)}}@media(max-width:420px){.wrap{padding:5px}.card{padding:13px}}</style></head>
<body><div class="wrap"><div class="hero"><h1>🌱 Germì — Presente Challenge 🇮🇹</h1><p>Coniuga • Traduci • Parla</p></div><div class="roundnav"><button class="rnav" data-r="0">1 • Coniuga</button><button class="rnav" data-r="1">2 • Traduci</button><button class="rnav" data-r="2">3 • Parla</button></div><div class="card" id="card"></div></div>
<script>
const conjugation=[["loro","partire","partono"],["io","parlare","parlo"],["voi","vendere","vendete"],["lui / lei","dormire","dorme"],["noi","studiare","studiamo"],["tu","credere","credi"],["lui / lei","aprire","apre"],["voi","ricevere","ricevete"],["io","lavorare","lavoro"],["loro","abitare","abitano"],["tu","leggere","leggi"],["noi","ascoltare","ascoltiamo"]];
const translation=[["Sən kitabı oxuyursan?","Tu leggi il libro?",["leggi"],["tu"],"libro","libro — kitab"],["Mən hər gün italyanca öyrənirəm.","Io studio italiano ogni giorno.",["studio"],["io"],"italiano","ogni — hər • giorno — gün • italiano — italyanca"],["Biz Romada yaşayırıq.","Noi abitiamo a Roma.",["abitiamo"],["noi"],"roma","abitare — yaşamaq • Roma — Roma"],["Onlar səhər işləyirlər.","Loro lavorano la mattina.",["lavorano"],["loro"],"mattina","mattina — səhər • lavorare — işləmək"],["Siz musiqiyə qulaq asırsınız.","Voi ascoltate la musica.",["ascoltate"],["voi"],"musica","ascoltare — qulaq asmaq • musica — musiqi"],["O, qapını açır.","Lei apre la porta.",["apre"],["lui","lei"],"porta","aprire — açmaq • porta — qapı"],["Mən yeni kitab alıram.","Io compro un libro nuovo.",["compro"],["io"],"libro","comprare — almaq • nuovo — yeni • libro — kitab"],["Sən dostunla danışırsan.","Tu parli con il tuo amico.",["parli"],["tu"],"amico","parlare — danışmaq • amico — dost • con — ilə"],["Biz televizora baxırıq.","Noi guardiamo la televisione.",["guardiamo"],["noi"],"tv","guardare — baxmaq • TV / televisione — televizor"],["Onlar sabah yola düşürlər.","Loro partono domani.",["partono"],["loro"],"domani","partire — yola düşmək • domani — sabah"]];
const speaking=["Io parlo italiano ogni giorno.","Tu leggi un libro interessante.","Lei lavora in una banca.","Noi studiamo insieme.","Voi ascoltate la musica italiana.","Loro abitano a Milano.","Io apro la finestra.","Tu guardi un film italiano.","Noi partiamo domani mattina.","Loro comprano due libri."];
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[?!.,;:]/g,"").replace(/\s+/g," ").trim();let round=0,i=0,locked=false;const positions=[0,0,0],completed=[false,false,false];const totals=[conjugation.length,translation.length,speaking.length];
function updateNav(){document.querySelectorAll(".rnav").forEach(b=>{const n=+b.dataset.r;b.classList.toggle("active",n===round);b.classList.toggle("done",completed[n])})}document.querySelectorAll(".rnav").forEach(b=>b.onclick=()=>{positions[round]=i;round=+b.dataset.r;i=positions[round];locked=false;render()});
function header(title){return `<div class="top"><span class="pill round">${title}</span><span class="pill count">${i+1} / ${totals[round]}</span></div><div class="progress"><div class="bar" style="width:${i/totals[round]*100}%"></div></div>`}function render(){locked=false;updateNav();if(round===0)renderConj();else if(round===1)renderTrans();else renderSpeak()}
function renderConj(){const[person,verb]=conjugation[i];card.innerHTML=header("RAUND 1 • CONIUGA ✍️")+`<div class="label">Presente Indicativo — düzgün formanı yaz</div><div class="prompt">${person} + ${verb}</div><input id="ans" class="input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="cavabı yaz…"><div class="actions"><button class="btn clear" id="clear">Sil</button><button class="btn check" id="check">Yoxla ✓</button></div><div class="msg" id="msg"></div><div class="hint">Enter = yoxla • yalnız Presente Indicativo</div>`;wireText(conjugation[i][2])}
function renderTrans(){card.innerHTML=header("RAUND 2 • TRADUCI 🇦🇿→🇮🇹")+`<div class="label">Cümləni italyanca yaz</div><div class="prompt">${translation[i][0]}</div><div class="subprompt">🔑 ${translation[i][5]}</div><input id="ans" class="input" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" placeholder="Scrivi in italiano…"><div class="actions"><button class="btn clear" id="clear">Sil</button><button class="btn check" id="check">Yoxla ✓</button></div><div class="msg" id="msg"></div><div class="hint">Durğu işarəsi və böyük/kiçik hərf nəticəyə təsir etmir.</div>`;wireTranslation(translation[i])}
function wireText(expected){const a=document.getElementById("ans"),m=document.getElementById("msg");setTimeout(()=>a.focus(),80);function verify(){if(locked)return;if(!a.value.trim()){m.textContent="✍️ Əvvəlcə cavabı yaz.";a.focus();return}const nv=norm(a.value),ne=norm(expected),parts=nv.split(" "),flexible=(nv===ne)||(parts.length>1&&parts[parts.length-1]===ne&&["io","tu","lui","lei","noi","voi","loro"].includes(parts[0]));if(flexible){locked=true;a.classList.add("good");m.textContent="✅ Corretto!";setTimeout(advance,650)}else{a.classList.add("wrong");m.textContent="💡 Bir də yoxla. Düzgün cavab göstərilmir.";setTimeout(()=>{a.classList.remove("wrong");a.select()},250)}}check.onclick=verify;clear.onclick=()=>{a.value="";m.textContent="";a.focus()};a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();verify()}};a.oninput=()=>a.classList.remove("wrong")}
function tokens(s){return norm(s).split(" ").filter(Boolean)}function hasAny(arr,choices){return choices.some(x=>arr.includes(norm(x)))}function sayItalian(text){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="it-IT";u.rate=.86;speechSynthesis.speak(u)}
function wireTranslation(item){const[az,model,verbs,subjects,concept,keys]=item,a=document.getElementById("ans"),m=document.getElementById("msg");setTimeout(()=>a.focus(),80);function verify(){if(locked)return;const t=tokens(a.value);if(!t.length){m.textContent="✍️ Əvvəlcə cavabı yaz.";a.focus();return}const verbOK=hasAny(t,verbs),subjectOK=hasAny(t,subjects);let conceptOK=true;if(concept==="tv")conceptOK=t.includes("tv")||t.includes("televisione")||t.includes("televisore");else if(concept)conceptOK=t.includes(norm(concept));if(verbOK&&subjectOK&&conceptOK){locked=true;a.classList.add("good");m.textContent="✅ Corretto!";setTimeout(advance,700)}else{a.classList.add("wrong");m.textContent="💡 "+(!verbOK?"Feilin hallanmasına diqqət et və dinlə. 🎧":"Cümləni bir də dinlə və yenidən yaz. 🎧");sayItalian(model);setTimeout(()=>{a.classList.remove("wrong");a.focus();a.select()},350)}}check.onclick=verify;clear.onclick=()=>{a.value="";m.textContent="";a.focus()};a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();verify()}};a.oninput=()=>a.classList.remove("wrong")}
function renderSpeak(){const phrase=speaking[i];card.innerHTML=header("RAUND 3 • PARLA 🎙️")+`<div class="label">Cümləni italyanca səsləndir</div><div class="prompt">${phrase}</div><div class="subprompt">Mikrofona bas və cümləni tam oxu.</div><button class="mic" id="mic">🎙️</button><div class="heard" id="heard">Dediyin cümlə burada görünəcək.</div><div class="msg" id="msg"><span class="oklamp"></span> Hazırdır</div><div class="hint">Mikrofona icazə verilməlidir. Nitqin tanınması brauzerin dəstəyindən asılıdır.</div>`;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){mic.disabled=true;mic.style.opacity=.45;msg.textContent="Bu brauzer nitqin tanınmasını dəstəkləmir. Chrome istifadə et.";return}mic.onclick=()=>{if(locked)return;const rec=new SR();rec.lang="it-IT";rec.interimResults=false;rec.maxAlternatives=3;mic.classList.add("listening");mic.textContent="●";heard.textContent="Dinləyirəm…";msg.innerHTML='<span class="oklamp"></span> Parla…';rec.onresult=e=>{let alts=[];for(let x=0;x<e.results[0].length;x++)alts.push(e.results[0][x].transcript);heard.textContent=alts[0];const target=norm(phrase),ok=alts.some(t=>similar(norm(t),target)>=.82);if(ok){locked=true;mic.classList.remove("listening");mic.textContent="✓";msg.innerHTML='<span class="oklamp on"></span> Corretto!';setTimeout(advance,900)}else{mic.classList.remove("listening");mic.textContent="🎙️";msg.innerHTML='<span class="oklamp"></span> Bir də cəhd et.'}};rec.onerror=e=>{mic.classList.remove("listening");mic.textContent="🎙️";heard.textContent="Səs tanınmadı.";msg.innerHTML='<span class="oklamp"></span> Yenidən cəhd et.'};rec.onend=()=>{if(!locked){mic.classList.remove("listening");mic.textContent="🎙️"}};try{rec.start()}catch(e){}}}
function similar(a,b){if(a===b)return 1;const A=a.split(" "),B=b.split(" ");let hit=0;A.forEach((w,idx)=>{if(B[idx]===w)hit++;else if(B.includes(w))hit+=.55});return hit/Math.max(A.length,B.length)}function advance(){if(i<totals[round]-1){i++;positions[round]=i;render();return}completed[round]=true;positions[round]=i;updateNav();if(round<2){const names=round===0?["🌿","Raund 1 tamamlandı!","İndi Azərbaycan dilindəki cümlələri italyanca yazacaqsan."]:["🎙️","Raund 2 tamamlandı!","Finalda cümlələri mikrofona düzgün səsləndirəcəksən."];card.innerHTML=`<div class="stage"><div class="emoji">${names[0]}</div><h2>${names[1]}</h2><p>${names[2]}</p><button class="btn next" id="go">Növbəti raund →</button></div>`;go.onclick=()=>{round++;i=positions[round];render()}}else card.innerHTML=`<div class="stage"><div class="emoji">🏆🇮🇹</div><h2>SFIDA COMPLETATA!</h2><p>Hallandırma, yazılı tərcümə və tələffüz raundlarını tamamladın.</p><button class="btn next" onclick="location.reload()">Yenidən oyna ↻</button></div>`}render();
</script></body></html>
