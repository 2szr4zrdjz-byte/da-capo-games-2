<!doctype html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Da Capo · PRONTO!</title><style>
:root{--g:#164b39;--cream:#faf7ef;--gold:#cba35e}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:17px system-ui,-apple-system,sans-serif;color:#173b30}.wrap{max-width:900px;margin:auto;padding:24px}h1{font:700 54px Georgia;margin:10px 0}h2{font:700 28px Georgia;margin:10px 0}.brand{font:700 34px Georgia;color:var(--g)}.muted{color:#657d71}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{padding:10px;border-radius:12px;background:#e6eee6;font-size:13px}.active{background:var(--g);color:white}.panel{background:white;border:1px solid #e0e6de;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #1232}.scene{min-height:190px;background:linear-gradient(130deg,#d7e8db,#f3dfbd);display:grid;place-items:center;font-size:92px}.inside{padding:24px}.choice{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;margin:9px 0;background:#fff;border:1px solid #cfdcd3;border-radius:14px;text-align:left;color:#173b30;font-size:18px;cursor:pointer}.choice:hover{background:#f2f8f2}.choice:disabled{opacity:.65}.speak{background:#e5efe6;border:0;border-radius:50%;width:39px;height:39px;cursor:pointer;flex-shrink:0}.label{flex:1}.btn{background:var(--g);color:white;border:0;border-radius:12px;padding:13px 20px;font-size:16px;cursor:pointer;margin-top:10px}.btn:disabled{opacity:.4}.feedback{margin-top:15px;padding:13px;background:#eef4ec;border-radius:12px}.wrong{background:#fff0e9}.input{font:20px system-ui;width:100%;border:2px solid #cad8cf;border-radius:12px;padding:14px;margin-top:15px}.progress{height:8px;background:#e2e8e0;border-radius:9px;margin:18px 0;overflow:hidden}.fill{height:100%;background:var(--gold);transition:width .2s}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:13px}.hide{display:none}@media(max-width:600px){.wrap{padding:15px}h1{font-size:43px}.inside{padding:16px}.scene{min-height:155px;font-size:75px}}</style></head><body><main class="wrap"><div class="brand">Da Capo 🌱</div><div class="muted small">ITALIANO, OGNI GIORNO</div><h1>PRONTO! 🇮🇹</h1><div class="muted">Le espressioni di cortesia · 4 raundlu interaktiv praktika</div><div class="tabs" id="tabs"></div><div class="progress"><div class="fill" id="fill"></div></div><section class="panel" id="panel"></section><p class="muted small">🔊 İtalyanca səsləndirmə cihazınızın brauzer səsindən istifadə edir. Səsi açıq saxlayın.</p></main><script>
const scenes=[["Al bar","Barista sənə qəhvə təqdim edir. Nə deyirsən?","Grazie!","☕"],["Per strada","Tanımadığın şəxsdən yol soruşmaq istəyirsən.","Scusi!","🗺️"],["Tra amici","Dostun səhvən sənə toxunur və üzr istəyir. Sən 'problem deyil' mənasında nə deyirsən?","Figurati!","🤝"],["In negozio","Satıcıdan kömək istəyirsən. Xahişini hansı ifadə ilə nəzakətli edirsən?","Per favore!","🛍️"],["Con un amico","Dostunun sözünü kəsib nəsə soruşmaq istəyirsən.","Scusa!","👋"],["Una brutta notizia","Dostun pis xəbər verir. Təəssüfünü necə bildirirsən?","Mi dispiace!","💐"],["Al ristorante","Qonağa menyunu təqdim edirsən: 'Buyurun!'","Prego!","🍝"],["Dopo un favore","Tanışın sənə 'Grazie mille!' deyir. 'Dəyməz' cavabını seç.","Di niente!","🌷"],["Un grande aiuto","Bir nəfərə çox kömək etmisən, o sənə təşəkkür edir. 'Bir şey deyil!' de.","Non c'è di che!","🙌"],["Un regalo","Dostun sənə hədiyyə verir. Daha güclü təşəkkür necə edirsən?","Grazie mille!","🎁"]],words=["Per favore!","Grazie!","Grazie mille!","Prego!","Scusa!","Scusi!","Mi dispiace!","Non c'è di che!","Figurati!","Di niente!"],dialogs=[["— Puoi aiutarmi, ___?","Per favore!"],["— Ecco il tuo caffè. — ___","Grazie!"],["— Ti ho portato un regalo. — ___","Grazie mille!"],["— Posso entrare? — ___","Prego!"],["— ___, Marco, hai un minuto?","Scusa!"],["— ___, signora, dov'è la stazione?","Scusi!"],["— Ho perso il treno. — ___","Mi dispiace!"],["— Grazie per l'aiuto! — ___","Non c'è di che!"],["— Grazie, amico mio! — ___","Figurati!"],["— Grazie! — ___","Di niente!"]],sentences=[["Zəhmət olmasa, mənə kömək et.","Aiutami, per favore."],["Təşəkkür edirəm, Marko.","Grazie, Marco."],["Hədiyyə üçün çox təşəkkürlər.","Grazie mille per il regalo."],["Buyurun, bu sizin qəhvənizdir.","Prego, questo è il suo caffè."],["Bağışla, Anna.","Scusa, Anna."],["Bağışlayın, haradadır stansiya?","Scusi, dov'è la stazione?"],["Təəssüf edirəm, Paolo.","Mi dispiace, Paolo."],["Dəyməz, hər şey qaydasındadır.","Non c'è di che, va tutto bene."],["Dəyməz, dostum.","Figurati, amico mio."],["Dəyməz, problem yoxdur.","Di niente, nessun problema."]];
let round=0,idx=0,score=0,done=false,selected='',attempts=0;const names=['1 · Situasiya','2 · Mini dialoq','3 · Dinlə və yaz','4 · Cümlə qur'];const p=document.getElementById('panel');
function say(t){if(!('speechSynthesis'in window)){alert('Bu brauzerdə səsləndirmə dəstəklənmir');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.84;let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('it'));if(v)u.voice=v;speechSynthesis.speak(u)}
function norm(s){return s.toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function buttonSpeak(t){let b=document.createElement('button');b.className='speak';b.textContent='🔊';b.title='Dinlə';b.onclick=e=>{e.stopPropagation();say(t)};return b}
function show(){document.getElementById('tabs').innerHTML=names.map((n,i)=>'<span class="tab '+(i===round?'active':'')+'">'+n+'</span>').join('');document.getElementById('fill').style.width=((round*10+idx)/40*100)+'%';done=false;selected='';p.innerHTML='';let area=document.createElement('div');area.className='inside';p.append(area);
if(round===0){let s=scenes[idx];let pic=document.createElement('div');pic.className='scene';pic.textContent=s[3];p.insertBefore(pic,area);area.innerHTML='<div class="muted">Situasiya '+(idx+1)+'/10 · '+s[0]+'</div><h2>'+s[1]+'</h2><p class="muted">Cosa dici in questa situazione?</p>';options(area,s[2],idx)}
if(round===1){let d=dialogs[idx];area.innerHTML='<div class="muted">Mini dialoq '+(idx+1)+'/10</div><h2>'+d[0]+'</h2><p class="muted">Boşluğa uyğun ifadəni seç.</p>';options(area,d[1],idx+13)}
if(round===2){area.innerHTML='<div class="muted">Ascolta e scrivi · '+(idx+1)+'/10</div><h2>İfadəni dinlə və eşitdiyini yaz.</h2>';area.append(buttonSpeak(words[idx]));inputTask(area,words[idx],false)}
if(round===3){area.innerHTML='<div class="muted">Traduci e scrivi · '+(idx+1)+'/10</div><h2>'+sentences[idx][0]+'</h2><p class="muted">İtalyanca cümləni klaviatura ilə yaz.</p>';inputTask(area,sentences[idx][1],true)}
}
function options(area,correct,seed){let others=words.filter(w=>w!==correct);let chosen=[correct,...[0,1,2].map((_,i)=>others[(seed*3+i*4)%others.length])];chosen=[...new Set(chosen)];for(let w of others){if(chosen.length>=4)break;if(!chosen.includes(w))chosen.push(w)}chosen.sort((a,b)=>((words.indexOf(a)*7+seed*11)%13)-((words.indexOf(b)*7+seed*11)%13));let box=document.createElement('div');area.append(box);chosen.forEach((w,i)=>{let b=document.createElement('div');b.className='choice';let txt=document.createElement('span');txt.className='label';txt.textContent=String.fromCharCode(65+i)+'. '+w;let audio=buttonSpeak(w);b.append(txt,audio);b.onclick=e=>{if(e.target===audio||done)return;if(w===correct){success(area,'Perfetto! '+correct)}else{feedback(area,'Riprova! Bu situasiyada başqa ifadə daha uyğundur.',true)}};box.append(b)})}
function feedback(area,t,bad){let f=area.querySelector('.feedback');if(!f){f=document.createElement('div');f.className='feedback';area.append(f)}f.className='feedback'+(bad?' wrong':'');f.textContent=t}
function success(area,msg){if(done)return;done=true;score++;feedback(area,msg,false);let b=document.createElement('button');b.className='btn';b.textContent=idx===9&&round===3?'Nəticəni gör →':'Növbəti →';b.onclick=next;area.append(b);say(round===0?scenes[idx][2]:round===1?dialogs[idx][1]:round===2?words[idx]:sentences[idx][1])}
function acceptable(value,answer,isSentence){
 const v=norm(value),a=norm(answer);
 if(v===a)return true;
 if(!isSentence)return false;
 const variants=[
 ["aiutami per favore","per favore aiutami","mi aiuti per favore","puoi aiutarmi per favore","potresti aiutarmi per favore"],
 ["grazie marco","marco grazie","ti ringrazio marco"],
 ["grazie mille per il regalo","grazie di cuore per il regalo","grazie tantissimo per il regalo","ti ringrazio tanto per il regalo"],
 ["prego questo e il suo caffe","prego ecco il suo caffe","prego questo e il caffe","prego ecco il caffe","prego ecco a lei il caffe","prego ecco a lei il suo caffe","prego questo e il vostro caffe","prego ecco il vostro caffe","prego ecco il tuo caffe","prego questo e il tuo caffe","prego le porto il caffe","prego ecco qui il suo caffe","ecco il suo caffe prego","ecco il suo caffe","ecco a lei il suo caffe","ecco il caffe prego","prego il suo caffe","prego ecco qui il caffe"],
 ["scusa anna","anna scusa","scusami anna","anna scusami"],
 ["scusi dov e la stazione","scusi dove si trova la stazione","mi scusi dov e la stazione","mi scusi dove si trova la stazione"],
 ["mi dispiace paolo","paolo mi dispiace","sono dispiaciuto paolo","sono dispiaciuta paolo"],
 ["non c'e di che va tutto bene","non c'e di che tutto a posto","non c'e di che nessun problema","non c'e di che non c'e problema","non c'e di che va bene","non c'e di che e tutto ok","non c'e di che tutto ok","di niente va tutto bene","di niente tutto a posto","di niente nessun problema","figurati va tutto bene","figurati nessun problema"],
 ["figurati amico mio","figurati amica mia","figurati amico","figurati amica","non c'e di che amico mio","di niente amico mio"],
 ["di niente nessun problema","di niente non c'e problema","di niente va tutto bene","di niente tutto a posto","figurati nessun problema","non c'e di che nessun problema"]
 ];
 const valid=variants[idx]||[];
 if(valid.includes(v))return true;
 if(idx===3){const intro=["prego","ecco","ecco qui","ecco a lei","prego ecco","prego ecco qui","prego ecco a lei","ecco prego"];const ending=["questo e il suo caffe","questo e il tuo caffe","questo e il vostro caffe","ecco il suo caffe","ecco il tuo caffe","ecco il vostro caffe","il suo caffe","il tuo caffe","il vostro caffe","il caffe","qui il suo caffe","qui il caffe","a lei il suo caffe"];if(intro.some(x=>v.startsWith(x+" "))&&ending.some(x=>v.endsWith(x)))return true;}\n if(idx===7){
   const first=["non c'e di che","di niente","figurati","nessun problema"];
   const second=["va tutto bene","tutto a posto","nessun problema","non c'e problema","non ci sono problemi","va bene","tutto ok","e tutto ok","non ti preoccupare","non preoccuparti","tranquillo","tranquilla"];
   return first.some(x=>v.startsWith(x+" "))&&second.some(x=>v.endsWith(x));
 }
 return false;
}
function inputTask(area,answer,isSentence){let input=document.createElement('input');input.className='input';input.placeholder='Cavabı buraya yaz...';input.autocomplete='off';input.spellcheck=false;area.append(input);let row=document.createElement('div');row.className='actions';let check=document.createElement('button');check.className='btn';check.textContent='Yoxla';row.append(check);area.append(row);const verify=()=>{if(done)return;if(acceptable(input.value,answer,isSentence)){success(area,'Bravissimo! '+answer)}else{attempts++;feedback(area,'Bir daha cəhd et. '+(isSentence?'Cümləni tam yaz.':'Səsi yenidən dinlə.'),true)}};check.onclick=verify;input.onkeydown=e=>{if(e.key==='Enter')verify()};if(isSentence){let hint=document.createElement('p');hint.className='muted small';hint.textContent='İpucu: '+answer.split(' ').slice(0,2).join(' ')+' ...';area.append(hint)}}
function next(){idx++;if(idx===10){idx=0;round++}if(round===4){p.innerHTML='<div class="inside"><h2>Bravissimo! 🎉</h2><p>4 raund tamamlandı. '+score+'/40 tapşırıq düzgün cavablandırıldı.</p><button class="btn" onclick="restart()">Yenidən başla</button></div>';document.getElementById('fill').style.width='100%';return}show()}
function restart(){round=0;idx=0;score=0;attempts=0;show()}show();
</script></body></html>
