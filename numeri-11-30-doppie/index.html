<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Da Capo | Missione 11–30 & Doppie</title>
<style>
:root{--g:#123f32;--g2:#2f6d54;--c:#fbf6e8;--gold:#d2ae4b;--muted:#728078}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--c);font-family:Arial,sans-serif;color:#263b32}.app{max-width:880px;margin:auto}
.brand{text-align:center;color:var(--g)}.brand h1,h2,.q,.score{font-family:Georgia,serif}.brand h1{margin:0}.panel,.card{background:#fff;border:1px solid #dce5dd;border-radius:20px;padding:16px;box-shadow:0 10px 28px #0000000d}
.title{text-align:center;font:700 27px Georgia;color:var(--g)}.sub,.az,.hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}.bar{height:8px;background:#e6ece7;border-radius:8px;overflow:hidden;margin:13px 0}.fill{height:100%;background:linear-gradient(90deg,var(--g2),var(--gold));width:0}
.route{display:flex;justify-content:center;gap:7px;margin:10px 0 14px}.dot{width:40px;height:40px;border:2px solid #d5ded7;border-radius:50%;display:grid;place-items:center}.dot.on{background:#fff3ce;border-color:var(--gold)}.dot.done{background:var(--g);color:#fff}
.head{text-align:center;background:#f1f6ef;border-radius:15px;padding:9px;margin-bottom:10px}.head h2{margin:3px;color:var(--g)}.q{text-align:center;font-weight:700;font-size:18px;color:var(--g)}.big{text-align:center;font:700 42px Georgia;color:var(--g);margin:12px}
.start{width:100%;border:0;background:var(--g);color:#fff;border-radius:12px;padding:13px;font-weight:900;font-size:15px;margin-top:13px}.choices,.pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:13px 0}.btn,.token{border:1px solid #c7d4c9;background:#fff;color:var(--g);border-radius:12px;padding:11px 14px;font-weight:800;font-size:16px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}.btn:active,.token:active{transform:scale(.98)}
.input{width:100%;font-size:19px;padding:14px;border:2px solid #c6d2c8;border-radius:12px;outline:none;color:var(--g)}.input:focus{border-color:var(--gold)}.input.bad{border-color:#c45a50;background:#fff7f5}.input.ok{border-color:#3d805e;background:#f4fbf6}.fb{display:none;margin-top:10px;padding:10px;border-radius:11px;font-size:13px}.fb.show{display:block;background:#eef5ef}.fb.bad{background:#fff0ed;color:#81372f}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.mem{min-height:105px;border:1px solid #d4ded6;border-radius:14px;background:#f8fbf7;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;cursor:pointer;color:var(--g);font-weight:800;user-select:none;-webkit-user-select:none;touch-action:manipulation}.mem.open{background:#fff7da;border-color:var(--gold)}.mem.matched{background:#e8f5ea;border-color:#78a785;opacity:.7;pointer-events:none}.mem .ico{font-size:30px;display:block}.mem small{font-weight:500;color:var(--muted);display:block;margin-top:4px}
.factory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bin{min-height:90px;border:2px dashed #bccabd;border-radius:13px;padding:8px;text-align:center}.bin b{font:700 22px Georgia;color:var(--g)}.token.sel{outline:3px solid var(--gold)}.token.used{display:none}.sound{width:64px;height:64px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:28px}.soundwrap{text-align:center;margin:12px}.score{text-align:center;font:700 55px Georgia;color:var(--g)}
@media(max-width:600px){.memory{grid-template-columns:repeat(3,1fr)}.factory{grid-template-columns:repeat(2,1fr)}.title{font-size:23px}.mem{min-height:92px;font-size:13px}}
</style></head><body><main class="app">
<div class="brand">🌱<h1>Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></div>
<section class="panel"><div class="title">Missione 11–30 & Doppie 🇮🇹</div><div class="sub">Numeri · enigmi · consonanti doppie · memoria · ascolto</div><div class="bar"><div id="prog" class="fill"></div></div><div id="route" class="route"></div><div id="stage"></div></section></main>
<script>
const W=[["piccolo","kiçik","🤏","cc"],["cappuccino","kapuçino","☕","cc"],["caffè","qəhvə","☕","ff"],["difficile","çətin","🧩","ff"],["oggi","bu gün","📅","gg"],["aggettivo","sifət","📝","gg"],["fratello","qardaş","👦","ll"],["sorella","bacı","👧","ll"],["mamma","ana","👩","mm"],["immagine","şəkil","🖼️","mm"],["nonna","nənə","👵","nn"],["anno","il","🗓️","nn"],["terra","torpaq / Yer","🌍","rr"],["corretto","düzgün","✅","rr"],["otto","səkkiz","8️⃣","tt"],["notte","gecə","🌙","tt"]];
const N={11:"undici",12:"dodici",13:"tredici",14:"quattordici",15:"quindici",16:"sedici",17:"diciassette",18:"diciotto",19:"diciannove",20:"venti",21:"ventuno",22:"ventidue",23:"ventitré",24:"ventiquattro",25:"venticinque",26:"ventisei",27:"ventisette",28:"ventotto",29:"ventinove",30:"trenta"};
const R=[
{name:"Memory Cards",ico:"🧠",type:"memory"},
{name:"Enigmi dei numeri",ico:"🔢",type:"riddle",data:[
["Anna ha 12 anni. Fra 11 anni, quanti anni avrà?",23,"Anna 12 yaşındadır. 11 ildən sonra neçə yaşı olacaq?","👧🎂"],
["Marco ha 14 caramelle e ne riceve 8. Quante ne ha ora?",22,"Marco-nun 14 konfeti var, 8 də alır. İndi neçədir?","🍬"],
["Ci sono 30 biscotti. Ne mangiamo 5. Quanti restano?",25,"30 peçenyedən 5-i yeyilir. Neçə qalır?","🍪"],
["Luca legge 10 pagine al mattino e 9 la sera. Quante pagine legge?",19,"Səhər 10, axşam 9 səhifə. Cəmi neçə?","📚"],
["Ci sono 7 gatti in casa e 9 in giardino. Quanti sono?",16,"Evdə 7, bağda 9 pişik. Cəmi neçə?","🐱"],
["Sara compra 3 scatole con 6 matite in ogni scatola. Quante matite?",18,"3 qutunun hərəsində 6 karandaş. Cəmi neçə?","✏️"],
["Una pizza ha 8 fette. Due pizze hanno quante fette?",16,"Bir pizzada 8 dilim. İki pizzada neçə?","🍕"],
["Ho 27 euro e spendo 6 euro. Quanti euro mi restano?",21,"27 avrodan 6 avro xərcləyirəm. Neçə qalır?","💶"]]},
{name:"La Fabbrica delle Doppie",ico:"🏭",type:"factory"},
{name:"Ascolta & Scrivi",ico:"🎧",type:"dict",data:["cappuccino","difficile","aggettivo","sorella","immagine","nonna","corretto","notte"]},
{name:"Boss Finale",ico:"👑",type:"boss",data:[
["num","Sono dopo ventidue e prima di ventiquattro.",23,"22-dən sonra, 24-dən əvvələm."],
["word","👵 È la madre di mia madre.","nonna","Anamın anasıdır."],
["num","Tre gruppi di sette fanno...",21,"3 × 7"],
["word","🌙 Il contrario di «giorno» è...","notte","“Giorno”nun əksidir."],
["num","Venti più otto fa...",28,"20 + 8"],
["word","🧩 Non è facile, è...","difficile","Asan deyil, ..."],
["num","Trenta meno tre fa...",27,"30 − 3"],
["word","👦 Il figlio dei miei genitori è mio...","fratello","Valideynlərimin oğlu mənim ..."],
["num","Due pizze con nove fette ciascuna: quante fette?",18,"2 × 9"],
["word","🖼️ Una foto è un'...","immagine","Foto bir ...dir."]]}];
let ri=0,qi=0,score=0,first=true,busy=false;const stage=document.getElementById("stage"),route=document.getElementById("route"),prog=document.getElementById("prog"),total=42;
function voice(t,cb){if(!("speechSynthesis" in window)){if(cb)cb();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.76;let v=speechSynthesis.getVoices(),it=v.find(x=>/^it(-|_)/i.test(x.lang))||v.find(x=>/ital/i.test(x.name));if(it)u.voice=it;if(cb){let d=false,go=()=>{if(!d){d=true;cb()}};u.onend=go;u.onerror=go;setTimeout(go,6000)}speechSynthesis.speak(u)}
function baseDone(){return [0,8,16,24,32][ri]||0}function nav(){route.innerHTML=R.map((r,i)=>`<div class="dot ${i<ri?"done":i===ri?"on":""}">${i<ri?"✓":r.ico}</div>`).join("");prog.style.width=Math.min(100,(baseDone()+qi)/total*100)+"%"}
function head(){let r=R[ri];return `<div class="head"><div style="font-size:34px">${r.ico}</div><h2>${r.name}</h2></div>`}function shell(c){stage.innerHTML=head()+`<div class="card">${c}<div id="fb" class="fb"></div></div>`}
function intro(){nav();let t=["İtalyanca söz kartını ikon + Azərbaycanca məna kartı ilə uyğunlaşdır. İtalyanca kart açılan kimi söz səslənəcək.","11–30 saylarını gündəlik mini-tapmacalarla tap.","Sözü seç, sonra içindəki qoşa samit qutusuna toxun.","Sözü dinlə və eşitdiyini düzgün yaz.","Saylar və doppie birlikdə — variant yoxdur."][ri];stage.innerHTML=head()+`<div class="card"><div class="q">Raund ${ri+1}/5</div><div class="az">${t}</div><button id="go" class="start">Başla →</button></div>`;document.getElementById("go").onclick=render}
function fail(m="Bir daha düşün."){first=false;let f=document.getElementById("fb");f.className="fb show bad";f.innerHTML="⚠️ <b>Səhvdir.</b> "+m}function pass(m,say){if(busy)return;busy=true;if(first)score++;let f=document.getElementById("fb");f.className="fb show";f.innerHTML="✅ <b>Corretto!</b> "+m;voice(say,next)}
function next(){setTimeout(()=>{busy=false;let len=(R[ri].data||[]).length;if(++qi>=len){ri++;qi=0;ri<R.length?intro():result()}else render()},250)}
const norm=s=>s.toLowerCase().trim().replace(/[.!?,;:'"“”«»]/g,"").replace(/\s+/g," ");function check(exp,msg,say){let f=document.getElementById("form"),i=document.getElementById("ans");f.onsubmit=e=>{e.preventDefault();if(busy||!i.value.trim())return;if(norm(i.value)===norm(exp)){i.disabled=true;i.classList.add("ok");pass(msg,say||exp)}else{i.classList.add("bad");fail("Yenidən yaz.");i.focus();i.select()}};setTimeout(()=>i.focus({preventScroll:true}),150)}
function render(){nav();first=true;busy=false;let r=R[ri];if(r.type==="memory"){memory();return}if(r.type==="factory"){factory();return}
if(r.type==="riddle"){let d=r.data[qi],opts=[d[1],...Object.keys(N).map(Number).filter(n=>n!==d[1]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);shell(`<div class="q">${d[0]}</div><div class="big">${d[3]}</div><div class="az">🇦🇿 ${d[2]}</div><div class="choices">${opts.map(n=>`<button class="btn" data-n="${n}">${N[n]}</button>`).join("")}</div>`);document.querySelectorAll(".btn").forEach(b=>b.onclick=()=>+b.dataset.n===d[1]?pass(`<b>${d[1]} — ${N[d[1]]}</b>`,N[d[1]]):fail())}
if(r.type==="dict"){let w=r.data[qi],a=W.find(x=>x[0]===w);shell(`<div class="q">Sözü dinlə və yaz.</div><div class="soundwrap"><button id="snd" class="sound">🔊</button></div><div class="az">${a[2]} 🇦🇿 ${a[1]}</div><form id="form"><input id="ans" class="input" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="İtalyanca sözü yaz..."></form><div class="hint">Qoşa samitə diqqət et.</div>`);document.getElementById("snd").onclick=()=>voice(w);setTimeout(()=>voice(w),250);check(w,`Düzgün: <b>${w}</b>.`,w)}
if(r.type==="boss"){let d=r.data[qi];if(d[0]==="num"){shell(`<div class="q">${d[1]}</div><div class="az">💡 ${d[3]}</div><form id="form"><input id="ans" class="input" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Cavabı italyanca sözlə yaz..."></form>`);check(N[d[2]],`Düzgün: <b>${N[d[2]]}</b>.`,N[d[2]])}else{shell(`<div class="q">${d[1]}</div><div class="az">🇦🇿 ${d[3]}</div><form id="form"><input id="ans" class="input" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="İtalyanca sözü yaz..."></form><div class="hint">Qoşa samiti unutma.</div>`);check(d[2],`Düzgün: <b>${d[2]}</b>.`,d[2])}}}
function memory(){let chosen=[W[0],W[2],W[4],W[6],W[8],W[10],W[12],W[14]],cards=[];chosen.forEach((a,i)=>{cards.push({id:i,t:"it",h:`<b>${a[0]}</b>`,say:a[0]});cards.push({id:i,t:"az",h:`<span class="ico">${a[2]}</span><small>🇦🇿 ${a[1]}</small>`})});cards.sort(()=>Math.random()-.5);shell(`<div class="q">8 cütü tap! 🧠</div><div class="az">İtalyanca kartı çevirəndə söz avtomatik səslənir.</div><div class="memory">${cards.map((c,i)=>`<div class="mem" data-i="${i}">❓</div>`).join("")}</div>`);let open=[],matched=0,mist=false;document.querySelectorAll(".mem").forEach((el,i)=>el.onclick=()=>{if(el.classList.contains("open")||open.length===2)return;let c=cards[i];el.classList.add("open");el.innerHTML=c.h;if(c.t==="it")voice(c.say);open.push({el,c});if(open.length===2){if(open[0].c.id===open[1].c.id&&open[0].c.t!==open[1].c.t){open.forEach(x=>x.el.classList.add("matched"));matched++;open=[];score++;if(matched===8)setTimeout(()=>{ri++;qi=0;intro()},700)}else{mist=true;setTimeout(()=>{open.forEach(x=>{x.el.classList.remove("open");x.el.innerHTML="❓"});open=[]},650)}}})}
function factory(){let groups=["cc","ff","gg","ll","mm","nn","rr","tt"],chosen=groups.map(g=>W.find(w=>w[3]===g)),items=[...chosen].sort(()=>Math.random()-.5);shell(`<div class="q">Sözü seç → qoşa samit qutusunu tap.</div><div class="pool">${items.map(w=>`<button class="token" data-w="${w[0]}">${w[2]} ${w[0]}</button>`).join("")}</div><div class="factory">${groups.map(g=>`<div class="bin" data-g="${g}"><b>${g}</b><div class="hint"></div></div>`).join("")}</div>`);let sel=null,done=0,clean={};document.querySelectorAll(".token").forEach(t=>t.onclick=()=>{sel=t;document.querySelectorAll(".token").forEach(x=>x.classList.remove("sel"));t.classList.add("sel");voice(t.dataset.w)});document.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{if(!sel)return;let w=W.find(x=>x[0]===sel.dataset.w);if(w[3]===b.dataset.g){if(!clean[w[0]])score++;voice(w[0]);b.querySelector(".hint").innerHTML=`✅ ${w[0]}`;sel.classList.add("used");sel=null;done++;if(done===8)setTimeout(()=>{ri++;qi=0;intro()},700)}else{clean[w[0]]=1;fail("Bu sözdə başqa qoşa samit var.")}})}
function result(){prog.style.width="100%";route.innerHTML=R.map(()=>`<div class="dot done">✓</div>`).join("");let pct=Math.min(100,Math.round(score/total*100));stage.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:60px">🏆🌱</div><h2>Missione completata!</h2><div class="score">${pct}%</div><div class="az">${score}/${total} ilk-cəhd xalı · Numeri 11–30 + consonanti doppie</div><button class="start" onclick="location.reload()">↻ Yenidən oyna</button></div>`}
intro();
</script></body></html>
