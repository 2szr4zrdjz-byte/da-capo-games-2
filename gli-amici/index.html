body{margin:0;background:#e9f2e9;color:#244335;font:16px/1.6 system-ui}main{max-width:900px;margin:20px auto;background:#fffdf6;padding:24px;border-radius:22px}h1,h2{font-family:Georgia;color:#174c37}button{cursor:pointer;font:inherit;border:0;border-radius:11px;padding:11px 15px;background:#18503b;color:white}button:disabled{opacity:.55}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}nav button{font-size:12px;padding:9px;background:#e0eee3;color:#174c37}nav button.on{background:#174c37;color:white}.card{background:white;border:1px solid #dce9dd;padding:20px;border-radius:15px;margin:15px 0}.az{background:#edf5ee;padding:10px;border-radius:10px;margin:10px 0}.muted{color:#6c7f70;font-size:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button{background:#f1f6f0;color:#204632;border:1px solid #c6dcca;text-align:left}.choices button.good{background:#bce5ca}.choices button.bad{background:#f8d4ce}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.alt{background:#dcebe0;color:#194d36}textarea{box-sizing:border-box;width:100%;min-height:120px;border:2px solid #d5e4d8;border-radius:12px;padding:13px;font:inherit}details{margin:10px 0;padding:10px;background:#f5f8f2;border-radius:10px}summary{cursor:pointer;font-weight:700}.progress{height:9px;background:#dbe8dc;border-radius:10px;margin:15px 0;overflow:hidden}.progress div{height:100%;background:#c4a04d}.feedback{font-weight:700;margin:10px 0}.story{font-size:18px;line-height:1.9}.footer{text-align:center;color:#67816e;font-size:12px}@media(max-width:650px){main{margin:0;padding:14px;border-radius:0}nav{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:1fr}}</style><main><div style="color:#b08b39;font-size:12px;font-weight:800;letter-spacing:.15em">DA CAPO 🌱 · A1–A2 SPEAKING LAB</div><h1>Gli amici — La grande sfida</h1><div class="muted">Söz bazası · Dinləmə · Oxu · Yazı · Danışıq</div><p id="stat"></p><div class="progress"><div id="bar"></div></div><nav id="nav"></nav><section id="app"></section><p class="footer">Da Capo — Hər gün 20 dəqiqə italyanca 💚</p></main><script>
const V=[['il mio migliore amico','mənim ən yaxşı dostum','Il mio migliore amico si chiama Luca.','Ən yaxşı dostumun adı Lukadır.'],['la mia migliore amica','mənim ən yaxşı rəfiqəm','La mia migliore amica vive a Roma.','Ən yaxşı rəfiqəm Romada yaşayır.'],['i miei amici','mənim dostlarım','I miei amici sono molto simpatici.','Mənim dostlarım çox mehribandır.'],['le mie amiche','mənim rəfiqələrim','Le mie amiche studiano italiano.','Mənim rəfiqələrim italyanca öyrənirlər.'],['un amico del cuore','ürək dostu','Marco è un amico del cuore.','Marko ürək dostumdur.'],['una compagnia di amici','dost çevrəsi','Esco con una compagnia di amici.','Dost çevrəmlə gəzməyə çıxıram.'],['simpatico / simpatica','mehriban','Paolo è un ragazzo simpatico.','Paolo mehriban oğlandır.'],['allegro / allegra','şən','Giulia è sempre allegra.','Culiya həmişə şəndir.'],['gentile','nəzakətli','La mia amica è gentile con tutti.','Rəfiqəm hamı ilə nəzakətlidir.'],['aperto / aperta','ünsiyyətə açıq','Sara è una persona aperta.','Sara ünsiyyətə açıq insandır.'],['chiuso / chiusa','qapalı, çəkingən',"A volte sono un po' chiuso.",'Bəzən bir az qapalı oluram.'],['intelligente','ağıllı','Il mio amico è molto intelligente.','Dostum çox ağıllıdır.'],['divertente','əyləncəli','Con Luca non mi annoio mai: è divertente.','Luka ilə heç vaxt darıxmıram: o, əyləncəlidir.'],['sincero / sincera','səmimi','Cerco amici sinceri.','Səmimi dostlar axtarıram.'],['gli stessi interessi','eyni maraqlar','Abbiamo gli stessi interessi.','Eyni maraqlarımız var.'],['una volta alla settimana','həftədə bir dəfə','Ci vediamo una volta alla settimana.','Həftədə bir dəfə görüşürük.'],['il fine settimana','həftəsonu','Il fine settimana usciamo insieme.','Həftəsonu birlikdə gəzirik.'],['uscire','gəzməyə çıxmaq','Mi piace uscire con gli amici.','Dostlarımla gəzməyə çıxmağı sevirəm.'],['fare una gita','gəzintiyə getmək','Domenica facciamo una gita.','Bazar günü gəzintiyə gedirik.'],['andare in vacanza','tətilə getmək','In estate andiamo in vacanza.','Yayda tətilə gedirik.'],['viaggiare','səyahət etmək','Mi piace viaggiare con i miei amici.','Dostlarımla səyahət etməyi sevirəm.'],['discutere','müzakirə etmək','A volte discutiamo di film.','Bəzən filmləri müzakirə edirik.'],['abbracciarsi','qucaqlaşmaq','Quando ci incontriamo, ci abbracciamo.','Görüşəndə qucaqlaşırıq.'],['ridere','gülmək','Ci piace ridere insieme.','Birlikdə gülməyi sevirik.'],['gli occhiali da sole','gün eynəyi','Al mare porto gli occhiali da sole.','Dənizə gün eynəyi aparıram.'],['la barca','qayıq','Facciamo un giro in barca.','Qayıqla gəzintiyə çıxırıq.'],['il mare','dəniz','Andiamo al mare in estate.','Yayda dənizə gedirik.'],['siamo amici da...','... müddətdir dostuq','Siamo amici da cinque anni.','Beş ildir dostuq.']];
const Q=[['Una persona che dice la verità è...','Həqiqəti deyən insan...', ['sincera','chiusa','triste','lontana'],0],['Ci vediamo una volta alla settimana.','Bu nə deməkdir?',['Hər gün görüşürük','Həftədə bir dəfə görüşürük','Ayda bir dəfə görüşürük','Heç vaxt görüşmürük'],1],['Qual è il contrario di «aperto»?','«Aperto» sözünün əksi?', ['intelligente','allegro','chiuso','gentile'],2],['La ___ migliore amica si chiama Sofia.','Mənim ən yaxşı rəfiqəmin adı Sofiyadır.',['mio','mia','suoi','tuo'],1],['«Fare una gita» significa...','İfadənin mənası?', ['gəzintiyə getmək','işləmək','yatmaq','yemək bişirmək'],0],['Preferisco uscire in compagnia.','Bu nə deməkdir?', ['Tək gəzməyi sevirəm','Dostlarla çıxmağı üstün tuturam','Evdə qalıram','İşə gedirəm'],1],['Quanto spesso vi vedete?','Bu sual nəyi soruşur?', ['Nə qədər pul?','Harada?','Nə qədər tez-tez?','Kiminlə?'],2],['Il mio amico è divertente.','Dostum necədir?', ['Əyləncəli','Qəzəbli','Qapalı','Yorğun'],0]];
const L=[{t:'Ciao! Sono Martina. La mia migliore amica si chiama Alice. Ci conosciamo da cinque anni. Lei è allegra e sincera. Il sabato andiamo spesso al mare.',az:'Mən Martinayam. Ən yaxşı rəfiqəmin adı Alisedir. Beş ildir tanışıq. O şən və səmimidir. Şənbələr tez-tez dənizə gedirik.',q:'Da quanto tempo si conoscono?',o:['Da due anni','Da cinque anni','Da un mese','Da dieci anni'],a:1},{t:'Sono Davide. Ho quattro amici molto cari. Ci vediamo una volta alla settimana, di solito il venerdì sera. Parliamo di calcio e ridiamo molto.',az:'Mən Davideyəm. Dörd yaxın dostum var. Həftədə bir dəfə, adətən cümə axşamı görüşürük. Futboldan danışır və çox gülürük.',q:'Quando si incontrano?',o:['Lunedì mattina','Sabato mattina','Venerdì sera','Domenica sera'],a:2},{t:'Mi chiamo Sara. Il mio amico Pietro è intelligente, ma un po chiuso. Io invece sono aperta. Abbiamo interessi diversi, ma amiamo viaggiare.',az:'Mən Sarayam. Dostum Pietro ağıllıdır, amma bir az qapalıdır. Mən isə ünsiyyətciləm. Maraqlarımız fərqlidir, amma səyahəti sevirik.',q:'Che cosa piace a entrambi?',o:['Studiare matematica','Giocare a calcio','Viaggiare','Cucinare'],a:2},{t:'Pronto, Giulia? Sabato non posso venire perché lavoro fino alle otto. Possiamo vederci domenica alle undici davanti al museo?',az:'Alo, Culiya? Şənbə gələ bilmirəm, çünki saat səkkizə qədər işləyirəm. Bazar günü saat on birdə muzeyin qarşısında görüşə bilərik?',q:'Dove vogliono incontrarsi?',o:['Davanti al museo','Alla stazione','Al mare','In biblioteca'],a:0}];
const R={t:'Mi chiamo Lorenzo e ho ventiquattro anni. Il mio migliore amico è Andrea. Siamo amici da quando andavamo alla stessa scuola. Andrea è gentile, divertente e sincero. Io sono un po timido, ma con lui parlo di tutto. Abbiamo una passione in comune: la fotografia. Durante la settimana lavoriamo. Ci vediamo il sabato pomeriggio. A volte facciamo una gita, altre volte andiamo al cinema. Per me un vero amico ascolta e aiuta nei momenti difficili.',az:'Mən Lorenzoyam, 24 yaşım var. Ən yaxşı dostum Andreadır. Eyni məktəbə getdiyimiz vaxtdan dostuq. Andrea nəzakətli, əyləncəli və səmimidir. Mən bir az utancağam, amma onunla hər şey haqqında danışıram. Ortaq həvəsimiz fotoqrafiyadır. Həftə ərzində işləyirik. Şənbə günortadan sonra görüşürük. Bəzən gəzintiyə, bəzən kinoya gedirik. Mənim üçün əsl dost çətin anlarda dinləyir və kömək edir.',qs:[['Quale passione condividono?',['La musica','La fotografia','La cucina','Il calcio'],1],['Quando si vedono?',['Sabato pomeriggio','Ogni mattina','Lunedì sera','Domenica notte'],0],['Com è Andrea?',['Chiuso e triste','Pigro','Gentile e sincero','Sempre nervoso'],2],['Dove vanno a volte?',['Al cinema','In ufficio','In ospedale','A scuola'],0],['Che cosa fa un vero amico?',['Regala soldi','Ascolta e aiuta','Viaggia sempre','Non parla mai'],1]]};
const W=[['Mənim ən yaxşı dostum səmimi və şəndir.','Il mio migliore amico è sincero e allegro.'],['Biz həftədə bir dəfə görüşürük.','Ci vediamo una volta alla settimana.'],['Mən dostlarımla dənizə getməyi xoşlayıram.','Mi piace andare al mare con i miei amici.'],['Mənim rəfiqəm ünsiyyətcildir, amma mən utancağam.','La mia amica è aperta, ma io sono timido.'],['Bizim eyni maraqlarımız var.','Abbiamo gli stessi interessi.'],['Şənbə axşamı dostlarımla çıxıram.','Il sabato sera esco con i miei amici.']];
const S=[['Come si chiama il tuo migliore amico o la tua migliore amica?','Ən yaxşı dostunun adı nədir?','Il mio migliore amico si chiama Marco.'],['Da quanto tempo siete amici?','Neçə müddətdir dostsunuz?','Siamo amici da quattro anni.'],['Com è il suo carattere? Usa tre aggettivi.','Onun xasiyyətini üç sifətlə təsvir et.','È sincero, allegro e intelligente.'],['Quanto spesso vi vedete? Quando e dove?','Nə qədər tez-tez, nə vaxt və harada görüşürsünüz?','Ci vediamo ogni sabato in centro.'],['Avete gli stessi interessi?','Eyni maraqlarınız var?','Sì, ci piace viaggiare insieme.'],['Preferisci uscire con un amico o con un gruppo? Perché?','Bir dostla, yoxsa qrupla çıxmağı üstün tutursan? Niyə?','Preferisco un gruppo perché è divertente.'],['Che cosa fate insieme nel fine settimana?','Həftəsonu birlikdə nə edirsiniz?','Andiamo al cinema e parliamo molto.'],['Secondo te, com è un vero amico?','Səncə əsl dost necə olmalıdır?','Un vero amico deve essere sincero e gentile.']];
const D=[['Ciao! Sabato sei libero? Vorrei andare al mare.','Şənbə boşsan? Dənizə getmək istəyirəm.','Sì, volentieri! A che ora partiamo?'],['Partiamo alle nove. Vuoi invitare un tuo amico?','Saat doqquzda gedirik. Bir dostunu da dəvət etmək istəyirsən?','Sì, invito Luca. È molto simpatico.'],['Che cosa vi piace fare insieme?','Birlikdə nə etməyi sevirsiniz?','Ci piace nuotare e fare fotografie.'],['Ci vediamo davanti alla stazione alle nove?','Saat doqquzda stansiyanın qarşısında görüşək?','Va bene! Ci vediamo alle nove. A sabato!']];
const F=[['Ən yaxşı dostunu ən azı 5 cümlə ilə təqdim et: adı, yaşı, xasiyyəti, maraqları, dostluq müddəti.','Il mio migliore amico si chiama... È... Siamo amici da...'],['Dostlarla ideal həftəsonunu ən azı 5 cümlə ilə təsvir et.','Il sabato... Andiamo... Ci piace...'],['45–60 saniyə «Per me un vero amico...» mövzusunda danış, sonra ən azı 4 cümlə yaz.','Per me un vero amico è... È importante perché...']];
const stages=[['🧠 Söz bazası',V.length],['🎯 Lüğət testi',Q.length],['🎧 Dinləmə',L.length],['📖 Oxu',R.qs.length],['✍️ Yazı',W.length],['🏆 Final',F.length]];
let stage=0,i=0,score=0,awarded=new Set(),saved=[],rec=null,chunks=[];const $=x=>document.getElementById(x),norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
function stop(){speechSynthesis.cancel()}function say(t,r=.85){stop();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=r;u.voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('it'))||null;speechSynthesis.speak(u)}
function pts(n){let k=stage+'-'+i;if(!awarded.has(k)){awarded.add(k);score+=n;$('stat').textContent='⭐ '+score+' xal · Tapşırıq '+(i+1)+'/'+stages[stage][1]}}
function jump(n){stop();stage=n;i=0;render()}function next(){stop();if(i<stages[stage][1]-1)i++;else if(stage<5){stage++;i=0}else return finish();render()}
function box(s){return '<div class="card">'+s+'</div>'}function act(s){return '<div class="actions">'+s+'</div>'}function b(s,fn,alt=false){return '<button class="'+(alt?'alt':'')+'" onclick="'+fn+'">'+s+'</button>'}
function opts(a){return '<div class="choices">'+a.map((x,j)=>b(''+String.fromCharCode(65+j)+') '+x,'pick('+j+')')).join('')+'</div>'}
function feedback(){return '<div id="feedback" class="feedback"></div>'}function input(){return '<textarea id="response" placeholder="Scrivi in italiano..."></textarea>'}function audio(){return act(b('▶ Dinlə','play()',false)+b('🐢 Yavaş dinlə','slow()',true)+b('■ Dayandır','stop()',true))}
function mic(){return box('<b>🎤 Danışıq laboratoriyası</b><p class="muted">Danış və nitqini mətnə çevir; yaxud səsini yazıb yenidən dinlə. Nitqin tanınması brauzerdən asılıdır.</p>'+act(b('🎙️ Danış və yaz','recognize()',true)+b('⏺ Səs yaz / dayandır','record()',true))+'<audio id="recordplay" controls style="display:none;max-width:100%"></audio><p class="muted" id="micstatus"></p>')}
function render(){$('nav').innerHTML=stages.map((s,j)=>'<button class="'+(stage===j?'on':'')+'" onclick="jump('+j+')">'+s[0]+'</button>').join('');$('stat').textContent='⭐ '+score+' xal · Tapşırıq '+(i+1)+'/'+stages[stage][1];$('bar').style.width=((stage+i/stages[stage][1])/6*100)+'%';let h='<h2>'+stages[stage][0]+'</h2>';if(stage===0){let v=V[i];h+=box('<p class="muted">Söz '+(i+1)+'/'+V.length+'</p><h2>'+v[0]+'</h2>'+b('🔊 Tələffüz','play()')+'<div class="az">🇦🇿 '+v[1]+'</div><p><b>Nümunə:</b> '+v[2]+'</p><div class="az">🇦🇿 '+v[3]+'</div>'+b('🔊 Nümunəni dinlə','say(V[i][2])',true)+'<p>İfadəni ucadan üç dəfə təkrarla və öz cümləndə işlət.</p>'+b('✓ Öyrəndim (+2)','pts(2)'))}
if(stage===1){let q=Q[i];h+=box('<h3>'+q[0]+'</h3><div class="az">'+q[1]+'</div>'+opts(q[2]))+feedback()}
if(stage===2){let q=L[i];h+=box('<h3>Ascolta e rispondi</h3>'+audio()+'<div class="az">🇦🇿 '+q.az+'</div><h3>'+q.q+'</h3>'+opts(q.o))+feedback()}
if(stage===3){let q=R.qs[i];h+=box('<details open><summary>📖 Lorenzo e Andrea — mətn</summary><p class="story">'+R.t+'</p>'+audio()+'</details><div class="az">🇦🇿 '+R.az+'</div><h3>'+q[0]+'</h3>'+opts(q[1]))+feedback()}
if(stage===4){h+=box('<h3>🇦🇿 '+W[i][0]+'</h3>'+input()+act(b('✓ Yoxla','checkWrite()')))+feedback()}
if(stage===5){h+=box('<h3>'+F[i][0]+'</h3><details><summary>💡 Kömək</summary>'+F[i][1]+'</details>'+input()+act(b('✓ Finalı tamamladım','submitOpen()')))+feedback()}
h+=act(b(i===stages[stage][1]-1?'Növbəti mərhələ →':'Növbəti tapşırıq →','next()'));$('app').innerHTML=h}
function play(){say(stage===0?V[i][0]:stage===2?L[i].t:stage===3?R.t:'')}function slow(){say(stage===2?L[i].t:R.t,.63)}
function pick(j){let q=stage===1?Q[i]:stage===2?L[i]:R.qs[i],a=stage===1?q[3]:stage===2?q.a:q[2],o=stage===1?q[2]:stage===2?q.o:q[1];document.querySelectorAll('.choices button').forEach((x,k)=>{x.disabled=true;if(k===a)x.classList.add('good');else if(k===j)x.classList.add('bad')});if(j===a)pts(10);$('feedback').textContent=j===a?'✓ Bravissimo! +10 xal':'Düzgün cavab: '+o[a];if(stage===1&&j===a){let old=i;setTimeout(()=>{if(stage===1&&i===old)next()},850)}}
function checkWrite(){let v=$('response').value.trim();if(!v)return alert('Cavab yaz.');let a=W[i][1],ok=norm(v)===norm(a);if(ok)pts(15);$('feedback').innerHTML=(ok?'✓ Perfetto! +15 xal':'Alternativ düzgün ifadələr də mümkündür.')+'<p>Nümunə: <b>'+a+'</b></p>'+b('🔊 Nümunəni dinlə','say(W[i][1])',true)+'<p class="muted">Avtomatik yoxlama bütün düzgün variantları tanımır.</p>'}
function submitOpen(){let v=$('response').value.trim(),min=stage===5?20:4;if(v.split(/\s+/).length<min)return alert('Daha ətraflı cavab ver (ən azı '+min+' söz).');pts(stage===5?20:10);saved.push({q:F[i][0],a:v});let model=F[i][1];$('feedback').innerHTML='✓ Cavab qeydə alındı. Nümunə: <b>'+model+'</b><p class="muted">Bu iştirak xalındır. Danışıq və yazının keyfiyyətini müəllim yoxlamalıdır.</p>'+b('🔊 Nümunəni dinlə','say('+JSON.stringify(model).replace(/"/g,'&quot;')+')',true)}
function recognize(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Bu brauzer nitqin tanınmasını dəstəkləmir. Cavabı yaz.');let r=new SR();r.lang='it-IT';r.onresult=e=>{$('response').value=($('response').value+' '+e.results[0][0].transcript).trim()};r.onerror=e=>alert('Mikrofon xətası: '+e.error);r.start()}
async function record(){if(rec&&rec.state==='recording'){rec.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let a=$('recordplay');if(a){a.src=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));a.style.display='block'}stream.getTracks().forEach(t=>t.stop());if($('micstatus'))$('micstatus').textContent='Səs hazırdır — dinlə.'};rec.start();$('micstatus').textContent='🔴 Yazılır. Dayandırmaq üçün yenidən bas.'}catch(e){alert('Mikrofon icazəsi və ya HTTPS lazımdır: '+e.message)}}
function finish(){$('bar').style.width='100%';$('app').innerHTML=box('<h2>🏆 Complimenti!</h2><h2>'+score+' xal</h2><p>6 mərhələ · 54 tapşırıq. Söz bazası, dinləmə, oxu və yazı!</p><p class="muted">Final yazı tapşırıqları iştirak xalı ilə qiymətləndirilib. Dəqiq dil qiymətləndirməsi müəllim tərəfindən aparılmalıdır.</p>'+act(b('📄 Cavablarımı saxla','download()')+b('↻ Yenidən başla','reset()',true)))}
function download(){let text='DA CAPO — GLI AMICI\nXal: '+score+'\n\n'+saved.map(x=>x.q+'\n'+x.a).join('\n\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='Da_Capo_Gli_Amici_Cavablar.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function reset(){stage=0;i=0;score=0;awarded.clear();saved=[];render()}render();
</script></html>
