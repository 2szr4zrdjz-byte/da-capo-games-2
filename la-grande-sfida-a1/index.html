<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo — La Grande Sfida</title><style>:root{--g:#194937;--gold:#bd913d}*{box-sizing:border-box}body{margin:0;background:#eaf0e9;font:16px/1.55 system-ui;color:#244033}main{max-width:850px;margin:22px auto;background:#fffcf3;padding:25px;border-radius:24px}h1,h2{font-family:Georgia;color:var(--g)}h1{margin:0}button,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;background:var(--g);color:white;font-weight:700}button:disabled{opacity:.75;cursor:default}.light{background:#e1ede4;color:var(--g)}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.muted{color:#6a8070;font-size:14px}.tag{display:inline-block;background:#e4efe6;padding:7px 11px;border-radius:30px;margin:3px;font-weight:700}.bar{height:10px;border-radius:12px;background:#e0e6dd;margin:20px 0;overflow:hidden}.bar div{height:100%;width:0;background:var(--gold);transition:.3s}.card{background:white;border:1px solid #dce7db;border-radius:17px;padding:18px;margin:15px 0}.az{background:#eaf3eb;border-radius:10px;padding:9px 13px;color:#41644d}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.choices button{background:#f6f9f5;color:var(--g);border:2px solid #dce6dc;text-align:left}.choices .correct{background:#d6f2de;border-color:#319d5b}.choices .wrong{background:#ffe1dc;border-color:#bf5858}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.hidden{display:none}.story{background:#f1f6ee;border-left:5px solid var(--gold);padding:16px;line-height:1.9}.feedback{font-weight:700;margin:13px 0}textarea{width:100%;padding:13px;min-height:110px;border:2px solid #d4e3d7;border-radius:12px}details{margin:12px 0}summary{cursor:pointer;font-weight:700}.roundnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.roundnav button{background:#e1ede4;color:var(--g);padding:9px 7px;font-size:13px}.roundnav button.active{background:var(--g);color:white}.translation{padding:15px;background:#fff7e7;border-radius:12px;line-height:1.8}.report{padding:20px;background:#e9f4e8;border-radius:16px}@media(max-width:600px){main{margin:0;min-height:100vh;border-radius:0;padding:15px} .choices{grid-template-columns:1fr}.roundnav{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><small style="color:#a37c33;letter-spacing:2px;font-weight:900">DA CAPO 🌱 · A1</small><h1>La Grande Sfida 🇮🇹</h1><div class="muted">Oxu · Yazı · Danışıq · Dinləmə · Qrammatika</div></div><div><span class="tag" id="stage"></span><span class="tag" id="score"></span></div></div><nav class="roundnav" id="roundnav" aria-label="Raund seçimi"></nav><div class="bar"><div id="bar"></div></div><section id="app"></section><p class="muted" style="text-align:center">Da Capo · Hər gün 20 dəqiqə italyanca 💚</p></main><script>
const S=[
{title:'1. Grammatica in azione',type:'quiz',questions:[
['Marta e Luca ___ al museo.','Marta və Luka muzeyə gedirlər.','vanno|va|andate|andiamo',0],['Io non ___ venire domani.','Mən sabah gələ bilmirəm.','posso|puoi|può|possiamo',0],['Voi ___ una mano alla professoressa?','Siz müəlliməyə kömək edirsiniz?','date|danno|dai|diamo',0],['Andiamo ___ treno.','Biz qatarla gedirik.','in|a|da|con',0],['Lucia torna ___ sua nonna.','Luçiya nənəsigilə qayıdır.','da|a|in|con',0],['Marco ___ a tennis ogni venerdì.','Marko hər cümə tennis oynayır.','gioca|giochi|giocano|gioco',0],['Tu ___ parlare italiano?','Sən italyanca danışmağı bacarırsan?','sai|sa|so|sanno',0],['Le chiavi sono ___ zaino.','Açarlar çantanın içindədir.','nello|sullo|dallo|allo',0]]},
{title:'2. Leggi e scopri',type:'reading',story:'Mi chiamo Giulia, ho ventitré anni e abito a Torino con mia sorella Elena. Ogni mattina esco di casa alle sette e venticinque. Vado all’università in autobus, ma il venerdì ci vado a piedi perché ho più tempo. Elena lavora in una libreria vicino alla stazione. Oggi è sabato: vogliamo preparare una cena per i nostri amici. Io devo comprare le verdure, mentre Elena vuole fare un dolce. Alle cinque andiamo al supermercato. Dopo la spesa, torno a casa e metto le borse sotto il tavolo della cucina. Alle otto e mezzo arrivano i nostri amici.',questions:[
['Con chi abita Giulia?','Culiya kiminlə yaşayır?','Con sua sorella.|Con i suoi genitori.|Da sola.|Con due amici.',0],['Come va Giulia all’università di solito?','Culiya adətən universitetə necə gedir?','In autobus.|In treno.|In macchina.|In bicicletta.',0],['Perché il venerdì va a piedi?','Niyə cümə günü piyada gedir?','Perché ha più tempo.|Perché perde l’autobus.|Perché è domenica.|Perché abita in biblioteca.',0],['Dove lavora Elena?','Elena harada işləyir?','In una libreria.|In un ristorante.|In una scuola.|In un ospedale.',0],['Che cosa deve comprare Giulia?','Culiya nə almalıdır?','Le verdure.|Il pane.|I libri.|I biglietti.',0],['A che ora arrivano gli amici?','Dostlar saat neçədə gəlirlər?','Alle otto e mezzo.|Alle cinque.|Alle nove meno venti.|A mezzogiorno.',0]]},
{title:'3. Scrivi in italiano',type:'writing',questions:[
['Mən hər gün saat yeddidə evdən çıxıram.','Ogni giorno esco di casa alle sette.','Ogni giorno esco di casa alle sette.|Esco di casa alle sette ogni giorno.'],['Biz sabah Romaya getmək istəyirik.','Domani vogliamo andare a Roma.','Domani vogliamo andare a Roma.|Vogliamo andare a Roma domani.'],['Mənim kitabım masanın altındadır.','Il mio libro è sotto il tavolo.','Il mio libro è sotto il tavolo.'],['Siz italyanca danışa bilirsiniz?','Potete parlare italiano?','Potete parlare italiano?|Voi potete parlare italiano?'],['Sən nə vaxt məktəbdən qayıdırsan?','Quando torni da scuola?','Quando torni da scuola?|Tu quando torni da scuola?'],['O (qadın) axşam saat doqquza on dəqiqə qalmış gəlir.','Lei arriva alle nove meno dieci di sera.','Lei arriva alle nove meno dieci di sera.|Arriva alle nove meno dieci di sera.']]},
{title:'4. Ascolta e scrivi',type:'listening',questions:[
['Oggi non posso uscire perché devo studiare.','Bu gün çölə çıxa bilmirəm, çünki dərs oxumalıyam.'],['Il treno per Firenze parte alle dieci e venticinque.','Florensiyaya qatar saat on iyirmi beşdə yola düşür.'],['La farmacia è accanto alla banca, davanti al parco.','Aptek bankın yanında, parkın qarşısındadır.'],['Quanti studenti vengono a lezione domani?','Sabah dərsə neçə tələbə gəlir?']]},
{title:'5. Parla con Sofia',type:'speaking',questions:[
['Ciao! Come ti chiami?','Salam! Adın nədir?','Mi chiamo ...'],['Di dove sei e dove abiti?','Haralısan və harada yaşayırsan?','Sono di ... e abito a ...'],['A che ora esci di casa di solito?','Adətən saat neçədə evdən çıxırsan?','Esco di casa alle ...'],['Come vai al lavoro o all’università?','İşə və ya universitetə necə gedirsən?','Vado ... in autobus / a piedi.'],['Che cosa vuoi fare questo fine settimana?','Bu həftəsonu nə etmək istəyirsən?','Voglio + infinito'],['Dov’è il tuo telefono adesso?','Telefonun indi haradadır?','È sul / sotto / dentro ...']]},
{title:'6. Prova finale',type:'final',questions:[
['Öz gündəlik həyatın haqqında italyanca 5–7 cümlə yaz. Saat, nəqliyyat, modal feil və məkan ifadəsi işlət.','Mi chiamo Anna e abito a Milano. Di solito esco di casa alle otto. Vado al lavoro in autobus. Voglio studiare italiano. Il mio libro è sulla scrivania.'],['Dostunla həftəsonu görüşünü planlaşdıran ən azı 6 replikalı italyanca dialoq yaz. Harada, nə vaxt, necə gedəcəyinizi soruşun.','A: Vuoi andare al cinema sabato?\nB: Sì! A che ora?\nA: Alle sei e mezzo.\nB: Dove ci vediamo?\nA: Davanti al cinema. Vieni in autobus?\nB: No, vengo a piedi. A sabato!']]}
];
let level=0,i=0,score=0,scores=[0,0,0,0,0,0],locked=false,spoken=[],awarded=new Set();const E=id=>document.getElementById(id);const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?;:«»“”’']/g,'').replace(/\s+/g,' ').trim();function say(t,rate=.83){if(!window.speechSynthesis)return alert('Səsləndirmə dəstəklənmir.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=rate;u.voice=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('it'))||null;speechSynthesis.speak(u)}function jump(k){speechSynthesis?.cancel();level=k;i=0;render()}function stopAudio(){if(window.speechSynthesis)speechSynthesis.cancel()}function update(){E('roundnav').innerHTML=S.map((s,k)=>'<button class="'+(k===level?'active':'')+'" onclick="jump('+k+')">'+s.title+'</button>').join('');E('stage').textContent='Raund '+Math.min(level+1,6)+'/6';E('score').textContent=score+' xal';E('bar').style.width=(100*(level+i/(S[level]?.questions.length||1))/6)+'%'}function render(){update();if(level===6)return finish();locked=false;let s=S[level],q=s.questions[i],out='<h2>'+s.title+'</h2><p class="muted">Tapşırıq '+(i+1)+' / '+s.questions.length+'</p>';if(s.type==='reading')out+='<details open class="card"><summary>📖 Giulia — Un sabato speciale</summary><div class="story">'+s.story+'</div><div class="actions"><button class="light" onclick="say(S[1].story)">🔊 Mətni dinlə</button><button class="light" onclick="say(S[1].story,.65)">🐢 Yavaş dinlə</button><button class="light" onclick="stopAudio()">⏹ Səsləndirməni dayandır</button></div><details><summary>🇦🇿 Mətnin tərcüməsini göstər / gizlət</summary><div class="translation">Mənim adım Culiadır, iyirmi üç yaşım var və bacım Elena ilə Turində yaşayıram. Hər səhər saat yeddi iyirmi beşdə evdən çıxıram. Universitetə avtobusla gedirəm, amma cümə günləri daha çox vaxtım olduğu üçün ora piyada gedirəm. Elena vağzalın yaxınlığındakı kitab mağazasında işləyir. Bu gün şənbədir: dostlarımız üçün şam yeməyi hazırlamaq istəyirik. Mən tərəvəz almalıyam, Elena isə şirniyyat hazırlamaq istəyir. Saat beşdə supermarketə gedirik. Alış-verişdən sonra evə qayıdıram və çantaları mətbəx masasının altına qoyuram. Saat səkkiz yarıda dostlarımız gəlirlər.</div></details></details>';if(s.type==='quiz'||s.type==='reading'){out+='<div class="card"><h3>'+q[0]+'</h3><div class="az">🇦🇿 '+q[1]+'</div><div class="choices">'+q[2].split('|').map((x,j)=>'<button onclick="choose('+j+')">'+x+'</button>').join('')+'</div></div>'}if(s.type==='writing'){out+='<div class="card"><h3>🇦🇿 '+q[0]+'</h3><p class="muted">İtalyanca yaz. Durğu işarələri və böyük-kiçik hərf nəzərə alınmır.</p><textarea id="response" placeholder="Scrivi in italiano..."></textarea><div class="actions"><button onclick="checkWriting()">Yoxla</button></div></div>'}if(s.type==='listening'){out+='<div class="card"><h3>🔊 Dinlə və eşitdiyini yaz</h3><div class="actions"><button onclick="say(S[3].questions[i][0])">▶ Dinlə</button><button class="light" onclick="say(S[3].questions[i][0],.63)">🐢 Yavaş</button></div><textarea id="response" placeholder="Scrivi quello che senti..."></textarea><details><summary>🇦🇿 Tərcüməyə bax</summary>'+q[1]+'</details><div class="actions"><button onclick="checkListening()">Yoxla</button></div></div>'}if(s.type==='speaking'){out+='<div class="card"><h3>👩 Sofia: '+q[0]+'</h3><div class="az">🇦🇿 '+q[1]+'</div><div class="actions"><button class="light" onclick="say(S[4].questions[i][0])">🔊 Sofianı dinlə</button><button class="light" onclick="recognize()">🎤 Danış və mətni tanıt</button></div><div id="status" class="muted">Mikrofon dəstəklənmirsə, cavabı yaz və ucadan de.</div><textarea id="response" placeholder="La mia risposta..."></textarea><details><summary>💡 Kömək</summary>'+q[2]+'</details><div class="actions"><button onclick="checkSpeaking()">Cavabımı tamamladım</button></div><p class="muted">Nitqin avtomatik tanınması tələffüzün düzgün qiymətləndirilməsi demək deyil.</p></div>'}if(s.type==='final'){out+='<div class="card"><h3>'+q[0]+'</h3><textarea id="response" style="min-height:190px" placeholder="Scrivi in italiano..."></textarea><div class="actions"><button onclick="checkFinal()">Yazını tamamladım</button></div></div>'}out+='<div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="hidden" onclick="next()">Növbəti →</button></div>';E('app').innerHTML=out}function reward(n,msg){if(locked)return;locked=true;let key=level+':'+i;if(awarded.has(key))n=0;else awarded.add(key);score+=n;scores[level]+=n;E('feedback').innerHTML=msg;E('next').classList.remove('hidden');update()}function choose(j){if(locked)return;let q=S[level].questions[i],a=+q[3];document.querySelectorAll('.choices button').forEach((b,k)=>{b.disabled=true;if(k===a)b.classList.add('correct');else if(k===j)b.classList.add('wrong')});reward(j===a?10:0,j===a?'✅ Bravissimo! +10 xal':'💡 Düzgün cavab: '+q[2].split('|')[a])}function checkWriting(){let v=E('response').value,q=S[2].questions[i];if(!v.trim())return alert('Cümləni yaz.');let ok=q[2].split('|').some(x=>norm(x)===norm(v));reward(ok?15:0,ok?'✅ Perfetto! +15 xal':'💡 Nümunə: '+q[1]+'<p class="muted">Başqa düzgün variantlar da mümkündür. Avtomatik yoxlama məhduddur.</p>')}function checkListening(){let v=E('response').value,q=S[3].questions[i];if(!v.trim())return alert('Eşitdiyini yaz.');let ok=norm(v)===norm(q[0]);reward(ok?15:0,ok?'✅ Ottimo! +15 xal':'💡 Düzgün mətn: '+q[0])}function checkSpeaking(){let v=E('response').value.trim();if(!v)return alert('Cavabını yaz və ya mikrofondan istifadə et.');spoken.push([S[4].questions[i][0],v]);reward(10,'✅ Danışıq cəhdinə +10 iştirak xalı. Nümunə: '+S[4].questions[i][2]+'<p class="muted">Qrammatika və tələffüzün dəqiq qiyməti deyil; müəllim yoxlamalıdır.</p>')}function checkFinal(){let v=E('response').value.trim();if(v.split(/\s+/).length<12)return alert('Ən azı 12 söz yaz.');let n=Math.min(20,Math.max(5,v.split(/[.!?\n]+/).filter(x=>x.trim()).length*3));reward(n,'✅ Yazı tamamlandı. Nümunə:<div class="story">'+S[5].questions[i][1].replace(/\n/g,'<br>')+'</div><p class="muted">Bu, yazı həcminə görə iştirak xalındır; müəllim tərəfindən yoxlanmalıdır.</p>')}function next(){stopAudio();i++;if(i===S[level].questions.length){i=0;level++}render()}function recognize(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){E('status').textContent='Brauzer nitq tanımanı dəstəkləmir. Cavabı yaz.';return}let r=new SR();r.lang='it-IT';r.onresult=e=>{E('response').value=e.results[0][0].transcript;E('status').textContent='Nitq mətnə çevrildi. Yoxla və düzəlt.'};r.onerror=e=>E('status').textContent='Mikrofon xətası: '+e.error;r.start();E('status').textContent='Danış...'}function finish(){E('bar').style.width='100%';E('app').innerHTML='<div class="report"><h2>🏆 Bravissimo! '+score+' xal</h2><p>6 raund · 32 tapşırıq</p>'+['Qrammatika','Oxu','Yazı','Dinləmə','Danışıq','Sərbəst yazı'].map((x,k)=>'<p><b>'+x+':</b> '+scores[k]+' xal</p>').join('')+'<p class="muted">Danışıq və sərbəst yazı balları iştirak göstəricisidir, müəllim qiymətləndirməsini əvəz etmir.</p><div class="actions"><button onclick="download()">📄 Nəticəni saxla</button><button class="light" onclick="level=0;i=0;score=0;scores=[0,0,0,0,0,0];spoken=[];awarded.clear();render()">🔁 Yenidən başla</button></div></div>'}function download(){let t='DA CAPO — LA GRANDE SFIDA\nÜmumi: '+score+' xal\n'+scores.join(' / ')+'\nDanışıq cavabları:\n'+spoken.map(x=>x.join('\n')).join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='Da_Capo_A1_Netice.txt';a.click()}render();</script></body></html>
