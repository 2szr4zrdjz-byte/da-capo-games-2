<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo — Andare & Venire</title><style>
:root{--g:#174c3b;--gold:#d7ad43;--bg:#faf8ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#18332b;font:16px/1.5 system-ui}.wrap{max-width:850px;margin:auto;padding:15px}header{background:var(--g);color:white;border-radius:22px;padding:25px}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(28px,6vw,43px);margin:0}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}button{cursor:pointer;border:1px solid #bcd0c1;border-radius:12px;padding:12px 15px;background:white;color:var(--g);font:inherit;font-weight:700}button.active,.primary{background:var(--g);color:white}button:disabled{opacity:.45;cursor:default}.card{background:white;border:1px solid #e6e5d9;border-radius:20px;padding:23px;margin:15px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.options button{text-align:left}.options .selected{background:#e5f2e8;border:2px solid var(--g)}.feedback{padding:14px;border-radius:12px;background:#edf6ec;margin:15px 0}.bad{background:#ffedeb}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.field{width:100%;border:2px solid #cbdacf;border-radius:12px;padding:13px;font:inherit;font-size:18px;margin:12px 0}.bar{height:8px;background:#e1e9df;border-radius:9px;overflow:hidden;margin:15px 0}.bar div{height:100%;background:var(--gold)}.big{font-size:23px;font-weight:750;margin:20px 0}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#617468}.speak{padding:5px 9px}.tag{font-size:13px;font-weight:800;color:#567363}@media(max-width:530px){.options{grid-template-columns:1fr}.card{padding:16px}}</style></head><body><main class="wrap"><header><div>🌱 DA CAPO · A1</div><h1>ANDARE & VENIRE</h1><div>Presente indicativo · Verbi irregolari · Dərin praktika</div></header><nav class="tabs" id="tabs"></nav><div id="app"></div></main><script>
const people=['io','tu','lui/lei/Lei','noi','voi','loro'],verbs={andare:['vado','vai','va','andiamo','andate','vanno'],venire:['vengo','vieni','viene','veniamo','venite','vengono']},titles=['📖 Öyrən','⚡ Sürətli seçim','✍️ Boşluqlar','💬 Tərcümə','🏆 İmtahan'];let mode=0,idx=0,chosen='',done=false,score=0,mistakes=[],exam=[],studyVerb='andare',studyPerson=0;
const $=x=>document.getElementById(x),norm=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim(),shuffle=x=>[...x].sort(()=>Math.random()-.5);
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.85;u.voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('it'))||null;speechSynthesis.speak(u)}
function audio(t){return '<button class="speak" data-audio="'+t.replace(/"/g,'&quot;')+'">🔊</button>'}
function bind(){document.querySelectorAll('[data-audio]').forEach(x=>x.onclick=()=>say(x.dataset.audio))}
let mcq=[];for(let verb of ['andare','venire'])for(let i=0;i<6;i++){let answer=verbs[verb][i],opts=shuffle([answer,...shuffle(Object.values(verbs).flat().filter(x=>x!==answer)).slice(0,3)]);mcq.push({type:'mcq',prompt:people[i]+' — '+verb.toUpperCase(),answer,opts,explain:people[i]+' '+answer})}
const fillRaw=[
['Ma perché Tiziana e Mauro ___ in centro a quest’ora?','vanno','Tiziana e Mauro = loro → vanno'],
['Ragazzi, stasera noi ___ a ballare, voi che fate?','andiamo','noi + andare → andiamo'],
['Perché non ___ anche voi al cinema?','venite','voi + venire → venite'],
['Carla, a che ora ___ a scuola la mattina?','vai','Carla ilə tu formasında danışılır → vai'],
["Quando ___ all’aeroporto Paolo?",'va','Paolo = lui → va'],
['Domani ___ con te a Milano. (io, venire)','vengo','io + venire → vengo'],
['Ogni lunedì io ___ in biblioteca. (andare)','vado','io + andare → vado'],
['Tu ___ alla festa con noi? (venire)','vieni','tu + venire → vieni'],
['Mia sorella ___ a Roma domani. (andare)','va','mia sorella = lei → va'],
['Noi ___ da te alle otto. (venire)','veniamo','noi + venire → veniamo'],
['Voi ___ spesso in Italia? (andare)','andate','voi + andare → andate'],
['I miei amici ___ a casa mia. (venire)','vengono','i miei amici = loro → vengono'],
['Io non ___ oggi: sono stanco. (venire)','vengo','io + venire → vengo'],
['Dove ___ tu dopo la lezione? (andare)','vai','tu + andare → vai'],
['Quando ___ i tuoi genitori? (venire)','vengono','i tuoi genitori = loro → vengono'],
['Lei, signora, ___ con noi? (venire)','viene','Rəsmi Lei → viene'],
['Loro ___ al lavoro in autobus. (andare)','vanno','loro + andare → vanno'],
['Noi ___ al supermercato. (andare)','andiamo','noi + andare → andiamo'],
['Marco ___ da me dopo cena. (venire)','viene','Marco = lui → viene'],
['Io ___ a casa, tu ___ con me? (andare / venire)','vado, vieni','io vado; tu vieni']
];let fill=fillRaw.map(([prompt,answer,explain])=>({type:'fill',prompt,answer,explain}));
const trRaw=[
['Mən hər gün məktəbə gedirəm.','Vado a scuola ogni giorno.','Ogni giorno vado a scuola.'],
['Sən sabah bizə gəlirsən?','Vieni da noi domani?','Domani vieni da noi?','Vieni a casa nostra domani?'],
['O (kişi) Romaya gedir.','Lui va a Roma.','Va a Roma.'],
['Biz sizinlə gəlirik.','Veniamo con voi.','Noi veniamo con voi.'],
['Siz bu axşam kinoya gedirsiniz?','Andate al cinema stasera?','Stasera andate al cinema?'],
['Onlar hər bazar buraya gəlirlər.','Vengono qui ogni domenica.','Ogni domenica vengono qui.'],
['Mən bu gün işə getmirəm.','Non vado al lavoro oggi.','Oggi non vado al lavoro.'],
['Sən mənimlə gəlirsən?','Vieni con me?','Tu vieni con me?'],
['Biz sabah Milana gedirik.','Andiamo a Milano domani.','Domani andiamo a Milano.'],
['Maria saat səkkizdə gəlir.','Maria viene alle otto.','Alle otto viene Maria.'],
['Siz hara gedirsiniz?','Dove andate?','Dove andate voi?'],
['Sən nə vaxt gəlirsən?','Quando vieni?','Quando vieni tu?']
];let translate=trRaw.map(([prompt,...answers])=>({type:'translation',prompt,answer:answers[0],answers,explain:'Nümunə: '+answers[0]}));
function switchMode(n){mode=n;idx=0;chosen='';done=false;score=0;mistakes=[];if(n===4)exam=shuffle([...mcq,...fill,...translate]).slice(0,20);render()}
function render(){ $('tabs').innerHTML=titles.map((x,i)=>'<button data-mode="'+i+'" class="'+(mode===i?'active':'')+'">'+x+'</button>').join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(+b.dataset.mode));if(mode===0)return learn();let pool=mode===1?mcq:mode===2?fill:mode===3?translate:exam;if(idx>=pool.length)return finish(pool);let q=pool[idx];$('app').innerHTML='<section class="card"><div class="row"><span class="tag">'+titles[mode]+'</span><strong>'+ (idx+1)+' / '+pool.length+'</strong></div><div class="bar"><div style="width:'+(100*idx/pool.length)+'%"></div></div><div class="muted">'+(q.type==='translation'?'Azərbaycan dilindən italyancaya tərcümə et':q.type==='fill'?'Boşluğu düzgün forma ilə tamamla':'Düzgün formanı seç')+'</div><div class="big">'+q.prompt+'</div><div id="answer"></div><div id="feedback"></div><div class="row"><button class="primary" id="check">Yoxla</button><button id="next" disabled>Növbəti →</button><button id="skip">Keç</button></div><p class="muted">Böyük/kiçik hərflər və durğu işarələri nəzərə alınmır.</p></section>';if(q.type==='mcq'){$('answer').className='options';$('answer').innerHTML=q.opts.map((o,i)=>'<button data-opt="'+i+'">'+o+' '+audio(o)+'</button>').join('');$('answer').querySelectorAll('[data-opt]').forEach(b=>b.onclick=e=>{if(done||e.target.closest('[data-audio]'))return;chosen=q.opts[+b.dataset.opt];$('answer').querySelectorAll('[data-opt]').forEach(c=>c.classList.toggle('selected',b===c))})}else{$('answer').innerHTML='<input class="field" id="input" placeholder="İtalyanca yaz..." autocomplete="off" spellcheck="false">'+(q.type==='fill'?audio(q.prompt.replace('___','...')):'');$('input').onkeydown=e=>{if(e.key==='Enter')done?next():check()}}$('check').onclick=check;$('next').onclick=next;$('skip').onclick=()=>{mistakes.push(q);idx++;done=false;chosen='';render()};bind()}
function check(){if(done)return;let q=(mode===1?mcq:mode===2?fill:mode===3?translate:exam)[idx],v=q.type==='mcq'?chosen:$('input').value.trim();if(!v){$('feedback').innerHTML='<div class="feedback bad">Əvvəl cavab daxil et.</div>';return}done=true;let ok=q.type==='translation'?q.answers.some(x=>norm(x)===norm(v)):norm(q.answer)===norm(v);if(ok)score++;else mistakes.push(q);$('feedback').innerHTML='<div class="feedback '+(ok?'':'bad')+'"><b>'+(ok?'✅ Bravissimo!':'❌ Düzgün cavab: '+q.answer)+'</b><p>'+q.explain+'</p>'+audio(q.type==='fill'?q.prompt.replace('___',q.answer):q.answer)+'</div>';$('check').disabled=true;$('next').disabled=false;bind()}
function next(){idx++;done=false;chosen='';render()}
function finish(pool){$('app').innerHTML='<section class="card"><h2>🎉 Mərhələ tamamlandı!</h2><div class="big">'+score+' / '+pool.length+' · '+Math.round(100*score/pool.length)+'%</div><p>Səhv və ya keçilmiş tapşırıqlar: '+mistakes.length+'</p><div class="row"><button class="primary" id="retry">Yenidən oyna</button><button id="mist" '+(mistakes.length?'':'disabled')+'>Səhvləri təkrarla</button><button id="advance">Növbəti mərhələ →</button></div></section>';$('retry').onclick=()=>switchMode(mode);$('advance').onclick=()=>switchMode(Math.min(4,mode+1));$('mist').onclick=()=>{exam=[...mistakes];mode=4;idx=0;score=0;mistakes=[];render()}}
function learn(){let v=studyVerb;$('app').innerHTML='<section class="card"><h2>1. Formanı öyrən</h2><p><b>Andare</b> = getmək · <b>Venire</b> = gəlmək. Hər ikisi qeyri-müntəzəm feildir.</p><div class="row"><button id="go" class="'+(v==='andare'?'primary':'')+'">ANDARE</button><button id="come" class="'+(v==='venire'?'primary':'')+'">VENIRE</button></div><table><thead><tr><th>Şəxs</th><th>Forma</th><th>Dinlə</th></tr></thead><tbody>'+people.map((p,i)=>'<tr><td>'+p+'</td><td><b>'+verbs[v][i]+'</b></td><td>'+audio(p.split('/')[0]+' '+verbs[v][i])+'</td></tr>').join('')+'</tbody></table><div class="card" style="background:#f3f8ee"><span class="tag">Yadda saxla · '+(studyPerson+1)+'/6</span><div class="big">'+people[studyPerson]+' → '+verbs[v][studyPerson]+' '+audio(verbs[v][studyPerson])+'</div><div class="row"><button id="prev">← Əvvəlki</button><button id="later">Növbəti →</button></div></div><p><b>Fərq:</b> «Vado a scuola» — Məktəbə gedirəm. «Vieni da me?» — Mənim yanıma gəlirsən?</p><button class="primary" id="start">Praktikaya başla →</button></section>';$('go').onclick=()=>{studyVerb='andare';render()};$('come').onclick=()=>{studyVerb='venire';render()};$('prev').onclick=()=>{studyPerson=(studyPerson+5)%6;render()};$('later').onclick=()=>{studyPerson=(studyPerson+1)%6;render()};$('start').onclick=()=>switchMode(1);bind()}
render();
</script></body></html>
