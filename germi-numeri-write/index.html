<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Germì — La Sfida dei Numeri</title>
<style>:root{--green:#16884a;--dark:#0b6036;--ink:#183128;--cream:#fff8e6;--gold:#ffd45c;--ok:#dff7e6;--bad:#fff0df}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#dff5ff,#fff7df);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.wrap{max-width:680px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,var(--dark),var(--green));color:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:0 10px 28px #0002}.hero h1{margin:0;font-size:clamp(27px,7vw,44px)}.hero p{margin:5px 0 0;opacity:.92}.card{background:#fff;border-radius:24px;margin-top:12px;padding:16px;box-shadow:0 9px 26px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{font-weight:900;padding:8px 11px;border-radius:999px}.round{background:#e2f6e8;color:var(--dark)}.score{background:#fff0b7}.progress{height:10px;background:#e8eee9;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,#1da35b,var(--gold));transition:.35s}.label{text-align:center;color:#718078;font-size:13px;font-weight:750}.question{margin:8px 0 18px;text-align:center;font-size:clamp(28px,8vw,46px);font-weight:950;line-height:1.15}.answer{width:100%;border:3px solid #b6cfbe;background:#fbfffc;border-radius:17px;padding:15px;text-align:center;text-transform:lowercase;font:inherit;font-size:clamp(20px,6vw,28px);font-weight:850;color:var(--ink);outline:none}.answer:focus{border-color:#e7aa22;box-shadow:0 0 0 4px #ffd45c44}.answer.good{background:var(--ok);border-color:#35a65e}.answer.wrong{background:var(--bad);border-color:#e5a04c}.actions{display:flex;gap:8px;margin-top:11px}.btn{border:0;border-radius:15px;padding:14px;font:inherit;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;flex:1}.skip{background:#edf3ef;color:var(--dark)}.msg{min-height:54px;text-align:center;font-weight:850;padding:10px 5px 0}.hint{font-size:13px;color:#718078;text-align:center}.stage{display:none;text-align:center;padding:18px 4px}.stage .emoji{font-size:58px}.stage h2{margin:5px 0}.next{background:var(--dark);color:white;width:100%;margin-top:10px}@media(max-width:420px){.wrap{padding:6px}.card{padding:13px}.hero{padding:16px}}</style></head>
<body><div class="wrap"><div class="hero"><h1>🌱 Germì — La Sfida dei Numeri 🇮🇹</h1><p>Scrivi la risposta • 11–30 • 3 raund</p></div><div class="card" id="card"><div id="quiz"><div class="row"><span class="pill round" id="round"></span><span class="pill score" id="score"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="label">Hesabla və cavabı italyanca yaz</div><div class="question" id="question"></div><input id="answer" class="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="cavabı yaz…"><div class="actions"><button class="btn skip" id="clear">Sil</button><button class="btn check" id="check">Yoxla ✓</button></div><div class="msg" id="msg"></div><div class="hint">Enter = yoxla • Düzgün cavabdan sonra növbəti suala avtomatik keçir</div></div><div class="stage" id="stage"><div class="emoji" id="stageEmoji">🌿</div><h2 id="stageTitle"></h2><p id="stageText"></p><button class="btn next" id="next">Növbəti raund →</button></div></div></div>
<script>const rounds=[{name:"RAUND 1 • FACILE 🌱",qs:[["tre × cinque","quindici"],["sei + cinque","undici"],["venti − tre","diciassette"],["dieci + tre","tredici"],["due × otto","sedici"],["sei × due","dodici"],["sette × due","quattordici"]]},{name:"RAUND 2 • MEDIO 🌿",qs:[["undici × due","ventidue"],["nove × due","diciotto"],["trenta − sette","ventitré"],["sedici + tre","diciannove"],["quattordici + sette","ventuno"],["venticinque − cinque","venti"]]},{name:"RAUND 3 • DIFFICILE 🔥",qs:[["diciannove + nove","ventotto"],["dodici × due","ventiquattro"],["diciotto + dodici","trenta"],["quindici × due − quattro","ventisei"],["quindici + quattordici","ventinove"],["tredici + dodici","venticinque"],["trenta − sei ÷ due","ventisette"]]}];const norm=s=>(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"");let r=0,q=0,correct=0,attempts=0,locked=false;const total=rounds.reduce((n,x)=>n+x.qs.length,0);function doneBefore(){let n=0;for(let i=0;i<r;i++)n+=rounds[i].qs.length;return n+q}function render(){locked=false;quiz.style.display="block";stage.style.display="none";round.textContent=rounds[r].name;score.textContent=`${q+1} / ${rounds[r].qs.length}`;question.textContent=rounds[r].qs[q][0]+" = ?";answer.value="";answer.className="answer";msg.textContent="";bar.style.width=(doneBefore()/total*100)+"%";setTimeout(()=>answer.focus(),80)}function verify(){if(locked)return;const typed=norm(answer.value),expected=norm(rounds[r].qs[q][1]);if(!typed){msg.textContent="✍️ Əvvəlcə cavabı yaz.";answer.focus();return}attempts++;if(typed===expected){locked=true;correct++;answer.classList.add("good");msg.textContent="✅ Corretto! Bravissimo!";bar.style.width=((doneBefore()+1)/total*100)+"%";setTimeout(advance,650)}else{answer.classList.add("wrong");msg.textContent="💡 Bir də düşün. Cavabı göstərmirəm — yenidən cəhd et.";setTimeout(()=>{answer.classList.remove("wrong");answer.select()},250)}}function advance(){if(q<rounds[r].qs.length-1){q++;render();return}quiz.style.display="none";stage.style.display="block";stageEmoji.textContent=r===0?"🌿":r===1?"🔥":"🏆";stageTitle.textContent=r===2?"CAMPIONE DEI NUMERI!":"Raund tamamlandı!";stageText.textContent=r===0?"İndi əməliyyatlar bir az çətinləşir.":r===1?"Final raund: iki mərhələli hesablamalara hazırsan?":`20/20 — 11-dən 30-a qədər bütün cavabları tamamladın!`;if(r===2){next.textContent="Yenidən oyna ↻";next.onclick=()=>location.reload()}else{next.textContent="Növbəti raund →";next.onclick=()=>{r++;q=0;render()}}}check.onclick=verify;clear.onclick=()=>{answer.value="";answer.className="answer";msg.textContent="";answer.focus()};answer.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();verify()}});answer.addEventListener("input",()=>{answer.classList.remove("wrong")});render();</script></body></html>
