<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo | Essere & Accordo</title>
<style>
:root{--g:#0b4f35;--c:#fbf7ec;--gold:#d7b451;--red:#b83b3b}*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--c);color:#17362b;font-family:Arial}.app{max-width:760px;margin:auto}.brand{text-align:center}.brand h1{font:700 30px Georgia;color:var(--g);margin:0}.brand small{font-size:10px;letter-spacing:2px;color:var(--g)}h2{text-align:center;font:700 25px Georgia;color:var(--g);margin:16px 0 4px}.sub{text-align:center;color:#718078;font-size:13px}.panel{margin-top:14px;background:#fff;border:1px solid #dce6df;border-radius:24px;padding:17px;box-shadow:0 10px 28px #00000010}.top{display:flex;justify-content:space-between;font-size:11px}.round{background:#edf5ef;padding:8px 12px;border-radius:99px;font-weight:bold;color:var(--g)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.step{text-align:center;padding:7px;border-radius:9px;background:#edf0ed;font-size:10px;font-weight:bold}.step.on{background:var(--g);color:#fff}.step.done{background:#dcebdd}.ins{text-align:center;color:#718078;font-size:12px;margin:18px 0 8px}.q{text-align:center;min-height:92px}.main{font:700 29px Georgia;color:var(--g)}.az{font:italic 14px Georgia;color:#176548;margin-top:8px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans,.chip,.slot,.check,.restart{border-radius:14px;padding:12px;font-weight:bold}.ans{border:1px solid #c7d8cc;background:#f9fcfa;color:var(--g);font:700 18px Georgia}.ans.good{background:#e4f3e8}.ans.bad{background:#fff0f0;border-color:#cc6666}.builder{display:none;grid-template-columns:repeat(4,1fr);gap:7px}.slot{min-height:52px;border:2px dashed #bdcec2;background:#f8fbf9;color:var(--g)}.chips{display:none;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}.chip{border:1px solid #b8cdbf;background:white;color:var(--g);touch-action:none;-webkit-user-select:none;user-select:none}.chip.used{opacity:.25;pointer-events:none}.check{display:none;margin:12px auto 0;border:0;background:var(--g);color:white}.msg{text-align:center;min-height:25px;margin-top:12px;font:700 13px Georgia;color:var(--g)}.err{color:var(--red)}.bar{height:6px;background:#e5e9e6;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--gold);width:0}.result{display:none;text-align:center;padding:30px}.result.show{display:block}.pct{font:700 58px Georgia;color:var(--g)}.hide{display:none}.restart{border:1px solid #bfd0c4;background:#fff;color:var(--g)}footer{text-align:center;margin:12px;font:italic 13px Georgia;color:var(--g)}@media(max-width:520px){.builder{grid-template-columns:1fr 1fr}.main{font-size:25px}.chip{min-width:88px}.slot{overflow:hidden;word-break:break-word}}
</style></head><body><main class="app"><header class="brand"><div style="font-size:35px">🌳</div><h1>Da Capo</h1><small>Guided Self-Study Membership</small></header><h2>Essere & l'accordo ✨</h2><div class="sub">3 raund • hər raundda 5 tapşırıq</div><section class="panel"><div id="game"><div class="top"><span id="round" class="round"></span><span>Tapşırıq: <b id="num"></b></span></div><div class="steps"><div id="s1" class="step">1 · ESSERE</div><div id="s2" class="step">2 · ACCORDO</div><div id="s3" class="step">3 · COSTRUISCI</div></div><div id="ins" class="ins"></div><div class="q"><div id="main" class="main"></div><div id="az" class="az"></div></div><div id="answers" class="answers"></div><div id="builder" class="builder"></div><div id="chips" class="chips"></div><button id="check" class="check">✓ Yoxla</button><div id="msg" class="msg"></div><div class="bar"><div id="fill" class="fill"></div></div></div><div id="result" class="result"><h2>Risultato finale 🌱</h2><div id="pct" class="pct"></div><p id="score"></p><p id="rmsg"></p><button id="restart" class="restart">↻ Yenidən başla</button></div></section><footer>Piccoli passi, grandi risultati! 🌱</footer></main>
<script>
(()=>{const T=[
{r:1,q:"io",az:"mən",o:["sono","sei","è","siamo"],a:"sono"},{r:1,q:"voi",az:"siz",o:["siete","sono","sei","è"],a:"siete"},{r:1,q:"lei",az:"o (qadın)",o:["è","sei","sono","siamo"],a:"è"},{r:1,q:"noi",az:"biz",o:["siamo","siete","sono","è"],a:"siamo"},{r:1,q:"tu",az:"sən",o:["sei","sono","è","siete"],a:"sei"},
{r:2,q:"ragazza → ?",az:"qız → hündür qız",o:["alta","alto","alti","alte"],a:"alta"},{r:2,q:"studenti → ?",az:"tələbələr → yaxşı tələbələr",o:["bravi","brave","bravo","brava"],a:"bravi"},{r:2,q:"case → ?",az:"evlər → gözəl evlər",o:["belle","belli","bella","bello"],a:"belle"},{r:2,q:"ragazzo → ?",az:"oğlan → italyan oğlan",o:["italiano","italiana","italiani","italiane"],a:"italiano"},{r:2,q:"studentesse → ?",az:"tələbə qızlar → yorğun tələbə qızlar",o:["stanche","stanchi","stanca","stanco"],a:"stanche"},
{r:3,az:"Mən hündür tələbəyəm.",p:["Io","sono","studente","alto"],x:["sei","alta"]},{r:3,az:"O, italyan tələbə qızdır.",p:["Lei","è","studentessa","italiana"],x:["sono","italiano"]},{r:3,az:"Biz yaxşı tələbələrik.",p:["Noi","siamo","studenti","bravi"],x:["siete","brave"]},{r:3,az:"Onlar yorğun tələbə qızlardır.",p:["Loro","sono","studentesse","stanche"],x:["è","stanchi"]},{r:3,az:"Siz hündür tələbə qızlarsınız.",p:["Voi","siete","studentesse","alte"],x:["siamo","alti"]}];
let i=0,score=0,failed={},locked=false,sel=[null,null,null,null];const $=x=>document.getElementById(x),shuffle=a=>a.slice().sort(()=>Math.random()-.5);
function message(t,e=false){$("msg").textContent=t;$("msg").className=e?"msg err":"msg"}
function render(){locked=false;message("");let t=T[i];$("round").textContent=t.r==1?"ROUND 1 · ESSERE":t.r==2?"ROUND 2 · ACCORDO":"ROUND 3 · COSTRUISCI";$("num").textContent=(i+1)+" / 15";$("fill").style.width=i/15*100+"%";[1,2,3].forEach(n=>$("s"+n).className="step"+(n==t.r?" on":n<t.r?" done":""));$("answers").innerHTML=$("builder").innerHTML=$("chips").innerHTML="";$("answers").style.display=$("builder").style.display=$("chips").style.display=$("check").style.display="none";
if(t.r<3){$("ins").textContent=t.r==1?"Essere feilinin düzgün formasını seç.":"İsimlə uyğunlaşan sifəti seç.";$("main").textContent=t.q;$("az").textContent=t.az;$("answers").style.display="grid";shuffle(t.o).forEach(o=>{let b=document.createElement("button");b.className="ans";b.textContent=o;b.onclick=()=>choose(b,o,t.a);$("answers").appendChild(b)})}
else{$("ins").textContent="Sözlərə düzgün ardıcıllıqla toxun və cümləni qur.";$("main").textContent="Costruisci la frase!";$("az").textContent=t.az;$("builder").style.display="grid";$("chips").style.display="flex";$("check").style.display="block";sel=[null,null,null,null];for(let s=0;s<4;s++){let b=document.createElement("button");b.className="slot";b.textContent=s+1;b.onclick=()=>remove(s);$("builder").appendChild(b)}shuffle(t.p.concat(t.x)).forEach(w=>{let b=document.createElement("button");b.className="chip";b.textContent=w;b.dataset.w=w;b.onclick=()=>place(b);$("chips").appendChild(b)})}}
function choose(b,v,a){if(locked)return;if(v==a){locked=true;if(!failed[i])score++;b.classList.add("good");message("Corretto! ✓");next()}else{failed[i]=1;b.classList.add("bad");message("Bir daha düşün! ✕",1);setTimeout(()=>{b.classList.remove("bad");message("")},500)}}
function paint(){[...$("builder").children].forEach((b,n)=>b.textContent=sel[n]||n+1)}
function place(b){let s=sel.indexOf(null);if(s<0)return;sel[s]=b.dataset.w;b.classList.add("used");paint()}
function remove(s){if(!sel[s])return;let w=sel[s];sel[s]=null;let b=[...$("chips").children].find(x=>x.dataset.w==w&&x.classList.contains("used"));if(b)b.classList.remove("used");paint()}
$("check").onclick=()=>{if(locked)return;let t=T[i];if(sel.includes(null)){message("Əvvəlcə 4 xananı doldur.",1);return}if(sel.every((x,n)=>x==t.p[n])){locked=true;if(!failed[i])score++;message("Perfetto! ✓");next()}else{failed[i]=1;message("Ardıcıllıqda və ya uzlaşmada səhv var. Yenidən sına! ✕",1)}};
function next(){$("fill").style.width=(i+1)/15*100+"%";setTimeout(()=>{i++;i<15?render():finish()},550)}
function finish(){$("game").className="hide";$("result").className="result show";let p=Math.round(score/15*100);$("pct").textContent=p+"%";$("score").textContent=score+" / 15 — ilk cəhddə düzgün";$("rmsg").textContent=p>=87?"Bravissimo! 🌱":p>=67?"Molto bene! Bir az da məşq et. 🌱":"Bir daha sına və qaydanı möhkəmləndir. 🌱"}
$("restart").onclick=()=>{i=0;score=0;failed={};$("game").className="";$("result").className="result";render()};render()})();
</script></body></html>
