<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da Capo | Missione AVERE</title>
<style>
:root{--g:#0b4f35;--c:#fbf7ec;--gold:#d8b552;--line:#d8e4dc;--red:#b65353}*{box-sizing:border-box}body{margin:0;padding:10px;background:var(--c);font-family:Arial;color:#17362b}.app{max-width:760px;margin:auto}.brand{text-align:center;color:var(--g)}h1{font:700 30px Georgia;margin:3px}.brand small{letter-spacing:1.5px}.title{text-align:center;font:700 27px Georgia;color:var(--g);margin:15px 0 4px}.sub{text-align:center;color:#748078;font-size:13px}.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.r{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center;font-size:11px;font-weight:bold;color:#89938d}.r.on{border-color:var(--gold);background:#fffaf0;color:var(--g)}.r.done{background:#eaf4ed;color:var(--g)}.panel{background:#fffdf8;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:0 12px 28px #17362b12}.meta{display:flex;justify-content:space-between;font-size:12px}.badge{background:#edf5ef;color:var(--g);font-weight:bold;padding:7px 10px;border-radius:30px}.bar{height:6px;background:#e8ece9;border-radius:20px;margin:11px 0 16px;overflow:hidden}.fill{height:100%;background:var(--gold);transition:.25s}.prompt{text-align:center;min-height:90px}.prompt h2{font:700 27px Georgia;color:var(--g);margin:8px}.prompt p{margin:4px;color:#607067}.az{font:italic 15px Georgia!important;color:#24664d!important}.ladder{display:grid;gap:7px;max-width:520px;margin:auto}.step{display:grid;grid-template-columns:1fr 1.3fr;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fafcf9}.person{padding:9px;font-weight:bold;color:var(--g);border-right:1px solid var(--line)}.target{min-height:48px;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#8a958e;border:2px dashed transparent}.target.hot{background:#eaf5ed}.target.ok{background:#edf7ef;color:var(--g)}.target.bad{background:#fff0f0;color:var(--red)}.bank,.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.chip,.choice{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;border:1px solid #bdd0c2;background:#fff;color:var(--g);border-radius:14px;padding:13px 5px;text-align:center;font-weight:bold;font-size:16px}.chip.used{opacity:.2;pointer-events:none}.choice.bad{background:#fff0f0}.choice.good{background:#eaf5ed}.msg{text-align:center;min-height:24px;margin-top:10px;font-size:13px;font-weight:bold;color:var(--g)}.audio{display:none;margin:7px auto;border:0;border-radius:12px;background:var(--g);color:#fff;padding:10px 14px;font-weight:bold}.audio.show{display:block}.sentence{font:700 25px Georgia;line-height:1.4}.blank{display:inline-block;min-width:75px;border-bottom:3px solid var(--gold)}.result{display:none;text-align:center;padding:25px}.result.show{display:block}.pct{font:700 52px Georgia;color:var(--g)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0}.stat{border:1px solid var(--line);border-radius:13px;padding:10px;font-size:11px}.stat b{display:block;font-size:19px;color:var(--g)}.restart{border:0;border-radius:13px;background:var(--g);color:#fff;padding:12px 18px;font-weight:bold}.drag{position:fixed!important;z-index:99;pointer-events:none;width:120px;opacity:.94;box-shadow:0 12px 25px #0003}@media(max-width:520px){body{padding:6px}.panel{padding:11px}.chip,.choice{font-size:14px}.sentence{font-size:22px}}
</style></head><body><main class="app"><header class="brand"><div style="font-size:34px">🌳</div><h1>Da Capo</h1><small>GUIDED SELF-STUDY MEMBERSHIP</small></header><div class="title">Missione AVERE 🇮🇹</div><div class="sub">Gör → uyğunlaşdır → cümlədə istifadə et.</div><div class="rounds"><div id="r0" class="r on">🪜 ROUND 1<br>La scala</div><div id="r1" class="r">⚡ ROUND 2<br>Chi ha?</div><div id="r2" class="r">🎭 ROUND 3<br>Nella vita</div></div><section class="panel"><div id="game"><div class="meta"><span id="badge" class="badge"></span><span id="counter"></span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="prompt" class="prompt"></div><div id="ladder" class="ladder"></div><div id="bank" class="bank"></div><div id="choices" class="choices"></div><div id="msg" class="msg"></div><button id="audio" class="audio">🔊 Dinlə</button></div><div id="result" class="result"><div style="font-size:48px">🏆🌱</div><h2>Missione completata!</h2><div id="pct" class="pct"></div><div id="score"></div><div class="stats"><div class="stat">La scala<b id="s0"></b></div><div class="stat">Chi ha?<b id="s1"></b></div><div class="stat">Nella vita<b id="s2"></b></div></div><button id="restart" class="restart">↻ Yenidən oyna</button></div></section></main>
<script>
(()=>{const F=[["IO","MƏN","HO","Io ho"],["TU","SƏN","HAI","Tu hai"],["LUI / LEI","O","HA","Lui, lei ha"],["NOI","BİZ","ABBIAMO","Noi abbiamo"],["VOI","SİZ","AVETE","Voi avete"],["LORO","ONLAR","HANNO","Loro hanno"]].map(x=>({p:x[0],az:x[1],v:x[2],say:x[3]}));
const L=[["Io","ho","fame.","Mən acam.","Io ho fame."],["Tu","hai","sonno.","Sənin yuxun gəlir.","Tu hai sonno."],["Lei","ha","fretta.","O tələsir.","Lei ha fretta."],["Noi","abbiamo","paura.","Biz qorxuruq.","Noi abbiamo paura."],["Voi","avete","sete.","Siz susamısınız.","Voi avete sete."],["Loro","hanno","ragione.","Onlar haqlıdırlar.","Loro hanno ragione."]].map(x=>({p:x[0],v:x[1],tail:x[2],az:x[3],full:x[4]}));
const $=x=>document.getElementById(x),sh=a=>[...a].sort(()=>Math.random()-.5);let R=0,Q=0,score=[0,0,0],fail={},done=0,last="";
function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.8;let v=speechSynthesis.getVoices().find(v=>/^it(-|_)/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function nav(){for(let i=0;i<3;i++)$("r"+i).className="r "+(i<R?"done":i==R?"on":"")}
function clear(){nav();$("ladder").innerHTML=$("bank").innerHTML=$("choices").innerHTML="";$("msg").textContent="";$("audio").className="audio";$("counter").textContent=(R*6+Q+1)+" / 18";$("fill").style.width=((R*6+Q)/18*100)+"%"}
function render(){clear();if(R==0){$("badge").textContent="ROUND 1 · LA SCALA";$("counter").textContent=(done+1)+" / 6";$("prompt").innerHTML="<h2>🪜 Costruisci la scala</h2><p>AVERE formasını uyğun şəxsə sürüşdür.</p><p class=az>Şəxs əvəzliyinin Azərbaycan dilində qarşılığı da göstərilib.</p>";F.forEach((x,i)=>{let s=document.createElement("div");s.className="step";s.innerHTML="<div class=person>"+x.p+"<br><small>"+x.az+"</small></div><div class=target data-i="+i+">buraya</div>";$("ladder").appendChild(s)});sh(F.map((x,i)=>({x,i}))).forEach(o=>{let b=document.createElement("div");b.className="chip";b.textContent=o.x.v;b.onclick=()=>place(b,o.x.v,document.querySelector('.target[data-i="'+o.i+'"]'),o.i);drag(b,o.x.v);$("bank").appendChild(b)})}
else if(R==1){let x=F[Q];$("badge").textContent="ROUND 2 · CHI HA?";$("prompt").innerHTML="<h2>"+x.p+"</h2><p class=az>"+x.az+"</p><p>AVERE feilinin düzgün formasını seç.</p>";choices(sh([x.v,...sh(F.filter((_,i)=>i!=Q)).slice(0,2).map(z=>z.v)]),x.v,x.say)}
else{let x=L[Q];$("badge").textContent="ROUND 3 · NELLA VITA";$("prompt").innerHTML="<div class=sentence>"+x.p+" <span class=blank>___</span> "+x.tail+"</div><p class=az>"+x.az+"</p><p>Düzgün AVERE formasını seç.</p>";let all=["ho","hai","ha","abbiamo","avete","hanno"];choices(sh([x.v,...sh(all.filter(v=>v!=x.v)).slice(0,2)]),x.v,x.full)}}
function place(el,v,t,i){if(!t||t.classList.contains("ok")||el.classList.contains("used"))return;if(v==F[i].v){t.textContent=v;t.className="target ok";el.classList.add("used");done++;if(!fail["0-"+i])score[0]++;last=F[i].say;speak(last);$("msg").textContent="✓ "+F[i].p+" → "+v+" · "+F[i].az;if(done==6)setTimeout(()=>{R=1;Q=0;render()},800)}else{fail["0-"+i]=1;t.classList.add("bad");setTimeout(()=>t.classList.remove("bad"),450)}}
function choices(a,c,sp){a.forEach(v=>{let b=document.createElement("button");b.className="choice";b.textContent=v;b.onclick=()=>{if(b.disabled)return;if(v==c){[...$("choices").children].forEach(x=>x.disabled=true);b.classList.add("good");if(!fail[R+"-"+Q])score[R]++;last=sp;speak(sp);$("audio").className="audio show";$("msg").textContent="✓ "+sp;setTimeout(next,800)}else{fail[R+"-"+Q]=1;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400)}};$("choices").appendChild(b)})}
function next(){Q++;if(Q==6){Q=0;R++;if(R==3)return finish()}render()}function finish(){$("game").style.display="none";$("result").className="result show";let n=score.reduce((a,b)=>a+b,0);$("pct").textContent=Math.round(n/18*100)+"%";$("score").textContent=n+" / 18 — ilk cəhddə düzgün";score.forEach((x,i)=>$("s"+i).textContent=x+"/6")}
function drag(el,v){let on=false,dx=0,dy=0;el.addEventListener("pointerdown",e=>{if(el.classList.contains("used"))return;let r=el.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;on=true;el.setPointerCapture?.(e.pointerId);el.classList.add("drag");el.style.left=e.clientX-dx+"px";el.style.top=e.clientY-dy+"px";e.preventDefault()});el.addEventListener("pointermove",e=>{if(!on)return;el.style.left=e.clientX-dx+"px";el.style.top=e.clientY-dy+"px";document.querySelectorAll(".target").forEach(t=>{let r=t.getBoundingClientRect();t.classList.toggle("hot",e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)})});el.addEventListener("pointerup",e=>{if(!on)return;let hit;document.querySelectorAll(".target").forEach(t=>{let r=t.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)hit=t;t.classList.remove("hot")});el.classList.remove("drag");el.style.left=el.style.top="";on=false;if(hit)place(el,v,hit,+hit.dataset.i)})}
$("audio").onclick=()=>speak(last);$("restart").onclick=()=>{R=Q=done=0;score=[0,0,0];fail={};$("game").style.display="block";$("result").className="result";render()};render()})();
</script></body></html>
