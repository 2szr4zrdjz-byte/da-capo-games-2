<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Da Capo | Gianna & Lorenzo</title><style>
:root{--g:#1f5b43;--cream:#f7f1e5;--gold:#c89b45;--cyan:#66cbd2;--olive:#a79f7d;--ink:#24342c}*{box-sizing:border-box}body{margin:0;background:#eef4ef;font-family:Arial,sans-serif;color:var(--ink);padding:14px}.app{max-width:780px;margin:auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 16px 50px #1f5b4320}.head{background:var(--g);color:#fff;text-align:center;padding:22px}.head h1{font:700 31px Georgia,serif;margin:5px}.head small{color:#f1dca8}.body{padding:18px}.chat{margin-top:8px}.row{display:flex;margin:12px 0}.row.left{justify-content:flex-start}.row.right{justify-content:flex-end}.bubble{max-width:82%;padding:13px 15px;border-radius:19px;font-size:17px;line-height:1.35}.left .bubble{background:var(--cyan);color:#fff;border-top-left-radius:5px}.right .bubble{background:var(--olive);color:#fff;border-top-right-radius:5px}.play{border:0;background:#ffffff55;border-radius:50%;margin-left:7px;cursor:pointer}.student{position:relative;padding-bottom:51px}.rec{position:absolute;right:9px;bottom:7px;border:0;border-radius:12px;background:#fff;color:#675f44;padding:8px 11px;font-weight:700;cursor:pointer}.rec.recording{background:#b84b4b;color:#fff}.rec.good{background:#e8f6ec;color:#22633d}.linefb{font-size:12px;margin-top:7px;font-weight:700}.linefb.good{color:#eaffef}.linefb.bad{color:#fff0c8}.status{font-size:13px;color:#66756d;text-align:center;min-height:22px;margin-top:7px}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}.btn{border:0;border-radius:13px;background:var(--g);color:#fff;padding:12px 15px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45}.task{border-top:2px solid #e7eee9;padding-top:20px}.task h2{font:700 25px Georgia,serif;color:var(--g)}.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side{display:grid;gap:9px}.item{padding:12px;border:2px solid #dce6df;border-radius:13px;background:#fff;cursor:pointer;line-height:1.3}.item.sel{border-color:var(--gold);background:#fff8e8}.item.done{background:#eaf6ed;border-color:#7db08d;pointer-events:none}.item.bad{background:#fff0f0;border-color:#cf7777}.score{text-align:center;font-weight:700;color:var(--g);margin-top:14px}@media(max-width:560px){.bubble{max-width:94%;font-size:16px}.body{padding:13px}.match{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header class="head"><small>DA CAPO · SPEAKING</small><h1>Gianna & Lorenzo 💬</h1><div>Ascolta · Rispondi · Riascolta</div></header><main class="body"><div class="chat" id="chat"></div><div class="status" id="status"></div><div class="controls"><button class="btn" id="full" disabled>▶ Full dialoq</button><button class="btn" id="reset">↻ Yenidən başla</button></div><section class="task"><h2>Abbina le frasi</h2><p>Sol tərəfdəki başlanğıcı düzgün davamla uyğunlaşdır.</p><div class="match"><div class="side" id="L"></div><div class="side" id="R"></div></div><div class="score" id="score"></div></section></main></div><script>
const lines=[
['G','Ciao Lorenzo! Sei libero questo sabato?'],['L','Ciao Gianna! Quando? Di pomeriggio ho un appuntamento con un’amica...'],['G','Vado a mangiare una pizza con il mio collega Fabio e con la sua ragazza, Jessica.'],['L','Dove e a che ora?'],['G','In un ristorante in centro, Mamma Rosa. Alle 8.'],['L','Bene, alle 8 sono libero.'],['G','Perfetto!'],['L','Ok. A sabato, allora!'],['G','Sì, ciao.']];
const studentIds=[1,3,5,7],chat=document.querySelector('#chat'),status=document.querySelector('#status');
let recs={},mediaRecorder,chunks=[],active=null,sharedStream=null,recognition=null,heard='',audioCtx=null;
function speak(text){return new Promise(res=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=.88;let vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang.toLowerCase().startsWith('it'));if(v)u.voice=v;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N} ]/gu,' ').replace(/\s+/g,' ').trim()}
function similarity(a,b){a=norm(a);b=norm(b);let A=a.split(' '),B=b.split(' ');let hit=A.filter(w=>B.includes(w)).length;return hit/Math.max(1,A.length)}
function pronunciationOK(heard,expected){let h=norm(heard),e=norm(expected);if(!h)return null;if(h===e)return true;return similarity(h,e)>=0.72}
async function getMic(){if(sharedStream&&sharedStream.active)return sharedStream;sharedStream=await navigator.mediaDevices.getUserMedia({audio:true});return sharedStream}
function startRecognition(){heard='';let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){recognition=null;return}recognition=new SR();recognition.lang='it-IT';recognition.interimResults=true;recognition.continuous=false;recognition.maxAlternatives=1;recognition.onresult=e=>{heard=Array.from(e.results).map(r=>r[0].transcript).join(' ')};try{recognition.start()}catch(e){}}
function stopRecognition(){if(recognition){try{recognition.stop()}catch(e){}}}
lines.forEach((x,i)=>{let r=document.createElement('div');r.className='row '+(x[0]=='G'?'left':'right');let b=document.createElement('div');b.className='bubble'+(x[0]=='L'?' student':'');b.append(document.createTextNode(x[1]));if(x[0]=='G'){let p=document.createElement('button');p.className='play';p.textContent='🔊';p.onclick=()=>speak(x[1]);b.appendChild(p)}else{let fb=document.createElement('div');fb.className='linefb';fb.id='fb'+i;let q=document.createElement('button');q.className='rec';q.textContent='🎙️ Səsləndir';q.onclick=()=>toggleRec(i,q,fb);b.appendChild(q);b.appendChild(fb)}r.appendChild(b);chat.appendChild(r)});
async function toggleRec(i,btn,fb){
 if(active!==null){if(active===i){stopRecognition();mediaRecorder.stop()}return}
 try{
  const stream=await getMic();chunks=[];heard='';mediaRecorder=new MediaRecorder(stream);active=i;
  btn.classList.add('recording');btn.classList.remove('good');btn.textContent='⏹ Bitir';fb.textContent='';status.textContent='🎙️ Səni dinləyirəm...';
  startRecognition();
  mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mediaRecorder.onstop=async()=>{
   stopRecognition();await new Promise(r=>setTimeout(r,350));
   let blob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});let ok=pronunciationOK(heard,lines[i][1]);
   btn.classList.remove('recording');active=null;
   if(ok===false){
     fb.className='linefb bad';fb.textContent='↻ Bir daha cəhd et — tələffüzü təkrar dinlə.';
     btn.textContent='🎙️ Təkrar səsləndir';status.textContent='Bir daha cəhd et. 🔊';
     await speak(lines[i][1]);return;
   }
   if(recs[i]?.url)URL.revokeObjectURL(recs[i].url);await saveRecording(i,blob);
   btn.classList.add('good');btn.textContent='✅ Doğru — yenidən yaz';
   fb.className='linefb good';fb.textContent=ok===true?'✓ Tələffüz tanındı — əla!':'✓ Səs qeydə alındı.';
   status.textContent=ok===true?'Bravissimo! Tələffüz doğrudur. 👏':'Səs uğurla qeydə alındı.';
   document.querySelector('#full').disabled=!studentIds.every(id=>recs[id]);
  };
  mediaRecorder.start();
 }catch(e){status.textContent='Mikrofonu aktivləşdirmək mümkün olmadı.'}
}
async function ensureAudioCtx(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)()}if(audioCtx.state==='suspended')await audioCtx.resume()}
async function saveRecording(i,blob){try{let buf=await blob.arrayBuffer();await ensureAudioCtx();let decoded=await audioCtx.decodeAudioData(buf.slice(0));recs[i]={blob,buffer:decoded}}catch(e){recs[i]={blob,url:URL.createObjectURL(blob)}}}
function playRecorded(rec){return new Promise(async res=>{if(!rec){res();return}try{if(rec.buffer){await ensureAudioCtx();let src=audioCtx.createBufferSource();src.buffer=rec.buffer;src.connect(audioCtx.destination);src.onended=res;src.start();}else{let a=new Audio(rec.url);a.onended=res;a.onerror=res;await a.play();}}catch(e){res()}})}
document.querySelector('#full').onclick=async()=>{await ensureAudioCtx();status.textContent='▶ Dialoq səslənir...';for(let i=0;i<lines.length;i++){if(lines[i][0]=='G')await speak(lines[i][1]);else if(recs[i])await playRecorded(recs[i]);await new Promise(r=>setTimeout(r,230))}status.textContent='Dialoq tamamlandı. Bravissimo! 👏'};
document.querySelector('#reset').onclick=()=>{Object.values(recs).forEach(r=>{if(r?.url)URL.revokeObjectURL(r.url)});recs={};document.querySelectorAll('.rec').forEach(x=>{x.textContent='🎙️ Səsləndir';x.classList.remove('recording','good')});document.querySelectorAll('.linefb').forEach(x=>x.textContent='');document.querySelector('#full').disabled=true;status.textContent='';};
window.addEventListener('beforeunload',()=>{if(sharedStream)sharedStream.getTracks().forEach(t=>t.stop())});
const pairs=[['Gianna invita','Lorenzo a cena.'],['Lorenzo ha','un appuntamento.'],['Fabio è','un collega di Gianna.'],['Mamma Rosa è','un ristorante.'],['Il ristorante è','in centro.'],['Jessica è','la ragazza di Fabio.']];let sel=null,done=0;let left=pairs.map((p,i)=>[p[0],i]),right=pairs.map((p,i)=>[p[1],i]).sort(()=>Math.random()-.5);
function add(side,arr){let el=document.querySelector(side);arr.forEach(([t,i])=>{let d=document.createElement('div');d.className='item';d.textContent=t;d.dataset.i=i;d.onclick=()=>pick(d,side);el.appendChild(d)})}add('#L',left);add('#R',right);
function pick(el,side){if(el.classList.contains('done'))return;if(side=='#L'){document.querySelectorAll('#L .item').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');sel=el;return}if(!sel)return;if(el.dataset.i===sel.dataset.i){el.classList.add('done');sel.classList.add('done');sel.classList.remove('sel');sel=null;done++;document.querySelector('#score').textContent=done==6?'6/6 — Perfetto! 🌱':done+'/6 düzgün'}else{el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),500)}}
</script></body></html>
